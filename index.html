<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <meta
    name="description"
    content="P.A.G Docs - PT Putra Aulia Group"
  >

  <title>P.A.G Docs</title>


  <!-- =====================================================
       STYLE
       ===================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #111827;
    }


    /* =====================================================
       APP FRAME
       ===================================================== */

    #appFrame {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;

      background: #ffffff;

      display: block;
    }


    /* =====================================================
       NOTIFICATION PERMISSION GATE

       PENTING:
       Overlay INI BUKAN splash screen.

       Hanya digunakan ketika:
       Notification.permission === "default"

       Jika permission sudah granted:
       aplikasi langsung dibuka.
       ===================================================== */

    #lockScreenOverlay {

      position: fixed;

      inset: 0;

      z-index: 999999;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #111827 0%,
          #172033 100%
        );

      padding: 24px;

      opacity: 1;

      visibility: visible;

      transition:
        opacity .2s ease,
        visibility .2s ease;
    }


    #lockScreenOverlay.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }


    /* =====================================================
       LOCK CARD
       ===================================================== */

    #lockCard {

      width: min(440px, 100%);

      background: #ffffff;

      border-radius: 26px;

      padding: 36px 30px 30px;

      text-align: center;

      box-shadow:
        0 30px 80px rgba(0,0,0,.40);

      animation:
        pagLockIn .22s ease;
    }


    @keyframes pagLockIn {

      from {

        opacity: 0;

        transform:
          translateY(10px)
          scale(.98);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /* =====================================================
       ICON
       ===================================================== */

    #lockIcon {

      width: 64px;
      height: 64px;

      margin: 0 auto 20px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: #eff6ff;

      border: 2px solid #bfdbfe;

      font-size: 30px;

      line-height: 1;
    }


    /* =====================================================
       TITLE
       ===================================================== */

    #lockTitle {

      margin: 0 0 12px;

      color: #111827;

      font-size: 20px;

      line-height: 1.3;

      font-weight: 800;

      letter-spacing: .2px;
    }


    /* =====================================================
       MESSAGE
       ===================================================== */

    #lockMessage {

      margin: 0 auto 22px;

      max-width: 370px;

      color: #64748b;

      font-size: 14px;

      line-height: 1.65;
    }


    /* =====================================================
       BUTTON
       ===================================================== */

    #lockActionBtn {

      width: 100%;

      min-height: 48px;

      border: 0;

      border-radius: 13px;

      padding: 13px 18px;

      background: #2563eb;

      color: #ffffff;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform .15s ease,
        opacity .15s ease,
        background .15s ease;
    }


    #lockActionBtn:hover {

      opacity: .93;
    }


    #lockActionBtn:active {

      transform: scale(.985);
    }


    #lockActionBtn:disabled {

      opacity: .55;

      cursor: wait;

      transform: none;
    }


    /* =====================================================
       HINT
       ===================================================== */

    #lockHint {

      margin-top: 15px;

      color: #94a3b8;

      font-size: 12px;

      line-height: 1.6;

      min-height: 19px;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 480px) {

      #lockCard {

        padding:
          30px 22px 24px;

        border-radius: 22px;
      }

      #lockTitle {

        font-size: 18px;
      }

      #lockMessage {

        font-size: 13px;
      }

    }

  </style>

</head>


<body>

    /* =====================================================
       DEVICE ID
       ===================================================== */

    function getDeviceId() {

      const KEY =
        "PAG_DOCS_PUSH_DEVICE_ID";


      let id =
        localStorage.getItem(KEY);


      if (!id) {

        id =
          "pag-" +
          Date.now().toString(36) +
          "-" +
          Math.random()
            .toString(36)
            .slice(2, 10);


        localStorage.setItem(
          KEY,
          id
        );
      }


      return id;
    }


    /* =====================================================
       DEVICE LABEL
       ===================================================== */

    function getDeviceLabel() {

      if (_deviceLabel) {

        return _deviceLabel;
      }


      const ua =
        navigator.userAgent || "";


      const uaLower =
        ua.toLowerCase();


      let browser =
        "Browser";


      if (
        uaLower.includes("edg/")
      ) {

        browser =
          "Microsoft Edge";

      } else if (
        uaLower.includes("firefox")
      ) {

        browser =
          "Mozilla Firefox";

      } else if (
        uaLower.includes("chrome")
      ) {

        browser =
          "Google Chrome";

      } else if (
        uaLower.includes("safari")
      ) {

        browser =
          "Safari";
      }


      let os =
        "Desktop";


      if (
        /android/i.test(ua)
      ) {

        os =
          "Android";

      } else if (
        /iphone|ipad|ipod/i.test(ua)
      ) {

        os =
          "iOS";

      } else if (
        /windows/i.test(ua)
      ) {

        os =
          "Windows";

      } else if (
        /macintosh|mac os/i.test(ua)
      ) {

        os =
          "macOS";

      } else if (
        /linux/i.test(ua)
      ) {

        os =
          "Linux";
      }


      _deviceLabel =
        browser +
        " • " +
        os;


      return _deviceLabel;
    }


    /* =====================================================
       BASE64 → UINT8ARRAY
       ===================================================== */

    function urlBase64ToUint8Array(
      base64String
    ) {

      if (!base64String) {

        throw new Error(
          "VAPID public key kosong."
        );
      }


      const clean =
        String(base64String)
          .trim()
          .replace(/-/g, "+")
          .replace(/_/g, "/");


      const padding =
        "=".repeat(
          (
            4 -
            (
              clean.length % 4
            )
          ) % 4
        );


      let raw;


      try {

        raw =
          window.atob(
            clean + padding
          );

      } catch (error) {

        throw new Error(
          "VAPID public key bukan Base64 yang valid."
        );
      }


      const output =
        new Uint8Array(
          raw.length
        );


      for (
        let i = 0;
        i < raw.length;
        i++
      ) {

        output[i] =
          raw.charCodeAt(i);
      }


      /*
       * EC P-256 public key:
       * 65 byte.
       */

      if (
        output.length !== 65
      ) {

        throw new Error(
          "VAPID public key tidak valid. " +
          "Panjang key = " +
          output.length +
          " byte, seharusnya 65 byte."
        );
      }


      if (
        output[0] !== 4
      ) {

        throw new Error(
          "VAPID public key bukan EC P-256."
        );
      }


      return output;
    }


    /* =====================================================
       LOCK — SHOW
       ===================================================== */

    function tampilkanLockNotifikasi(
      title,
      message,
      buttonText,
      hint,
      icon
    ) {

      const overlay =
        el("lockScreenOverlay");

      const titleEl =
        el("lockTitle");

      const messageEl =
        el("lockMessage");

      const buttonEl =
        el("lockActionBtn");

      const hintEl =
        el("lockHint");

      const iconEl =
        el("lockIcon");


      if (!overlay) {

        return;
      }


      overlay.classList.remove(
        "hidden"
      );


      if (titleEl) {

        titleEl.textContent =
          title ||
          "NOTIFIKASI";
      }


      if (messageEl) {

        messageEl.textContent =
          message ||
          "";
      }


      if (buttonEl) {

        buttonEl.disabled =
          false;

        buttonEl.textContent =
          buttonText ||
          "Coba Lagi";
      }


      if (hintEl) {

        hintEl.textContent =
          hint ||
          "";
      }


      if (iconEl) {

        iconEl.textContent =
          icon ||
          "🔔";
      }

    }


    /* =====================================================
       LOCK — HIDE
       ===================================================== */

    function sembunyikanLockNotifikasi() {

      const overlay =
        el("lockScreenOverlay");


      if (!overlay) {

        return;
      }


      overlay.classList.add(
        "hidden"
      );

    }


    /* =====================================================
       LOCK — ERROR

       ERROR TIDAK LAGI MENGUNCI APLIKASI.

       Ini hanya digunakan untuk kasus permission
       yang masih default dan browser benar-benar
       membutuhkan interaksi user.
       ===================================================== */

    function tampilkanInfoNotifikasi(
      message,
      hint
    ) {

      tampilkanLockNotifikasi(

        "AKTIFKAN NOTIFIKASI",

        message ||
          "Notifikasi P.A.G Docs belum diaktifkan.",

        "Aktifkan Notifikasi",

        hint ||
          "Klik tombol untuk memberikan izin.",

        "🔔"

      );

    }


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    async function siapkanServiceWorker() {

      if (
        !("serviceWorker" in navigator)
      ) {

        throw new Error(
          "Browser tidak mendukung Service Worker."
        );
      }


      /*
       * Gunakan registration lama jika sudah ada.
       */

      if (
        _serviceWorkerRegistration
      ) {

        return _serviceWorkerRegistration;
      }


      /*
       * Coba gunakan registration yang sudah ada.
       */

      try {

        const existing =
          await navigator.serviceWorker.getRegistration(
            "./"
          );


        if (existing) {

          _serviceWorkerRegistration =
            existing;

        }

      } catch (error) {

        console.warn(
          "[PAG SW] getRegistration gagal:",
          error
        );

      }


      /*
       * Jika belum ada, register.
       */

      if (
        !_serviceWorkerRegistration
      ) {

        _serviceWorkerRegistration =
          await navigator.serviceWorker.register(
            SW_PATH,
            {
              scope: "./"
            }
          );

      }


      /*
       * Tunggu sampai ready.
       *
       * Jangan menunggu controller secara manual.
       * navigator.serviceWorker.ready sudah cukup
       * untuk PushManager.
       */

      try {

        _serviceWorkerRegistration =
          await navigator.serviceWorker.ready;

      } catch (error) {

        console.warn(
          "[PAG SW] ready gagal:",
          error
        );

      }


      console.log(
        "[PAG SW] Service Worker siap."
      );


      return _serviceWorkerRegistration;
    }


    /* =====================================================
       PUSH SUBSCRIPTION
       ===================================================== */

    async function buatPushSubscription() {

      if (
        !("PushManager" in window)
      ) {

        throw new Error(
          "Browser tidak mendukung PushManager."
        );
      }


      if (
        Notification.permission !==
        "granted"
      ) {

        throw new Error(
          "Izin notifikasi belum diberikan."
        );
      }


      if (
        !_serviceWorkerRegistration
      ) {

        await siapkanServiceWorker();

      }


      const registration =
        _serviceWorkerRegistration;


      if (!registration) {

        throw new Error(
          "Service Worker belum tersedia."
        );
      }


      const applicationServerKey =
        urlBase64ToUint8Array(
          VAPID_PUBLIC_KEY
        );


      let subscription =
        await registration.pushManager
          .getSubscription();


      /*
       * Buat subscription hanya jika belum ada.
       */

      if (!subscription) {

        console.log(
          "[PAG PUSH] Membuat subscription baru..."
        );


        subscription =
          await registration.pushManager
            .subscribe({

              userVisibleOnly:
                true,

              applicationServerKey:
                applicationServerKey

            });

      }


      if (!subscription) {

        throw new Error(
          "Browser tidak mengembalikan Push Subscription."
        );
      }


      const json =
        subscription.toJSON();


      if (
        !json ||
        !json.endpoint ||
        !json.keys ||
        !json.keys.p256dh ||
        !json.keys.auth
      ) {

        throw new Error(
          "Push Subscription tidak lengkap."
        );
      }


      _pushSubscription =
        subscription;


      _pushSubscriptionJSON =
        json;


      console.log(
        "[PAG PUSH] Subscription valid."
      );


      return {

        subscription:
          subscription,

        json:
          json

      };

    }


    /* =====================================================
       SUPABASE REQUEST
       ===================================================== */

    async function supabaseRequest(
      path,
      options
    ) {

      const opts =
        options || {};


      const headers =
        Object.assign(

          {

            apikey:
              SB_KEY,

            Authorization:
              "Bearer " +
              SB_KEY,

            "Content-Type":
              "application/json",

            Prefer:
              "return=representation"

          },

          opts.headers || {}

        );


      const response =
        await fetch(

          SB_URL +
          path,

          Object.assign(

            {},

            opts,

            {

              headers:
                headers

            }

          )

        );


      const text =
        await response.text();


      let data =
        null;


      if (text) {

        try {

          data =
            JSON.parse(text);

        } catch (error) {

          data =
            text;

        }

      }


      if (!response.ok) {

        const errorMessage =

          data &&
          typeof data === "object"

            ? (

                data.message ||

                data.error_description ||

                data.hint ||

                data.details ||

                "Supabase request gagal."

              )

            :

              String(data);


        throw new Error(

          "Supabase " +
          response.status +
          ": " +
          errorMessage

        );

      }


      return data;
    }


    /* =====================================================
       SIMPAN SUBSCRIPTION KE SUPABASE
       ===================================================== */

    async function simpanSubscriptionKeSupabase(
      subscriptionJSON
    ) {

      if (
        !subscriptionJSON ||
        !subscriptionJSON.endpoint
      ) {

        throw new Error(
          "Subscription tidak valid."
        );
      }


      const payload = {

        device_id:
          _deviceId,

        user_id:
          _userSession?.user_id ||
          null,

        role:
          _userSession?.role ||
          "semua",

        endpoint:
          subscriptionJSON.endpoint,

        keys_p256dh:
          subscriptionJSON.keys?.p256dh ||
          "",

        keys_auth:
          subscriptionJSON.keys?.auth ||
          "",

        device_label:
          getDeviceLabel(),

        updated_at:
          new Date().toISOString()

      };


      console.log(
        "[PAG PUSH] Menyimpan subscription..."
      );


      /*
       * Endpoint dibuat UNIQUE di Supabase.
       *
       * on_conflict=endpoint
       * akan meng-update subscription lama.
       */

      const result =
        await supabaseRequest(

          "/rest/v1/web_push_subscriptions" +
          "?on_conflict=endpoint",

          {

            method:
              "POST",

            headers: {

              Prefer:
                "resolution=merge-duplicates,return=representation"

            },

            body:
              JSON.stringify(
                payload
              )

          }

        );


      console.log(
        "[PAG PUSH] Subscription tersimpan."
      );


      /*
       * Cache lokal hanya indikator.
       * Bukan sumber otorisasi.
       */

      try {

        localStorage.setItem(
          "PAG_PUSH_REGISTERED",
          "1"
        );

        localStorage.setItem(
          "PAG_PUSH_ENDPOINT",
          subscriptionJSON.endpoint
        );

      } catch (storageError) {

        console.warn(
          "[PAG PUSH] localStorage gagal:",
          storageError
        );

      }


      return result;
    }


    /* =====================================================
       UPDATE USER SESSION
       ===================================================== */

    async function updateSubscriptionSession() {

      if (
        !_pushSubscriptionJSON
      ) {

        return;
      }


      try {

        console.log(

        /*
         * Jangan ganggu aplikasi hanya karena

        );

      }

    }


    /* =====================================================
       LOAD APPS SCRIPT
       ===================================================== */

    function muatAplikasiUtama() {

      if (_appLoaded) {

        return;
      }


      const iframe =
        el("appFrame");


      if (!iframe) {

        throw new Error(
          "appFrame tidak ditemukan."
        );
      }


      _appLoaded =
        true;


      iframe.src =
        APPS_SCRIPT_EXEC_URL;


      console.log(
        "[PAG] Apps Script dimuat."
      );

    }


    /* =====================================================
       PREPARE PUSH BACKGROUND
       ===================================================== */

    async function siapkanPushBackground() {

      /*
       * Jika browser tidak mendukung push,
       * aplikasi tetap boleh berjalan.
       */

      if (
        !("Notification" in window)
      ) {

        console.warn(
          "[PAG PUSH] Notification API tidak tersedia."
        );

        return false;
      }


      if (
        !("serviceWorker" in navigator)
      ) {

        console.warn(
          "[PAG PUSH] Service Worker tidak tersedia."
        );

        return false;
      }


      if (
        !("PushManager" in window)
      ) {

        console.warn(
          "[PAG PUSH] PushManager tidak tersedia."
        );

        return false;
      }


      if (
        Notification.permission !==
        "granted"
      ) {

        return false;
      }


      try {

        /*
         * Service Worker.
         */

        await siapkanServiceWorker();


        /*
         * Subscription.
         */

        const hasil =
          await buatPushSubscription();


        /*
         * Simpan ke Supabase.
         */

        await simpanSubscriptionKeSupabase(
          hasil.json
        );


        console.log(
          "[PAG PUSH] Push siap."
        );


        return true;

      } catch (error) {

        /*
         * PENTING:
         *
         * Jangan kunci aplikasi jika push gagal.
         *
         * Aplikasi utama tetap berjalan.
         */

        console.warn(
          "[PAG PUSH] Background setup gagal:",
          error
        );


        return false;

      }

    }


    /* =====================================================
       PERMISSION CHECK

       FUNGSI INI TIDAK LAGI DIPANGGIL BERULANG
       SAAT FOCUS / VISIBILITY / PAGESHOW.
       ===================================================== */

    async function cekPermissionAwal() {

      if (
        !("Notification" in window)
      ) {

        /*
         * Browser tidak punya notification.
         * Tetap buka aplikasi.
         */

        muatAplikasiUtama();

        return;
      }


      const permission =
        Notification.permission;


      console.log(
        "[PAG PUSH] Permission:",
        permission
      );


      /* ===================================================
         GRANTED
         =================================================== */

      if (
        permission ===
        "granted"
      ) {

        /*
         * LANGSUNG BUKA APLIKASI.
         *
         * Tidak ada lock.
         */

        sembunyikanLockNotifikasi();

        muatAplikasiUtama();


        /*
         * Push dipersiapkan di background.
         */

        void siapkanPushBackground();


        return;
      }


      /* ===================================================
         DENIED
         =================================================== */

      if (
        permission ===
        "denied"
      ) {

        /*
         * JANGAN KUNCI APLIKASI.
         *
         * User tetap bisa menggunakan P.A.G Docs.
         */

        sembunyikanLockNotifikasi();

        muatAplikasiUtama();


        console.warn(
          "[PAG PUSH] Notification permission denied."
        );


        return;
      }


      /* ===================================================
         DEFAULT
         =================================================== */

      if (
        permission ===
        "default"
      ) {

        /*
         * Hanya pada kondisi ini lock ditampilkan.
         */

        tampilkanInfoNotifikasi(

          "P.A.G Docs dapat mengirim pemberitahuan " +
          "pekerjaan dan aktivitas sistem.",

          "Klik Aktifkan Notifikasi untuk melanjutkan."

        );


        return;
      }


      /*
       * Fallback.
       */

      muatAplikasiUtama();

    }


    /* =====================================================
       BUTTON ACTION
       ===================================================== */

    window.panggilAksiNotifikasi =
      async function() {

        if (_notifChecking) {

          return;
        }


        _notifChecking =
          true;


        const button =
          el("lockActionBtn");


        const hint =
          el("lockHint");


        try {

          if (
            !("Notification" in window)
          ) {

            /*
             * Tidak ada Notification API.
             * Jangan mengunci aplikasi.
             */

            sembunyikanLockNotifikasi();

            muatAplikasiUtama();

            return;
          }


          /*
           * Jika permission default,
           * browser meminta izin.
           */

          if (
            Notification.permission ===
            "default"
          ) {

            if (button) {

              button.disabled =
                true;

              button.textContent =
                "Meminta izin...";

            }


            if (hint) {

              hint.textContent =
                "Silakan pilih Allow / Izinkan pada dialog browser.";

            }


            const permission =
              await Notification.requestPermission();


            console.log(
              "[PAG PUSH] Permission result:",
              permission
            );


            /*
             * GRANTED
             */

            if (
              permission ===
              "granted"
            ) {

              sembunyikanLockNotifikasi();

              muatAplikasiUtama();


              /*
               * Push background.
               */

              void siapkanPushBackground();


              return;
            }


            /*
             * DENIED
             *
             * Aplikasi tetap boleh digunakan.
             */

            if (
              permission ===
              "denied"
            ) {

              sembunyikanLockNotifikasi();

              muatAplikasiUtama();


              return;
            }


            /*
             * User menutup dialog / permission tetap default.
             */

            tampilkanInfoNotifikasi(

              "NOTIFIKASI BELUM DIAKTIFKAN",

              "Izin notifikasi belum diberikan.",

              "Aktifkan Notifikasi",

              "Klik tombol ini lagi jika ingin mengaktifkan notifikasi.",

              "🔔"

            );


            return;
          }


          /*
           * GRANTED
           */

          if (
            Notification.permission ===
            "granted"
          ) {

            sembunyikanLockNotifikasi();

            muatAplikasiUtama();


            void siapkanPushBackground();


            return;
          }


          /*
           * DENIED
           */

          if (
            Notification.permission ===
            "denied"
          ) {

            sembunyikanLockNotifikasi();

            muatAplikasiUtama();


            return;
          }


        } catch (error) {

          console.error(
            "[PAG PUSH] Permission action error:",
            error
          );


          /*
           * Bahkan jika push gagal,
           * jangan membuat aplikasi terkunci.
           */

          sembunyikanLockNotifikasi();

          muatAplikasiUtama();

        } finally {

          _notifChecking =
            false;

        }

      };


    /* =====================================================
       PERMISSION WATCHER
       
       Watcher hanya digunakan untuk mengetahui jika
       permission berubah dari browser settings.

       TIDAK menjalankan proses push berulang-ulang.
       ===================================================== */

    async function setupPermissionWatcher() {

      if (
        !navigator.permissions ||
        !navigator.permissions.query
      ) {

        return;
      }


      try {

        _permissionWatcher =
          await navigator.permissions.query(
            {
              name:
                "notifications"
            }
          );


        _permissionWatcher.onchange =
          function() {

            console.log(
              "[PAG PUSH] Permission berubah:",
              _permissionWatcher.state
            );


            /*
             * Jika permission berubah menjadi granted,
             * siapkan push tanpa membuka lock.
             */

            if (
              Notification.permission ===
              "granted"
            ) {

              sembunyikanLockNotifikasi();

              muatAplikasiUtama();

              void siapkanPushBackground();

              return;
            }


            /*
             * Jika denied:
             * aplikasi tetap terbuka.
             */

            if (
              Notification.permission ===
              "denied"
            ) {

              sembunyikanLockNotifikasi();

              muatAplikasiUtama();

              return;
            }


            /*
             * Jika kembali default,
             * tampilkan permission gate.
             */

            if (
              Notification.permission ===
              "default"
            ) {

              /*
               * Hanya tampilkan jika user belum
               * melakukan interaksi aplikasi.
               *
               * Jangan mengganggu session aktif.
               */

              if (!_appLoaded) {

                tampilkanInfoNotifikasi(

                  "AKTIFKAN NOTIFIKASI",

                  "Aktifkan notifikasi P.A.G Docs agar menerima pemberitahuan.",

                  "Aktifkan Notifikasi",

                  "Izin akan diminta oleh browser.",

                  "🔔"

                );

              }

            }

          };

      } catch (error) {

        console.warn(
          "[PAG PUSH] Permission watcher tidak tersedia:",
          error
        );

      }

    }


    /* =====================================================
       MESSAGE DARI APPS SCRIPT
       ===================================================== */

    window.addEventListener(
      "message",
      async function(event) {

        if (!event.data) {

          return;
        }


        const data =
          event.data;


        /* =================================================
           USER SESSION
           ================================================= */

        if (
          data.type ===
          "SYNC_USER_SESSION"
        ) {

          console.log(
            "[PAG PUSH] Session diterima dari Apps Script."
          );


          _userSession = {

            user_id:
              data.user_id ||
              data.userId ||
              data.user?.id ||
              null,

            role:
              data.role ||
              data.user?.role ||
              "semua"

          };


          /*
           * Sekarang subscription dapat
           * dikaitkan dengan user sebenarnya.
           */

          void updateSubscriptionSession();


          return;
        }


        /* =================================================
           LOCAL OS NOTIFICATION
           ================================================= */

        if (
          data.type ===
          "SHOW_OS_NOTIFICATION"
        ) {

          void tampilkanOSNotification(
            data
          );


          return;
        }

      }
    );


    /* =====================================================
       SHOW OS NOTIFICATION
       ===================================================== */

    async function tampilkanOSNotification(
      data
    ) {

      try {

        if (
          !("Notification" in window)
        ) {

          return;
        }


        if (
          Notification.permission !==
          "granted"
        ) {

          return;
        }


        const registration =
          _serviceWorkerRegistration ||
          await navigator.serviceWorker.ready;


        if (!registration) {

          return;
        }


        const title =
          data?.title ||
          data?.judul ||
          "🔔 P.A.G Docs";


        const body =
          data?.body ||
          data?.pesan ||
          "Ada pemberitahuan baru.";


        const link =
          data?.url ||
          data?.link ||
          window.location.href;


        await registration.showNotification(

          title,

          {

            body:
              String(body),

            icon:
              "./icon-192.png",

            badge:
              "./icon-192.png",

            tag:
              "pag-docs-local",

            renotify:
              true,

            requireInteraction:
              true,

            data: {

              url:
                link

            }

          }

        );

      } catch (error) {

        console.warn(
          "[PAG PUSH] OS notification gagal:",
          error
        );

      }

    }


    /* =====================================================
       SERVICE WORKER MESSAGE
       ===================================================== */

    if (
      "serviceWorker" in navigator
    ) {

      navigator.serviceWorker.addEventListener(
        "message",
        function(event) {

          if (!event.data) {

            return;
          }


          console.log(
            "[PAG SW MESSAGE]",
            event.data
          );

        }
      );

    }


    /* =====================================================
       STARTUP
       ===================================================== */

    window.addEventListener(
      "load",
      async function() {

        if (_startupFinished) {

          return;
        }


        _startupFinished =
          true;


        console.log(
          "[PAG] Startup..."
        );


        /*
         * Device information.
         */

        try {

          _deviceId =
            getDeviceId();

          _deviceLabel =
            getDeviceLabel();

        } catch (error) {

          console.warn(
            "[PAG] Device identification gagal:",
            error
          );

        }


        /*
         * Permission watcher.
         */

        await setupPermissionWatcher();


        /*
         * PENTING:
         *
         * Jangan siapkan Service Worker
         * sebelum permission gate.
         *
         * Untuk permission granted,
         * proses dilakukan background.
         *
         * Ini membuat startup aplikasi jauh
         * lebih cepat.
         */

        await cekPermissionAwal();


        console.log(
          "[PAG] Startup selesai."
        );

      }
    );

  </script>
