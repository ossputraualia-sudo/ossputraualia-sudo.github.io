<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PT. Putra Aulia Group</title>
  
  <meta name="theme-color" content="#f1f5f9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PT.PA">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #appFrame {
      width: 100%; height: 100%; border: none; display: block; background: #f8fafc;
      position: absolute; inset: 0; z-index: 1;
    }
    #setupModal {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, rgba(248,250,252,0.95) 0%, rgba(226,232,240,0.95) 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 999999;
      padding: 20px; overflow-y: auto; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .setup-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px; padding: 32px 24px; max-width: 420px; width: 100%;
      text-align: center; position: relative; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .brand-badge {
      display: inline-block; background: linear-gradient(135deg, #0d9488, #0f766e);
      color: #ffffff; font-weight: 800; font-size: 20px; padding: 8px 16px;
      border-radius: 12px; margin-bottom: 16px; letter-spacing: 1px;
    }
    .action-box {
      background: #ffffff; border: 1px solid rgba(203, 213, 225, 0.8);
      border-radius: 16px; padding: 16px; margin-bottom: 14px; text-align: left;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .btn-action { padding: 9px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(180deg, #0d9488 0%, #0f766e 100%); color: #ffffff; }
    .btn-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; cursor: default; }
    .status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; margin-right: 6px; }
    .status-indicator.active { background: #22c55e; }
  </style>
</head>
<body>

  <!-- MODAL IZIN NOTIFIKASI -->
  <div id="setupModal">
    <div class="setup-card">
      <div class="brand-badge">P.A.G</div>
      <h2>PT. PUTRA AULIA GROUP</h2>
      <p style="font-size:13px; color:#475569; margin-bottom:24px;">Aktifkan notifikasi untuk memantau radar tender & dokumen di desktop.</p>

      <div class="action-box" id="notifBox">
        <div>
          <h4 style="font-size:13.5px; font-weight:700;"><span class="status-indicator" id="notifIndicator"></span>🔔 Notifikasi Desktop</h4>
          <p style="font-size:11.5px; color:#64748b;" id="notifDesc">Muncul seperti pop-up WhatsApp di pojok kanan bawah desktop.</p>
        </div>
        <button id="btnNotif" type="button" class="btn-action btn-primary" onclick="aktifkanNotifikasi()">Aktifkan</button>
      </div>

      <button type="button" style="width:100%; padding:14px; border-radius:14px; background:#0d9488; color:#fff; font-weight:700; border:none; cursor:pointer;" onclick="bukaAplikasiUtama()">
        Lanjutkan ke Aplikasi ➔
      </button>
    </div>
  </div>

  <!-- IFRAME APLIKASI UTAMA GOOGLE APPS SCRIPT -->
  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec" 
    allow="clipboard-read; clipboard-write; geolocation; camera; microphone;"
  ></iframe>

  <script>
    var APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec";
    var VAPID_PUBLIC_KEY = "BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U";
    
    // Konfigurasi Supabase REST Langsung
    var SB_URL = "https://qywqxcvnlehmiqrkpwdd.supabase.co";
    var SB_KEY = "sb_publishable_Trk4jYTk3nI93sFtmWO6Tg_-ps4vYLq";

    var frame = document.getElementById('appFrame');
    var setupModal = document.getElementById('setupModal');

    // Helper konversi Public Key
    function urlBase64ToUint8Array(base64String) {
      var padding = '='.repeat((4 - base64String.length % 4) % 4);
      var base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      var rawData = window.atob(base64);
      var outputArray = new Uint8Array(rawData.length);
      for (var i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    // 1. Daftarkan Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').then(function(reg) {
          console.log('✅ Service Worker Native VAPID Siap.');
          periksaStatusSubscription();
        });
      });
    }

    // 2. Fungsi Mendaftar Web Push (Tembus Saat Ditutup)
    async function aktifkanNotifikasi() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        alert('Browser ini tidak mendukung Native Web Push.');
        return;
      }

      try {
        var reg = await navigator.serviceWorker.ready;
        var sub = await reg.pushManager.getSubscription();

        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });
        }

        // Simpan Subscription ke Supabase
        var subJson = sub.toJSON();
        var cachedRole = localStorage.getItem('PAG_USER_ROLE') || 'superuser';
        var payload = {
          role: cachedRole.toLowerCase().trim(),
          endpoint: subJson.endpoint,
          keys_p256dh: subJson.keys.p256dh,
          keys_auth: subJson.keys.auth,
          updated_at: new Date().toISOString()
        };

        await fetch(SB_URL + '/rest/v1/web_push_subscriptions', {
          method: 'POST',
          headers: {
            'apikey': SB_KEY,
            'Authorization': 'Bearer ' + SB_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(payload)
        });

        periksaStatusSubscription();
        alert('✅ Notifikasi Desktop Latar Belakang Aktif! Notifikasi akan tetap masuk walau aplikasi ditutup.');
      } catch (err) {
        console.error('Gagal berlangganan push:', err);
        alert('Gagal mengaktifkan notifikasi: ' + err.message);
      }
    }

    function periksaStatusSubscription() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(function(reg) {
          reg.pushManager.getSubscription().then(function(sub) {
            if (sub && Notification.permission === 'granted') {
              var btn = document.getElementById('btnNotif');
              var desc = document.getElementById('notifDesc');
              var indicator = document.getElementById('notifIndicator');
              if (btn) { btn.textContent = 'Aktif ✔'; btn.className = 'btn-action btn-success'; btn.disabled = true; }
              if (desc) { desc.textContent = 'Web Push aktif (tetap masuk walau aplikasi ditutup).'; }
              if (indicator) { indicator.classList.add('active'); }
            }
          });
        });
      }
    }

    function bukaAplikasiUtama() {
      localStorage.setItem('PAG_SETUP_DONE', 'true');
      if (setupModal) setupModal.style.display = 'none';
    }

    if (localStorage.getItem('PAG_SETUP_DONE') === 'true') {
      if (setupModal) setupModal.style.display = 'none';
    }

    window.addEventListener('hashchange', function() {
      var hash = window.location.hash || '';
      if (frame && hash) frame.src = APPS_SCRIPT_EXEC_URL + hash;
    });
  </script>
</body>
</html>
