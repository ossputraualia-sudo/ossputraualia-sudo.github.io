<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PT. Putra Aulia Group</title>
  
  <meta name="theme-color" content="#f1f5f9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PT.PA">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #appFrame {
      width: 100%; height: 100%; border: none; display: block; background: #f8fafc;
      position: absolute; inset: 0; z-index: 1;
    }
    #setupModal {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, rgba(248,250,252,0.95) 0%, rgba(226,232,240,0.95) 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 999999;
      padding: 20px; overflow-y: auto; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .setup-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px; padding: 32px 24px; max-width: 420px; width: 100%;
      text-align: center; position: relative; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .brand-badge {
      display: inline-block; background: linear-gradient(135deg, #0d9488, #0f766e);
      color: #ffffff; font-weight: 800; font-size: 20px; padding: 8px 16px;
      border-radius: 12px; margin-bottom: 16px; letter-spacing: 1px;
    }
    .action-box {
      background: #ffffff; border: 1px solid rgba(203, 213, 225, 0.8);
      border-radius: 16px; padding: 16px; margin-bottom: 14px; text-align: left;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .btn-action { padding: 9px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(180deg, #0d9488 0%, #0f766e 100%); color: #ffffff; }
    .btn-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; cursor: default; }
    .status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; margin-right: 6px; }
    .status-indicator.active { background: #22c55e; }
  </style>
</head>
<body>

  <!-- MODAL IZIN NOTIFIKASI -->
  <div id="setupModal">
    <div class="setup-card">
      <div class="brand-badge">P.A.G</div>
      <h2>PT. PUTRA AULIA GROUP</h2>
      <p style="font-size:13px; color:#475569; margin-bottom:24px;">Aktifkan notifikasi untuk memantau radar tender & dokumen di desktop.</p>

      <div class="action-box" id="notifBox">
        <div>
          <h4 style="font-size:13.5px; font-weight:700;"><span class="status-indicator" id="notifIndicator"></span>🔔 Notifikasi Desktop</h4>
          <p style="font-size:11.5px; color:#64748b;" id="notifDesc">Muncul seperti pop-up WhatsApp di pojok kanan bawah desktop.</p>
        </div>
        <button id="btnNotif" type="button" class="btn-action btn-primary" onclick="aktifkanNotifikasi()">Aktifkan</button>
      </div>

      <button type="button" style="width:100%; padding:14px; border-radius:14px; background:#0d9488; color:#fff; font-weight:700; border:none; cursor:pointer;" onclick="bukaAplikasiUtama()">
        Lanjutkan ke Aplikasi ➔
      </button>
    </div>
  </div>

  <!-- IFRAME APLIKASI UTAMA GOOGLE APPS SCRIPT -->
  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec" 
    allow="clipboard-read; clipboard-write; geolocation; camera; microphone;"
  ></iframe>

  <script>
    var APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec";
    var frame = document.getElementById('appFrame');
    var setupModal = document.getElementById('setupModal');

    /* ================================================================
     * 1. SUARA DENTING LONCENG (LANGSUNG DARI WINDOW INDUK)
     * ================================================================ */
    function playChimeInduk() {
      try {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        var ctx = new AudioContextClass();
        if (ctx.state === 'suspended') { ctx.resume(); }

        var osc = ctx.createOscillator();
        var gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);

        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    /* ================================================================
     * 2. BANNER NOTIFIKASI RESMI DESKTOP WINDOWS (INSTAN TANPA MACET)
     * ================================================================ */
    function tampilkanNotifikasiDesktop(judul, pesan, targetUrl) {
      // 🔊 Bunyikan suara bel lonceng
      playChimeInduk();

      if (!('Notification' in window) || Notification.permission !== 'granted') return;

      var options = {
        body: pesan || 'Pemberitahuan baru dari PAG Docs.',
        icon: 'icon-192.png',
        badge: 'icon-192.png',
        vibrate: [200, 100, 200],
        requireInteraction: true // Banner tetap melayang di desktop sampai diklik
      };

      try {
        var notif = new Notification(judul || 'P.A.G Docs', options);
        notif.onclick = function(e) {
          e.preventDefault();
          window.focus();
          if (targetUrl && targetUrl !== '#') {
            var cleanHash = targetUrl.startsWith('#') ? targetUrl : '#' + targetUrl;
            window.location.hash = cleanHash;
            if (frame) frame.src = APPS_SCRIPT_EXEC_URL + cleanHash;
          }
          notif.close();
        };
      } catch (err) {
        // Fallback service worker jika ada
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistration().then(function(reg) {
            if (reg) reg.showNotification(judul || 'P.A.G Docs', options);
          });
        }
      }
    }

    /* ================================================================
     * 3. IZIN NOTIFIKASI
     * ================================================================ */
    function periksaStatusSubscription() {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'granted') {
        var btn = document.getElementById('btnNotif');
        var desc = document.getElementById('notifDesc');
        var indicator = document.getElementById('notifIndicator');
        if (btn) { btn.textContent = 'Aktif ✔'; btn.className = 'btn-action btn-success'; btn.disabled = true; }
        if (desc) { desc.textContent = 'Notifikasi desktop aktif di perangkat ini.'; }
        if (indicator) { indicator.classList.add('active'); }
      }
    }

    async function aktifkanNotifikasi() {
      if (!('Notification' in window)) {
        alert('Browser Anda tidak mendukung notifikasi desktop.');
        return;
      }
      try {
        const permission = await Notification.requestPermission();
        periksaStatusSubscription();
        if (permission === 'granted') {
          tampilkanNotifikasiDesktop(
            "🔔 Notifikasi Desktop Aktif",
            "Notifikasi akan muncul di pojok kanan bawah desktop seperti WhatsApp.",
            "#dashboard"
          );
        }
      } catch (err) {}
    }

    /* ================================================================
     * 4. BRIDGE LISTENER (MENANGKAP SINYAL DARI GOOGLE SCRIPT IFRAME)
     * ================================================================ */
    window.addEventListener('message', function(event) {
      if (!event.data) return;
      var data = event.data;

      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch(e) { return; }
      }

      // Begitu iframe mendeteksi pesan baru, langsung bunyikan suara & munculkan banner Windows
      if (data.type === 'SHOW_OS_NOTIFICATION') {
        tampilkanNotifikasiDesktop(data.judul, data.pesan, data.url);
      }

      // Update angka badge di tab browser
      if (data.type === 'UPDATE_BADGE' && typeof data.count === 'number') {
        document.title = (data.count > 0 ? '(' + data.count + ') ' : '') + 'PT. Putra Aulia Group';
      }
    });

    function bukaAplikasiUtama() {
      localStorage.setItem('PAG_SETUP_DONE', 'true');
      if (setupModal) setupModal.style.display = 'none';
    }

    if (localStorage.getItem('PAG_SETUP_DONE') === 'true') {
      if (setupModal) setupModal.style.display = 'none';
    }

    periksaStatusSubscription();

    window.addEventListener('hashchange', function() {
      var hash = window.location.hash || '';
      if (frame && hash) frame.src = APPS_SCRIPT_EXEC_URL + hash;
    });
  </script>
</body>
</html>
