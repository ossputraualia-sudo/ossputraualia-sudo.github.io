<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PT. Putra Aulia Group</title>
  
  <meta name="theme-color" content="#f1f5f9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PT.PA">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #appFrame {
      width: 100%; height: 100%; border: none; display: block; background: #f8fafc;
      position: absolute; inset: 0; z-index: 1;
    }
    #setupModal {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, rgba(248,250,252,0.95) 0%, rgba(226,232,240,0.95) 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 999999;
      padding: 20px; overflow-y: auto; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .setup-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px; padding: 32px 24px; max-width: 420px; width: 100%;
      text-align: center; position: relative; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .brand-badge {
      display: inline-block; background: linear-gradient(135deg, #0d9488, #0f766e);
      color: #ffffff; font-weight: 800; font-size: 20px; padding: 8px 16px;
      border-radius: 12px; margin-bottom: 16px; letter-spacing: 1px;
    }
    .action-box {
      background: #ffffff; border: 1px solid rgba(203, 213, 225, 0.8);
      border-radius: 16px; padding: 16px; margin-bottom: 14px; text-align: left;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .btn-action { padding: 9px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(180deg, #0d9488 0%, #0f766e 100%); color: #ffffff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; cursor: default; }
    .status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; margin-right: 6px; }
    .status-indicator.active { background: #22c55e; }
  </style>
</head>
<body>

  <!-- MODAL SETUP PERTAMA KALI -->
  <div id="setupModal">
    <div class="setup-card">
      <div class="brand-badge">P.A.G</div>
      <h2>PT. PUTRA AULIA GROUP</h2>
      <p style="font-size:13px; color:#475569; margin-bottom:24px;">Aktifkan notifikasi untuk memantau radar tender & dokumen kadaluarsa secara realtime.</p>

      <div class="action-box" id="notifBox">
        <div>
          <h4 style="font-size:13.5px; font-weight:700;"><span class="status-indicator" id="notifIndicator"></span>🔔 Notifikasi Real-Time</h4>
          <p style="font-size:11.5px; color:#64748b;" id="notifDesc">Wajib diaktifkan agar update dokumen masuk ke perangkat.</p>
        </div>
        <button id="btnNotif" type="button" class="btn-action btn-primary" onclick="aktifkanNotifikasi()">Aktifkan</button>
      </div>

      <button type="button" style="width:100%; padding:14px; border-radius:14px; background:#0d9488; color:#fff; font-weight:700; border:none; cursor:pointer;" onclick="bukaAplikasiUtama()">
        Lanjutkan ke Aplikasi ➔
      </button>
    </div>
  </div>

  <!-- IFRAME APLIKASI UTAMA GOOGLE APPS SCRIPT -->
  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec" 
    allow="clipboard-read; clipboard-write; geolocation; camera; microphone;"
  ></iframe>

  <script>
    var APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec";
    var frame = document.getElementById('appFrame');
    var setupModal = document.getElementById('setupModal');

    /* ================================================================
     * 1. NATIVE NOTIFICATION ENGINE (PENGGANTI ONESIGNAL)
     * ================================================================ */
    function periksaStatusSubscription() {
      if (!('Notification' in window)) {
        var desc = document.getElementById('notifDesc');
        if (desc) desc.textContent = 'Browser ini tidak mendukung notifikasi sistem.';
        return;
      }

      if (Notification.permission === 'granted') {
        var btn = document.getElementById('btnNotif');
        var desc = document.getElementById('notifDesc');
        var indicator = document.getElementById('notifIndicator');

        if (btn) {
          btn.textContent = 'Aktif ✔';
          btn.className = 'btn-action btn-success';
          btn.disabled = true;
        }
        if (desc) {
          desc.textContent = 'Notifikasi push native aktif di perangkat ini.';
        }
        if (indicator) {
          indicator.classList.add('active');
        }
      }
    }

    async function aktifkanNotifikasi() {
      if (!('Notification' in window)) {
        alert('Perangkat/browser Anda tidak mendukung notifikasi desktop.');
        return;
      }

      try {
        const permission = await Notification.requestPermission();
        periksaStatusSubscription();
        if (permission === 'granted') {
          tampilkanNotifikasiNative(
            "🔔 Notifikasi P.A.G Docs Aktif",
            "Perangkat ini siap menerima pemberitahuan radar tender & dokumen.",
            "#dashboard"
          );
        }
      } catch (err) {
        console.error("Gagal meminta izin notifikasi:", err);
      }
    }

    function tampilkanNotifikasiNative(judul, pesan, targetUrl) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;

      try {
        var iconUrl = 'icon-192.png';
        var options = {
          body: pesan || 'Pemberitahuan baru dari sistem PAG Docs.',
          icon: iconUrl,
          badge: iconUrl,
          vibrate: [200, 100, 200],
          data: { url: targetUrl || '#' }
        };

        var notif = new Notification(judul || 'P.A.G Docs', options);
        notif.onclick = function(e) {
          e.preventDefault();
          window.focus();
          if (targetUrl && targetUrl !== '#') {
            var cleanHash = targetUrl.startsWith('#') ? targetUrl : '#' + targetUrl;
            window.location.hash = cleanHash;
            if (frame) frame.src = APPS_SCRIPT_EXEC_URL + cleanHash;
          }
          notif.close();
        };
      } catch (e) {
        console.warn('Gagal memunculkan banner notifikasi:', e);
      }
    }

    /* ================================================================
     * 2. BRIDGE LISTENER (MENERIMA NOTIFIKASI DARI DALAM IFRAME)
     * ================================================================ */
    window.addEventListener('message', function(event) {
      if (!event.data) return;
      var data = event.data;

      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch(e) { return; }
      }

      // Jika iframe mengirim permintaan pop-up notifikasi OS
      if (data.type === 'SHOW_OS_NOTIFICATION') {
        tampilkanNotifikasiNative(data.judul, data.pesan, data.url);
      }

      // Sinkronisasi badge judul tab browser
      if (data.type === 'UPDATE_BADGE' && typeof data.count === 'number') {
        if (data.count > 0) {
          document.title = '(' + data.count + ') PT. Putra Aulia Group';
        } else {
          document.title = 'PT. Putra Aulia Group';
        }
      }
    });

    /* ================================================================
     * 3. KONTROL TAMPILAN & HASH ROUTER
     * ================================================================ */
    function bukaAplikasiUtama() {
      localStorage.setItem('PAG_SETUP_DONE', 'true');
      if (setupModal) setupModal.style.display = 'none';
    }

    if (localStorage.getItem('PAG_SETUP_DONE') === 'true') {
      if (setupModal) setupModal.style.display = 'none';
    }

    // Periksa izin saat halaman dimuat
    periksaStatusSubscription();

    window.addEventListener('hashchange', function() {
      var hash = window.location.hash || '';
      if (frame && hash) frame.src = APPS_SCRIPT_EXEC_URL + hash;
    });
  </script>
</body>
</html>
