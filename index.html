      padding: 0;

    /* =====================================================
       APP FRAME
       ===================================================== */

    #appFrame {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;

      background: #ffffff;

      display: block;
    }


    /* =====================================================
       LOCK SCREEN
       SATU-SATUNYA LOCK SCREEN
       ===================================================== */

    #lockScreenOverlay {

      position: fixed;

      inset: 0;

      z-index: 999999;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #111827 0%,
          #172033 100%
        );

      padding: 24px;

      opacity: 1;

      visibility: visible;

      transition:
        opacity .2s ease,
        visibility .2s ease;
    }


    #lockScreenOverlay.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }


    /* =====================================================
       LOCK CARD
       ===================================================== */

    #lockCard {

      width: min(440px, 100%);

      background: #ffffff;

      border-radius: 26px;

      padding: 36px 30px 30px;

      text-align: center;

      box-shadow:
        0 30px 80px rgba(0,0,0,.40);

      animation:
        pagLockIn .22s ease;
    }


    @keyframes pagLockIn {

      from {
        opacity: 0;
        transform: translateY(10px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }


    /* =====================================================
       ICON
       ===================================================== */

    #lockIcon {

      width: 64px;
      height: 64px;

      margin: 0 auto 20px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: #eff6ff;

      border: 2px solid #bfdbfe;

      font-size: 30px;

      line-height: 1;
    }


    /* =====================================================
       TITLE
       ===================================================== */

    #lockTitle {

      margin: 0 0 12px;

      color: #111827;

      font-size: 20px;

      line-height: 1.3;

      font-weight: 800;

      letter-spacing: .2px;
    }


    /* =====================================================
       MESSAGE
       ===================================================== */

    #lockMessage {

      margin: 0 auto 22px;

      max-width: 370px;

      color: #64748b;

      font-size: 14px;

      line-height: 1.65;
    }


    /* =====================================================
       BUTTON
       ===================================================== */

    #lockActionBtn {

      width: 100%;

      min-height: 48px;

      border: 0;

      border-radius: 13px;

      padding: 13px 18px;

      background: #2563eb;

      color: #ffffff;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform .15s ease,
        opacity .15s ease,
        background .15s ease;
    }


    #lockActionBtn:hover {

      opacity: .93;
    }


    #lockActionBtn:active {

      transform: scale(.985);
    }


    #lockActionBtn:disabled {

      cursor: wait;

      transform: none;
    }


    /* =====================================================
       HINT
       ===================================================== */

    #lockHint {

      margin-top: 15px;

      color: #94a3b8;

      font-size: 12px;

      line-height: 1.6;

      min-height: 19px;
    }


    /* =====================================================
       SMALL DEVICE
       ===================================================== */

        border-radius: 22px;
      }

      }

        font-size: 13px;
      }

    }

    /* =====================================================

    function getDeviceId() {

      const KEY =
        "PAG_DOCS_PUSH_DEVICE_ID";


      let id =
        localStorage.getItem(KEY);


      if (!id) {

        id =
          "pag-" +
          Date.now().toString(36) +
          "-" +
          Math.random()
            .toString(36)
            .slice(2, 10);


        localStorage.setItem(
          KEY,
          id
        );
      }


      return id;
    }


    /* =====================================================
       DEVICE LABEL
       ===================================================== */

    function getDeviceLabel() {

      if (_deviceLabel) {

        return _deviceLabel;
      }


      let browser =
        "Browser";


      const ua =
        navigator.userAgent
          .toLowerCase();


      if (
        ua.includes("edg/")
      ) {

        browser = "Microsoft Edge";

      } else if (
        ua.includes("chrome")
      ) {

        browser = "Google Chrome";

      } else if (
        ua.includes("firefox")
      ) {

        browser = "Mozilla Firefox";

      } else if (
        ua.includes("safari")
      ) {

        browser = "Safari";
      }


      let os =
        "Desktop";


      if (
        /android/i.test(
          navigator.userAgent
        )
      ) {

        os = "Android";

      } else if (
        /iphone|ipad|ipod/i.test(
          navigator.userAgent
        )
      ) {

        os = "iOS";

      } else if (
        /windows/i.test(
          navigator.userAgent
        )
      ) {

        os = "Windows";

      } else if (
        /macintosh|mac os/i.test(
          navigator.userAgent
        )
      ) {

        os = "macOS";
      }


      _deviceLabel =
        browser +
        " • " +
        os;


      return _deviceLabel;
    }


    /* =====================================================
       BASE64 → UINT8ARRAY
       ===================================================== */

    function urlBase64ToUint8Array(
      base64String
    ) {

      if (!base64String) {

        throw new Error(
          "VAPID public key kosong."
        );
      }


      const clean =
        String(base64String)
          .trim()
          .replace(/-/g, "+")
          .replace(/_/g, "/");


      const padding =
        "=".repeat(
          (4 - (
            clean.length % 4
          )) % 4
        );


      let raw;


      try {

        raw =
          window.atob(
            clean + padding
          );

      } catch (error) {

        throw new Error(
          "VAPID public key bukan Base64 yang valid."
        );
      }


      const output =
        new Uint8Array(
          raw.length
        );


      for (
        let i = 0;
        i < raw.length;
        i++
      ) {

        output[i] =
          raw.charCodeAt(i);
      }


      /*
       * Web Push VAPID public key:
       *
       * 65 byte
       * 04 + X32 + Y32
       */

      if (
        output.length !== 65
      ) {

        throw new Error(
          "VAPID public key tidak valid. " +
          "Panjang key = " +
          output.length +
          " byte, seharusnya 65 byte."
        );
      }


      if (
        output[0] !== 4
      ) {

        throw new Error(
          "VAPID public key bukan EC P-256."
        );
      }


      return output;
    }

    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    async function siapkanServiceWorker() {

      if (
        !("serviceWorker" in navigator)
      ) {

        throw new Error(
          "Browser tidak mendukung Service Worker."
        );
      }


      _serviceWorkerRegistration =
        await navigator.serviceWorker.register(
          SW_PATH,
          {
            scope: "./"
          }
        );


      /*
       * Tunggu service worker aktif.
       */

      if (
        !_serviceWorkerRegistration.active
      ) {

        await new Promise(
          function(resolve) {

            const worker =
              _serviceWorkerRegistration.installing ||
              _serviceWorkerRegistration.waiting;


            if (!worker) {

              resolve();

              return;
            }


            const check =
              function() {

                if (
                  worker.state ===
                    "activated"
                ) {

                  resolve();

                } else {

                  setTimeout(
                    check,
                    100
                  );
                }

              };


            check();

          }
        );
      }


      /*
       * Pastikan controller siap.
       */

      if (
        !navigator.serviceWorker.controller
      ) {

        await new Promise(
          function(resolve) {

            const timer =
              setTimeout(
                resolve,
                2000
              );


            navigator.serviceWorker.addEventListener(
              "controllerchange",
              function() {

                clearTimeout(timer);

                resolve();

              },
              {
                once: true
              }
            );

          }
        );
      }


      console.log(
        "[PAG PUSH] Service Worker siap."
      );


      return _serviceWorkerRegistration;
    }


    /* =====================================================
       BUAT / AMBIL PUSH SUBSCRIPTION
       ===================================================== */

    async function buatPushSubscription() {

      if (
        !("PushManager" in window)
      ) {

        throw new Error(
          "Browser tidak mendukung PushManager."
        );
      }


      if (
        !_serviceWorkerRegistration
      ) {

        await siapkanServiceWorker();
      }


      const registration =
        _serviceWorkerRegistration;


      if (!registration) {

        throw new Error(
          "Service Worker belum tersedia."
        );
      }


      /*
       * Pastikan permission granted.
       */

      if (
        Notification.permission !==
        "granted"
      ) {

        throw new Error(
          "Izin notifikasi belum diberikan."
        );
      }


      /*
       * Konversi VAPID key.
       */

      const applicationServerKey =
        urlBase64ToUint8Array(
          VAPID_PUBLIC_KEY
        );


      /*
       * Cek subscription lama.
       */

      let subscription =
        await registration.pushManager
          .getSubscription();


      /*
       * Kalau belum ada → buat baru.
       */

      if (!subscription) {

        console.log(
          "[PAG PUSH] Membuat subscription baru..."
        );


        subscription =
          await registration.pushManager
            .subscribe({

              userVisibleOnly:
                true,

              applicationServerKey:
                applicationServerKey

            });

      }


      if (!subscription) {

        throw new Error(
          "Browser tidak mengembalikan Push Subscription."
        );
      }


      /*
       * Convert ke JSON.
       */

      const json =
        subscription.toJSON();


      if (
        !json ||
        !json.endpoint ||
        !json.keys ||
        !json.keys.p256dh ||
        !json.keys.auth
      ) {

        throw new Error(
          "Push Subscription tidak lengkap."
        );
      }


      _pushSubscription =
        subscription;


      _pushSubscriptionJSON =
        json;


      console.log(
        "[PAG PUSH] Subscription valid."
      );


      return {
        subscription,
        json
      };

    }


    /* =====================================================
       SUPABASE REQUEST
       ===================================================== */

    async function supabaseRequest(
      path,
      options
    ) {

      const opts =
        options || {};


      const headers =
        Object.assign(
          {
            apikey:
              SB_KEY,

            Authorization:
              "Bearer " +
              SB_KEY,

            "Content-Type":
              "application/json",

            Prefer:
              "return=representation"
          },

          opts.headers || {}
        );


      const response =
        await fetch(
          SB_URL +
          path,
          Object.assign(
            {},
            opts,
            {
              headers
            }
          )
        );


      const text =
        await response.text();


      let data = null;


      if (text) {

        try {

          data =
            JSON.parse(text);

        } catch (error) {

          data =
            text;
        }
      }


      if (!response.ok) {

        const errorMessage =
          data &&
          typeof data === "object"
            ? (
                data.message ||
                data.error_description ||
                data.hint ||
                data.details ||
                "Supabase request gagal."
              )
            : String(data);


        throw new Error(
          "Supabase " +
          response.status +
          ": " +
          errorMessage
        );
      }


      return data;

    }


    /* =====================================================
       SIMPAN SUBSCRIPTION
       ===================================================== */

    async function simpanSubscriptionKeSupabase(
      subscriptionJSON
    ) {

      if (
        !subscriptionJSON ||
        !subscriptionJSON.endpoint
      ) {

        throw new Error(
          "Subscription tidak valid."
        );
      }


      /*
       * IMPORTANT
       *
       * user_id belum tentu tersedia pada tahap
       * pertama karena iframe Apps Script belum dimuat.
       *
       * Oleh karena itu:
       *
       * - device_id digunakan sebagai identitas perangkat
       * - user_id diisi jika session sudah tersedia
       * - role default = semua
       *
       * Setelah Apps Script mengirim session,
       * subscription akan diperbarui lagi.
       */


      const payload = {

        device_id:
          _deviceId,

        user_id:
          _userSession?.user_id ||
          null,

        role:
          _userSession?.role ||
          "semua",

        endpoint:
          subscriptionJSON.endpoint,

        keys_p256dh:
          subscriptionJSON.keys?.p256dh ||
          "",

        keys_auth:
          subscriptionJSON.keys?.auth ||
          "",

        device_label:
          getDeviceLabel(),

        updated_at:
          new Date().toISOString()

      };


      /*
       * ---------------------------------------------------
       * UPSERT
       *
       * Endpoint sebaiknya UNIQUE di database.
       * ---------------------------------------------------
       */

      try {

        const result =
          await supabaseRequest(
            "/rest/v1/web_push_subscriptions?on_conflict=endpoint",
            {
              method:
                "POST",

              headers: {

                Prefer:
                  "resolution=merge-duplicates,return=representation"

              },

              body:
                JSON.stringify(
                  payload
                )
            }
          );


        console.log(
          "[PAG PUSH] Subscription tersimpan:",
          result
        );


        /*
         * Cache lokal hanya untuk informasi.
         * BUKAN sebagai sumber otorisasi.
         */

        try {

          localStorage.setItem(
            "PAG_PUSH_REGISTERED",
            "1"
          );

          localStorage.setItem(
            "PAG_PUSH_ENDPOINT",
            subscriptionJSON.endpoint
          );

        } catch (storageError) {

          console.warn(
            "[PAG PUSH] localStorage gagal:",
            storageError
          );
        }


        return result;

      } catch (error) {

        console.error(
          "[PAG PUSH] Gagal menyimpan subscription:",
          error
        );


        throw error;
      }

    }


    /* =====================================================
       UPDATE SESSION KE SUBSCRIPTION
       ===================================================== */

    async function updateSubscriptionSession() {

      if (
        !_pushSubscriptionJSON
      ) {

        return;
      }


      try {

        await simpanSubscriptionKeSupabase(
          _pushSubscriptionJSON
        );


        console.log(
          "[PAG PUSH] Session subscription diperbarui."
        );

      } catch (error) {

        console.warn(
          "[PAG PUSH] Update session gagal:",
          error
        );

      }

    }

    /* =====================================================
       NOTIFICATION MAIN CHECK
       ===================================================== */

    async function cekNotifikasiUtama() {

      if (_notifChecking) {

        return;
      }


      _notifChecking =
        true;


      try {

        /* =================================================
           SUPPORT CHECK
           ================================================= */

        if (
          !("Notification" in window)
        ) {

          gagalLockNotifikasi(

            "Browser tidak menyediakan layanan notifikasi.",

            "Gunakan browser modern seperti Chrome atau Edge."

          );

          return;
        }


        if (
          !("serviceWorker" in navigator)
        ) {

          gagalLockNotifikasi(

            "Browser tidak mendukung Service Worker.",

            "Web Push P.A.G Docs membutuhkan Service Worker."

          );

          return;
        }


        if (
          !("PushManager" in window)
        ) {

          gagalLockNotifikasi(

            "Browser tidak mendukung Web Push.",

            "Gunakan Chrome atau Edge versi terbaru."

          );

          return;
        }


        /* =================================================
           PERMISSION DENIED
           ================================================= */

        if (
          Notification.permission ===
          "denied"
        ) {

          tampilkanLockNotifikasi(

            "NOTIFIKASI HARUS DIAKTIFKAN",

            "Akses notifikasi untuk P.A.G Docs sedang diblokir oleh browser.",

            "Cek Pengaturan Browser",

            "Klik ikon 🔒 di sebelah alamat website → Notifications → Allow, kemudian kembali ke halaman ini.",

            "🔒"

          );

          return;
        }


        /* =================================================
           PERMISSION DEFAULT
           ================================================= */

        if (
          Notification.permission ===
          "default"
        ) {

          tampilkanLockNotifikasi(

            "AKTIFKAN NOTIFIKASI",

            "P.A.G Docs memerlukan izin notifikasi untuk menerima pemberitahuan pekerjaan dan aktivitas sistem.",

            "Aktifkan Notifikasi",

            "Izin akan diminta oleh browser.",

            "🔔"

          );

          return;
        }


        /* =================================================
           PERMISSION GRANTED
           ================================================= */

        if (
          Notification.permission ===
          "granted"
        ) {

          loadingLockNotifikasi(

            "Sedang memastikan perangkat ini terdaftar untuk menerima push notification."

          );


          /*
           * Service Worker
           */

          await siapkanServiceWorker();


          /*
           * Push Subscription
           */

          const hasil =
            await buatPushSubscription();


          /*
           * Simpan subscription
           */

          await simpanSubscriptionKeSupabase(
            hasil.json
          );


          /*
           * SEMUA SUKSES
           */

          bukaAplikasiNotifikasi();


          /*
           * Baru sekarang Apps Script dibuka.
           */

          muatAplikasiUtama();


          return;
        }


      } catch (error) {

        console.error(
          "[PAG NOTIF] CHECK ERROR:",
          error
        );


        /*
         * Jika permission berubah menjadi denied
         * saat proses berjalan.
         */

        if (
          Notification.permission ===
          "denied"
        ) {

          tampilkanLockNotifikasi(

            "NOTIFIKASI HARUS DIAKTIFKAN",

            "Notifikasi P.A.G Docs telah diblokir oleh browser.",

            "Cek Pengaturan Browser",

            "Klik ikon 🔒 → Notifications → Allow, lalu kembali ke halaman ini.",

            "🔒"

          );

          return;
        }


        gagalLockNotifikasi(

          error?.message ||
          "Gagal menyiapkan layanan notifikasi.",

          "Tekan Coba Lagi. Sistem akan mengulangi proses tanpa perlu reload."

        );

      } finally {

        _notifChecking =
          false;
      }

    }


    /* =====================================================
       BUTTON ACTION
       ===================================================== */

    window.panggilAksiNotifikasi =
      async function() {

        if (_notifChecking) {

          return;
        }


        const button =
          el("lockActionBtn");


        if (button) {

          button.disabled =
            true;

          button.textContent =
            "Memproses...";
        }


        try {

          /*
           * DEFAULT
           *
           * Minta permission.
           */

          if (
            Notification.permission ===
            "default"
          ) {

            const permission =
              await Notification.requestPermission();


            if (
              permission ===
              "granted"
            ) {

              await cekNotifikasiUtama();

            } else {

              await cekNotifikasiUtama();
            }


            return;
          }


          /*
           * GRANTED
           */

          if (
            Notification.permission ===
            "granted"
          ) {

            await cekNotifikasiUtama();

            return;
          }


          /*
           * DENIED
           *
           * Tidak bisa dipaksa lewat JavaScript.
           */

          tampilkanLockNotifikasi(

            "NOTIFIKASI MASIH DIBLOKIR",

            "Browser masih memblokir notifikasi untuk P.A.G Docs.",

            "Cek Pengaturan Browser",

            "Klik ikon 🔒 di address bar → Notifications → Allow. Setelah itu kembali ke halaman ini.",

            "🔒"

          );

        } catch (error) {

          console.error(
            "[PAG NOTIF] BUTTON ERROR:",
            error
          );


          gagalLockNotifikasi(

            error?.message ||
            "Gagal menyiapkan notifikasi."

          );
        }

      };


    /* =====================================================
       PERMISSION WATCHER
       ===================================================== */

    async function setupPermissionWatcher() {

      /*
       * Permissions API tidak selalu tersedia.
       */

      if (
        !navigator.permissions ||
        !navigator.permissions.query
      ) {

        return;
      }


      try {

        _permissionWatcher =
          await navigator.permissions.query(
            {
              name: "notifications"
            }
          );


        _permissionWatcher.onchange =
          function() {

            console.log(
              "[PAG PUSH] Permission berubah:",
              _permissionWatcher.state
            );


            setTimeout(
              function() {

                cekNotifikasiUtama();

              },
              100
            );

          };

      } catch (error) {

        console.warn(
          "[PAG PUSH] Permission watcher tidak tersedia:",
          error
        );
      }

    }


    /* =====================================================
       VISIBILITY / FOCUS WATCHER
       ===================================================== */

    function mulaiPemantauanNotifikasi() {

      /*
       * Initial check
       */

      setTimeout(
        function() {

          cekNotifikasiUtama();

        },
        250
      );


      /*
       * Tab kembali terlihat
       */

      document.addEventListener(
        "visibilitychange",
        function() {

          if (
            document.visibilityState ===
            "visible"
          ) {

            setTimeout(
              function() {

                cekNotifikasiUtama();

              },
              150
            );

          }

        }
      );


      /*
       * Window focus
       */

      window.addEventListener(
        "focus",
        function() {

          setTimeout(
            function() {

              cekNotifikasiUtama();

            },
            150
          );

        }
      );


      /*
       * pageshow
       */

      window.addEventListener(
        "pageshow",
        function() {

          setTimeout(
            function() {

              cekNotifikasiUtama();

            },
            150
          );

        }
      );


      /*
       * Fallback polling.
       *
       * Tidak terlalu agresif.
       */

      if (
        !_notifRetryTimer
      ) {

        _notifRetryTimer =
          setInterval(
            function() {

              if (
                !_notifChecking &&
                document.visibilityState ===
                  "visible"
              ) {

                /*
                 * Hanya cek permission.
                 *
                 * Jika masih granted dan app sudah
                 * terbuka, jangan membuat proses
                 * subscription baru terus-menerus.
                 */

                if (
                  Notification.permission !==
                  "granted"
                ) {

                  cekNotifikasiUtama();

                } else if (
                  !_appLoaded
                ) {

                  cekNotifikasiUtama();

                }

              }

            },
            3000
          );

      }

    }


    /* =====================================================
       TERIMA SESSION DARI APPS SCRIPT
       ===================================================== */

    window.addEventListener(
      "message",
      async function(event) {

        if (!event.data) {

          return;
        }


        const data =
          event.data;


        /* =================================================
           SYNC USER SESSION
           ================================================= */

        if (
          data.type ===
          "SYNC_USER_SESSION"
        ) {

          console.log(
            "[PAG PUSH] Session diterima dari Apps Script."
          );


          _userSession = {

            user_id:
              data.user_id ||
              data.userId ||
              data.user?.id ||
              null,

            role:
              data.role ||
              data.user?.role ||
              "semua"

          };


          /*
           * Perbarui subscription agar sekarang
           * terhubung dengan user sebenarnya.
           */

          await updateSubscriptionSession();


          return;
        }


        /* =================================================
           OPTIONAL: SHOW OS NOTIFICATION
           ================================================= */

        if (
          data.type ===
          "SHOW_OS_NOTIFICATION"
        ) {

          tampilkanOSNotification(
            data
          );

          return;
        }

      }
    );


    /* =====================================================
       SHOW OS NOTIFICATION
       ===================================================== */

    async function tampilkanOSNotification(
      data
    ) {

      try {

        if (
          Notification.permission !==
          "granted"
        ) {

          return;
        }


        const registration =
          _serviceWorkerRegistration ||
          await navigator.serviceWorker.ready;


        if (!registration) {

          return;
        }


        const title =
          data?.title ||
          data?.judul ||
          "🔔 P.A.G Docs";


        const body =
          data?.body ||
          data?.pesan ||
          "Ada pemberitahuan baru.";


        const link =
          data?.url ||
          data?.link ||
          window.location.href;


        await registration.showNotification(
          title,
          {

            body:
              String(body),

            icon:
              "./icon-192.png",

            badge:
              "./icon-192.png",

            tag:
              "pag-docs-local",

            renotify:
              true,

            requireInteraction:
              true,

            data: {
              url:
                link
            }

          }
        );

      } catch (error) {

        console.warn(
          "[PAG PUSH] OS notification gagal:",
          error
        );

      }

    }


    /* =====================================================
       HANDLE SERVICE WORKER MESSAGE
       ===================================================== */

    navigator.serviceWorker?.addEventListener(
      "message",
      function(event) {

        if (!event.data) {

          return;
        }


        console.log(
          "[PAG SW MESSAGE]",
          event.data
        );

      }
    );


    /* =====================================================
       STARTUP
       ===================================================== */

    window.addEventListener(
      "load",
      async function() {

        console.log(
          "[PAG] Startup..."
        );


        _deviceId =
          getDeviceId();


        _deviceLabel =
          getDeviceLabel();


        try {

          /*
           * Setup permission watcher.
           */

          await setupPermissionWatcher();


          /*
           * Service Worker disiapkan
           * lebih awal.
           */

          await siapkanServiceWorker();


          /*
           * Mulai notification gate.
           */

          mulaiPemantauanNotifikasi();


          console.log(
            "[PAG] Startup selesai."
          );

        } catch (error) {

          console.error(
            "[PAG] Startup error:",
            error
          );


          gagalLockNotifikasi(

            error?.message ||
            "Gagal memulai layanan notifikasi P.A.G Docs."

          );

        }

      }
    );

  </script>
