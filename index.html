<script>

(() => {

  "use strict";

  /* ========================================================
   * CONFIG (Pre-Resolved URL)
   * ======================================================== */

  const CONFIG = {
    APP_SCRIPT_URL:
      "https://script.google.com/macros/s/AKfycbw9p0LNniGmxeuXBwpQgp-zrGLfDu2RJoToVHkoc4-iYskNwjwBvY_Z5jO75wbzzU-cuw/exec",

    SB_URL:
      "https://qywqxcvnlehmiqrkpwdd.supabase.co",

    SB_KEY:
      "sb_publishable_Trk4jYTk3nI93sFtmWO6Tg_-ps4vYLq",

    VAPID_PUBLIC_KEY:
      "BJA7AZcYbZ-m23nmGsoICga9u-MhkIOfaL4ZuYTF0lO0PyUQKztgodNHp3EjQxKXTfMq0eO0nIDEyi5SHlKEZPg",

    SW_PATH:
      "./sw.js",

    SW_SCOPE:
      "./",

    DEVICE_STORAGE:
      "PAG_DOCS_PUSH_DEVICE_ID",

    BADGE_STORAGE:
      "PAG_DOCS_UNREAD_COUNT",

    MAX_RETRY:
      2,

    NETWORK_TIMEOUT:
      12000
  };

  /* ========================================================
   * ELEMENT CACHING
   * ======================================================== */

  const lock = document.getElementById("notificationLock");
  const lockTitle = document.getElementById("lockTitle");
  const lockText = document.getElementById("lockText");
  const allowButton = document.getElementById("allowButton");
  const errorBox = document.getElementById("errorBox");
  const appFrame = document.getElementById("appFrame");
  const loginWrapper = document.getElementById("loginContainerWrapper");

  /* ========================================================
   * STATE & CACHE
   * ======================================================== */

  let swRegistration = null;
  let initialized = false;
  let booting = false;
  let cachedVapidUint8 = null;

  let session = {
    user_id: null,
    role: null
  };

  const health = {
    secure: false,
    supported: false,
    permission: "unknown",
    serviceWorker: false,
    subscription: false,
    subscriptionSaved: false,
    standalone: false,
    lastError: null
  };

  /* ========================================================
   * LOG
   * ======================================================== */

  const log = (...args) => console.log("[PAG]", ...args);
  const warn = (...args) => console.warn("[PAG]", ...args);
  const error = (...args) => console.error("[PAG]", ...args);

  /* ========================================================
   * ERROR UI
   * ======================================================== */

  function showError(message) {
    errorBox.textContent = String(message || "");
    errorBox.style.display = "block";
  }

  function clearError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
  }

  /* ========================================================
   * LOCK CONTROLS
   * ======================================================== */

  function showLock(title, message, buttonText) {
    lockTitle.textContent = title || "Notifikasi Diperlukan";
    lockText.textContent = message || "";
    allowButton.textContent = buttonText || "Aktifkan Notifikasi";
    lock.classList.remove("hidden");
  }

  function hideLock() {
    lock.classList.add("hidden");
  }

  /* ========================================================
   * OPEN APPLICATION (LIGHTNING EXECUTION)
   * ======================================================== */

  function openApplication() {
    hideLock();
    if (appFrame.style.display !== "block") {
      appFrame.style.display = "block";
    }
    if (!appFrame.src) {
      appFrame.src = CONFIG.APP_SCRIPT_URL;
    }
  }

  /* ========================================================
   * LOCK APPLICATION
   * ======================================================== */

  function lockApplicationInstantly() {
    appFrame.style.display = "none";
    showBlockedState();
  }

  /* ========================================================
   * DEVICE IDENTIFIER & METADATA
   * ======================================================== */

  function getDeviceId() {
    let id = localStorage.getItem(CONFIG.DEVICE_STORAGE);
    if (!id) {
      if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
        id = crypto.randomUUID();
      } else {
        id = "pag-" + Date.now() + "-" + Math.random().toString(36).slice(2);
      }
      localStorage.setItem(CONFIG.DEVICE_STORAGE, id);
    }
    return id;
  }

  function getDeviceLabel() {
    const ua = navigator.userAgent || "";
    if (/Android/i.test(ua)) return "Android";
    if (/iPhone|iPad|iPod/i.test(ua)) return "iOS";
    if (/Windows/i.test(ua)) return "Windows";
    if (/Macintosh|Mac OS/i.test(ua)) return "macOS";
    if (/Linux/i.test(ua)) return "Linux";
    return "Browser";
  }

  function isStandalonePWA() {
    return Boolean(
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
      window.navigator.standalone === true
    );
  }

  /* ========================================================
   * VAPID CRYPTO UTILS (CACHED FOR ZERO OVERHEAD)
   * ======================================================== */

  function vapidToUint8Array(base64) {
    if (cachedVapidUint8) return cachedVapidUint8;
    const padding = "=".repeat((4 - base64.length % 4) % 4);
    const base64Url = (base64 + padding).replace(/-/g, "+").replace(/_/g, "/");
    const raw = atob(base64Url);
    cachedVapidUint8 = Uint8Array.from([...raw].map(char => char.charCodeAt(0)));
    return cachedVapidUint8;
  }

  function subscriptionUsesCurrentVapid(subscription) {
    try {
      if (!subscription) return false;
      const configuredKey = vapidToUint8Array(CONFIG.VAPID_PUBLIC_KEY);
      const actualKey = subscription?.options?.applicationServerKey;
      if (!actualKey) return true;

      const actual = new Uint8Array(actualKey);
      if (actual.length !== configuredKey.length) return false;
      for (let i = 0; i < configuredKey.length; i++) {
        if (actual[i] !== configuredKey[i]) return false;
      }
      return true;
    } catch (errorValue) {
      warn("Tidak dapat memeriksa applicationServerKey:", errorValue);
      return true;
    }
  }

  /* ========================================================
   * NETWORK & SUPABASE FETCH
   * ======================================================== */

  async function fetchWithTimeout(url, options = {}, timeout = CONFIG.NETWORK_TIMEOUT) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  async function supabaseFetch(path, options = {}) {
    const response = await fetchWithTimeout(CONFIG.SB_URL + path, {
      ...options,
      headers: {
        apikey: CONFIG.SB_KEY,
        Accept: "application/json",
        ...(options.headers || {})
      }
    });

    const text = await response.text();
    if (!response.ok) throw new Error("Supabase " + response.status + ": " + text);
    if (!text) return null;
    try { return JSON.parse(text); } catch (_) { return text; }
  }

  async function retry(fn, maxRetry = CONFIG.MAX_RETRY) {
    let lastError = null;
    for (let attempt = 0; attempt <= maxRetry; attempt++) {
      try {
        return await fn(attempt);
      } catch (errorValue) {
        lastError = errorValue;
        if (attempt >= maxRetry) break;
        await new Promise(resolve => setTimeout(resolve, 400 * (attempt + 1)));
      }
    }
    throw lastError;
  }

  /* ========================================================
   * BADGE SYNC
   * ======================================================== */

  async function setBadge(count) {
    const n = Math.max(0, Math.min(999, Number(count) || 0));
    localStorage.setItem(CONFIG.BADGE_STORAGE, String(n));

    try {
      if (typeof navigator.setAppBadge === "function") {
        if (n > 0) {
          await navigator.setAppBadge(n);
        } else if (typeof navigator.clearAppBadge === "function") {
          await navigator.clearAppBadge();
        }
      }
    } catch (badgeError) {
      warn("Badge page:", badgeError);
    }

    try {
      const worker = swRegistration?.active;
      if (worker) {
        worker.postMessage({
          type: n > 0 ? "SET_APP_BADGE" : "CLEAR_APP_BADGE",
          count: n
        });
      }
    } catch (_) {}
  }

  /* ========================================================
   * SERVICE WORKER & SUBSCRIPTION ENGINE
   * ======================================================== */

  async function getSwVersion() {
    return new Promise(resolve => {
      if (!swRegistration?.active) {
        resolve("unknown");
        return;
      }
      const channel = new MessageChannel();
      const timer = setTimeout(() => resolve("unknown"), 1200);
      channel.port1.onmessage = event => {
        clearTimeout(timer);
        resolve(event.data?.version || "unknown");
      };
      try {
        swRegistration.active.postMessage({ type: "PAG_SW_PING" }, [channel.port2]);
      } catch (errorValue) {
        clearTimeout(timer);
        resolve("unknown");
      }
    });
  }

  async function cleanupOldDeviceSubscriptions(endpoint) {
    const deviceId = getDeviceId();
    if (!deviceId || !endpoint) return;

    try {
      const query = "/rest/v1/web_push_subscriptions?device_id=eq." +
        encodeURIComponent(deviceId) + "&endpoint=neq." + encodeURIComponent(endpoint);
      await supabaseFetch(query, { method: "DELETE" });
      log("Subscription lama pada device dibersihkan.");
    } catch (errorValue) {
      warn("Cleanup subscription lama dilewati:", errorValue?.message || errorValue);
    }
  }

  async function saveSubscription(subscription) {
    const json = subscription.toJSON();
    const keys = json.keys || {};
    if (!json.endpoint || !keys.p256dh || !keys.auth) {
      throw new Error("Push subscription tidak lengkap.");
    }

    const row = {
      device_id: getDeviceId(),
      user_id: session.user_id || null,
      role: session.role || null,
      endpoint: json.endpoint,
      keys_p256dh: keys.p256dh,
      keys_auth: keys.auth,
      device_label: getDeviceLabel(),
      updated_at: new Date().toISOString()
    };

    await cleanupOldDeviceSubscriptions(json.endpoint);

    await supabaseFetch("/rest/v1/web_push_subscriptions?on_conflict=endpoint", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates,return=minimal"
      },
      body: JSON.stringify(row)
    });

    health.subscriptionSaved = true;
    log("Push subscription tersimpan di Supabase.");
  }

  async function registerServiceWorker() {
    swRegistration = await navigator.serviceWorker.register(CONFIG.SW_PATH, {
      scope: CONFIG.SW_SCOPE,
      updateViaCache: "none"
    });
    swRegistration = await navigator.serviceWorker.ready;
    health.serviceWorker = true;
    return swRegistration;
  }

  async function ensurePushSubscription() {
    if (!swRegistration) throw new Error("Service Worker belum siap.");
    if (Notification.permission !== "granted") throw new Error("Izin notifikasi belum granted.");

    let subscription = await swRegistration.pushManager.getSubscription();
    if (subscription) {
      const validKey = subscriptionUsesCurrentVapid(subscription);
      if (!validKey) {
        log("Subscription memakai VAPID key lama. Membuat baru...");
        try { await subscription.unsubscribe(); } catch (e) {}
        subscription = null;
      }
    }

    if (!subscription) {
      log("Mendaftarkan PushSubscription baru ke browser...");
      subscription = await swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: vapidToUint8Array(CONFIG.VAPID_PUBLIC_KEY)
      });
    }

    if (!subscription) throw new Error("PushSubscription gagal dibuat.");
    health.subscription = true;
    return subscription;
  }

  /* ========================================================
   * INITIALIZE PUSH (BERJALAN DI BACKGROUND / IDLE THREAD)
   * ======================================================== */

  async function initializePush() {
    if (initialized) return true;
    if (booting) return false;
    booting = true;

    try {
      if (!window.isSecureContext) throw new Error("Aplikasi membutuhkan HTTPS.");
      if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
        throw new Error("Browser tidak mendukung Service Worker / Web Push.");
      }

      await registerServiceWorker();

      const subscription = await retry(async () => ensurePushSubscription());
      await retry(async () => saveSubscription(subscription));

      const oldBadge = Number(localStorage.getItem(CONFIG.BADGE_STORAGE) || 0);
      if (oldBadge > 0) await setBadge(oldBadge);

      initialized = true;
      log("Push system READY.");
      return true;

    } catch (errorValue) {
      error("Push background error:", errorValue);
      throw errorValue;
    } finally {
      booting = false;
    }
  }

  // Menjalankan push tanpa merebut bandwidth rendering utama
  function runPushInBackground() {
    if ("requestIdleCallback" in window) {
      requestIdleCallback(() => initializePush().catch(e => warn("Background Push:", e)), { timeout: 3500 });
    } else {
      setTimeout(() => initializePush().catch(e => warn("Background Push:", e)), 1200);
    }
  }

  /* ========================================================
   * REAL-TIME PERMISSION MONITOR
   * ======================================================== */

  function setupRealtimePermissionMonitor() {
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: "notifications" }).then(permissionStatus => {
        permissionStatus.onchange = () => {
          log("Status izin berubah real-time:", permissionStatus.state);
          if (permissionStatus.state === "granted") {
            openApplication();
            runPushInBackground();
          } else {
            lockApplicationInstantly();
          }
        };
      }).catch(e => {
        warn("Permission query tidak didukung:", e);
      });
    }
  }

  /* ========================================================
   * REQUEST PERMISSION
   * ======================================================== */

  async function requestNotificationPermission() {
    clearError();
    allowButton.disabled = true;

    try {
      if (Notification.permission === "denied") {
        showBlockedState();
        return;
      }

      if (Notification.permission === "granted") {
        openApplication();
        runPushInBackground();
        return;
      }

      const permission = await Notification.requestPermission();
      health.permission = permission;

      if (permission === "granted") {
        openApplication();
        runPushInBackground();
      } else if (permission === "denied") {
        showBlockedState();
      } else {
        showLock(
          "Notifikasi Belum Diizinkan",
          "Izinkan notifikasi agar Aplikasi dapat mengirim pemberitahuan penting.",
          "Aktifkan Notifikasi"
        );
      }

    } catch (errorValue) {
      error("Push init error:", errorValue);
      showError(errorValue?.message || String(errorValue));
      showLock(
        "Notifikasi Belum Siap",
        "Periksa koneksi internet Anda lalu coba lagi.",
        "Coba Lagi"
      );
    } finally {
      allowButton.disabled = false;
    }
  }

  /* ========================================================
   * BLOCKED STATE
   * ======================================================== */

  function showBlockedState() {
    showLock(
      "Aplikasi Diblokir",
      "Karena izin notifikasi telah diblokir di browser. Buka pengaturan browser - Izin - Izinkan Notifikasi - Reload.",
      "Saya Sudah Mengizinkan"
    );
    allowButton.disabled = false;
  }

  async function handleAllowButton() {
    clearError();

    if (Notification.permission === "denied") {
      if (Notification.permission === "granted") {
        openApplication();
        runPushInBackground();
      } else {
        showBlockedState();
      }
      return;
    }

    await requestNotificationPermission();
  }

  /* ========================================================
   * SESSION DARI IFRAME APPS SCRIPT
   * ======================================================== */

  async function handleIframeMessage(event) {
    if (event.source !== appFrame.contentWindow) return;
    const data = event.data || {};
    if (typeof data !== "object") return;

    if (data.type === "SYNC_USER_SESSION") {
      session.user_id = data.user_id ?? data.userId ?? data.user?.id ?? null;
      session.role = data.role ?? data.user?.role ?? null;
      log("Session synced:", session.user_id, session.role);

      try {
        const subscription = await swRegistration?.pushManager?.getSubscription();
        if (subscription) await saveSubscription(subscription);
      } catch (errorValue) {
        warn("Update session error:", errorValue);
      }
    }

    if (data.type === "SET_APP_BADGE") await setBadge(data.count);
    if (data.type === "CLEAR_APP_BADGE") await setBadge(0);

    // KETIKA USER LOGIN SUKSES DI DALAM APLIKASI
    if (data.type === "PAG_LOGIN_SUCCESS") {
      if (loginWrapper) loginWrapper.style.display = "none";
      if (appFrame.style.display !== "block") appFrame.style.display = "block";
    }
  }

  function getPlatformMessage() {
    const ua = navigator.userAgent || "";
    const mobile = /Android|iPhone|iPad|iPod/i.test(ua);
    if (!mobile || isStandalonePWA()) return null;

    if (/iPhone|iPad|iPod/i.test(ua)) {
      return "Untuk menerima notifikasi Aplikasi secara optimal di iPhone/iPad, pasang Aplikasi ke Layar Utama sebagai PWA terlebih dahulu, kemudian buka Aplikasi dari ikon tersebut.";
    }
    return null;
  }

  /* ========================================================
   * FAST BOOT ENGINE
   * ======================================================== */

  function boot() {
    // 1. FAST-PATH: Jika izin sudah ada, muat iframe secepat kilat tanpa halangan!
    if (("Notification" in window) && Notification.permission === "granted") {
      openApplication();
      runPushInBackground();
    }

    // 2. Pasang Event Listener
    allowButton.addEventListener("click", handleAllowButton);
    window.addEventListener("message", handleIframeMessage);
    setupRealtimePermissionMonitor();

    // 3. Validasi Keamanan & Dukungan Perangkat
    if (!window.isSecureContext) {
      showLock("Koneksi Tidak Aman", "Web Push Aplikasi membutuhkan HTTPS.", "Tutup");
      allowButton.disabled = true;
      return;
    }

    if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
      showLock("Browser Tidak Mendukung", "Browser ini tidak mendukung Web Push. Gunakan browser modern seperti Chrome atau Edge.", "Tutup");
      allowButton.disabled = true;
      return;
    }

    // 4. Tangani Status Izin yang Belum Selesai
    if (Notification.permission === "granted") {
      return; // Sudah ditangani di FAST-PATH
    }

    if (Notification.permission === "denied") {
      showBlockedState();
      return;
    }

    const mobileMessage = getPlatformMessage();
    if (mobileMessage) {
      showLock("Pasang Aplikasi Terlebih Dahulu", mobileMessage, "Saya Sudah Memasang");
      allowButton.addEventListener("click", async () => {
        if (isStandalonePWA()) {
          await requestNotificationPermission();
        } else {
          showLock("Aplikasi Belum Terpasang", mobileMessage, "Saya Sudah Memasang");
        }
      }, { once: true });
      return;
    }

    showLock(
      "Izin Notifikasi Diperlukan",
      "Aplikasi menggunakan notifikasi browser sebagai satu-satunya sistem pemberitahuan. Izinkan notifikasi untuk membuka aplikasi.",
      "Aktifkan Notifikasi"
    );
  }

  // Eksekusi boot seketika
  boot();

  /* ========================================================
   * CONTROLLER LOGIN & REGISTER (INTEGRASI PENUH DI PWA SHELL)
   * ======================================================== */

  window.Login = (function () {

    function setFeedback(msg, isError) {
      const fb = document.getElementById("loginFeedbackBox");
      if (!fb) return;
      if (!msg) {
        fb.style.display = "none";
        fb.textContent = "";
        return;
      }
      fb.className = isError ? "alert-box alert-danger" : "alert-box alert-success";
      fb.textContent = msg;
      fb.style.display = "block";
    }

    function switchTab(tabName) {
      setFeedback("", false);
      const pLogin = document.getElementById("panelLogin");
      const pReg = document.getElementById("panelRegister");
      const tLogin = document.getElementById("tabBtnLogin");
      const tReg = document.getElementById("tabBtnRegister");

      if (tabName === "register") {
        if (pLogin) pLogin.style.display = "none";
        if (pReg) pReg.style.display = "block";
        if (tLogin) tLogin.classList.remove("active");
        if (tReg) tReg.classList.add("active");
      } else {
        if (pLogin) pLogin.style.display = "block";
        if (pReg) pReg.style.display = "none";
        if (tLogin) tLogin.classList.add("active");
        if (tReg) tReg.classList.remove("active");
      }
    }

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
      } else {
        input.type = "password";
        btn.textContent = "👁️";
      }
    }

    function updateRoleHint() {
      const roleEl = document.getElementById("reg_role");
      if (!roleEl) return;
      const r = roleEl.value;
      const hint = document.getElementById("roleHintBox");
      if (!hint) return;

      hint.className = "role-hint " + (r === "superuser" ? "alert-danger" : r === "user teknik" ? "alert-success" : "alert-info");

      if (r === "superuser") {
        hint.innerHTML = "👑 <b>Superuser:</b> Akses seluruh menu, persetujuan pendaftar, dan broadcast.";
      } else if (r === "user teknik") {
        hint.innerHTML = "🛠️ <b>User Teknik:</b> Kelola Data Perusahaan, Tender, Paket, Personil, dan Master.";
      } else if (r === "user tender") {
        hint.innerHTML = "📊 <b>User Tender:</b> Input Tender & Personil (Anti-Download & Anti-Screenshot).";
      } else {
        hint.innerHTML = "👁️ <b>User Biasa:</b> Akses lihat data saja (Read-Only).";
      }
    }

    function submitLogin() {
      setFeedback("", false);
      const userEl = document.getElementById("log_user");
      const passEl = document.getElementById("log_pass");
      const btn = document.getElementById("btnSubmitLogin");

      const username = userEl ? String(userEl.value).trim() : "";
      const password = passEl ? String(passEl.value).trim() : "";

      if (!username || !password) {
        setFeedback("Username dan password wajib diisi.", true);
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.textContent = "⏳ Menghubungkan ke Server...";
      }

      // Pastikan iframe mulai memuat di background
      openApplication();

      let loginSukses = false;
      let percobaan = 0;
      const maxPercobaan = 10; // Coba ulang hingga 10 detik

      // 1. Fungsi pengirim pesan berulang sampai iframe merespons
      const kirimPesanKeIframe = () => {
        if (loginSukses) return;
        percobaan++;

        try {
          if (appFrame && appFrame.contentWindow) {
            appFrame.contentWindow.postMessage({
              action: "FAST_LOGIN",
              username: username,
              password: password
            }, "*");
            console.log("[PWA] Mengirim sinyal login ke iframe (Percobaan ke-" + percobaan + ")");
          }
        } catch (e) {
          console.warn("Gagal kirim pesan:", e);
        }

        // Jika belum dijawab dan belum timeout, kirim ulang tiap 1 detik
        if (percobaan < maxPercobaan && !loginSukses) {
          setTimeout(kirimPesanKeIframe, 1000);
        } else if (percobaan >= maxPercobaan && !loginSukses) {
          // JALUR DARURAT: Jika iframe tidak menjawab via postMessage, 
          // langsung buka iframe agar user tidak terjebak di layar beku!
          if (btn) {
            btn.disabled = false;
            btn.textContent = "MASUK KE SISTEM";
          }
          if (loginWrapper) loginWrapper.style.display = "none";
          if (appFrame.style.display !== "block") appFrame.style.display = "block";
        }
      };

      // Mulai kirim percobaan pertama
      kirimPesanKeIframe();

      // 2. Listener penerima respon dari Google Apps Script
      const authListener = function (evt) {
        if (evt.source !== appFrame.contentWindow) return;
        const res = evt.data || {};

        if (res.type === "LOGIN_SUCCESS_RESULT" || res.type === "PAG_LOGIN_SUCCESS") {
          loginSukses = true;
          window.removeEventListener("message", authListener);
          if (btn) {
            btn.disabled = false;
            btn.textContent = "MASUK KE SISTEM";
          }
          // Sembunyikan form login, tampilkan aplikasi
          if (loginWrapper) loginWrapper.style.display = "none";
          if (appFrame.style.display !== "block") appFrame.style.display = "block";
        } else if (res.type === "LOGIN_FAILED_RESULT") {
          loginSukses = true;
          window.removeEventListener("message", authListener);
          if (btn) {
            btn.disabled = false;
            btn.textContent = "MASUK KE SISTEM";
          }
          setFeedback(res.message || "Username atau password salah.", true);
        }
      };

      window.addEventListener("message", authListener);
    }

      // Batas waktu timeout jika koneksi lambat
      setTimeout(() => {
        if (btn && btn.disabled) {
          btn.disabled = false;
          btn.textContent = "MASUK KE SISTEM";
          setFeedback("Proses verifikasi sedang berjalan di server...", false);
        }
      }, 7000);
    }

    function submitRegister() {
      setFeedback("", false);
      const namaEl = document.getElementById("reg_nama");
      const emailEl = document.getElementById("reg_email");
      const passEl = document.getElementById("reg_pass");
      const roleEl = document.getElementById("reg_role");
      const btn = document.getElementById("btnSubmitRegister");

      const nama = namaEl ? String(namaEl.value).trim() : "";
      const email = emailEl ? String(emailEl.value).trim().toLowerCase() : "";
      const password = passEl ? String(passEl.value).trim() : "";
      const role = roleEl ? String(roleEl.value).trim().toLowerCase() : "user biasa";

      if (!nama || !email || !password) {
        setFeedback("Nama lengkap, email, dan password wajib diisi.", true);
        return;
      }

      if (password.length < 8) {
        setFeedback("Password minimal 8 karakter.", true);
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.textContent = "⏳ Menyimpan Akun...";
      }

      openApplication();

      const regPayload = {
        action: "FAST_REGISTER",
        user: { nama: nama, email: email, password: password, role: role }
      };

      const sendRegister = () => {
        try {
          if (appFrame && appFrame.contentWindow) {
            appFrame.contentWindow.postMessage(regPayload, "*");
          }
        } catch (_) {}
      };

      sendRegister();
      setTimeout(sendRegister, 1200);

      const regListener = function (evt) {
        if (evt.source !== appFrame.contentWindow) return;
        const res = evt.data || {};
        if (res.type === "REGISTER_SUCCESS_RESULT") {
          window.removeEventListener("message", regListener);
          if (btn) {
            btn.disabled = false;
            btn.textContent = "📝 AJUKAN PENDAFTARAN";
          }
          setFeedback("✅ Pendaftaran berhasil! Silakan masuk.", false);
          setTimeout(() => switchTab("login"), 1500);
        } else if (res.type === "REGISTER_FAILED_RESULT") {
          window.removeEventListener("message", regListener);
          if (btn) {
            btn.disabled = false;
            btn.textContent = "📝 AJUKAN PENDAFTARAN";
          }
          setFeedback(res.message || "Gagal mengajukan pendaftaran.", true);
        }
      };

      window.addEventListener("message", regListener);
    }

    return {
      switchTab: switchTab,
      togglePassword: togglePassword,
      updateRoleHint: updateRoleHint,
      submitLogin: submitLogin,
      submitRegister: submitRegister
    };

  })();

})();

</script>
