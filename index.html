<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PT. Putra Aulia Group</title>
  
  <meta name="theme-color" content="#f1f5f9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PT.PA">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- OneSignal Web Push SDK (v16+) -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.PAG_ONESIGNAL_STATE = {
      initialized: false,
      isLoggedIn: false,
      currentRole: null,
      notificationCount: 0
    };

    OneSignalDeferred.push(async function(OneSignal) {
  await OneSignal.init({
    appId: "09896d31-da53-45e4-8d8a-1262879e5c74",
    safari_web_id: "web.onesignal.auto.e9c3d005-53b3-4bef-8721-dd6062e20559",
    notifyButton: { enable: false },
    allowLocalhostAsSecureOrigin: true
  });

  // ⚡ Otomatis pasang tag superuser/role saat SDK siap
  const cachedRole = localStorage.getItem('PAG_USER_ROLE') || 'superuser';
  try {
    await OneSignal.User.addTag("role", String(cachedRole).toLowerCase().trim());
    console.log("[OneSignal] 🏷️ Tag Role Otomatis Terpasang:", cachedRole);
  } catch (e) {}

  periksaStatusSubscription();
  });

        window.PAG_ONESIGNAL_STATE.initialized = true;
        console.log("[OneSignal] ✓ SDK Berhasil Terpasang");

        // Periksa status subscription saat ini
        periksaStatusSubscription();

        // Pantau perubahan status izin & subscription (realtime)
        OneSignal.User.PushSubscription.addEventListener("change", function(event) {
          console.log("[OneSignal] Status subscription berubah:", event);
          periksaStatusSubscription();
        });

        // Pulihkan role dari cache lokal jika ada
        const cachedRole = localStorage.getItem('PAG_USER_ROLE');
        if (cachedRole) {
          console.log("[OneSignal] 📦 Memasang kembali Tag Role dari cache:", cachedRole);
          window.pagSetDeviceRole(cachedRole);
        }

        // Handler klik notifikasi push
        OneSignal.Notifications.addEventListener('click', function(event) {
          const notifUrl = event.notification.launchURL;
          if (notifUrl && notifUrl.includes('#')) {
            const hash = notifUrl.substring(notifUrl.indexOf('#'));
            window.location.hash = hash;
            syncUrlToIframe();
          }
        });

      } catch (err) {
        console.error("[OneSignal] ✗ Inisialisasi Gagal:", err);
      }
      });

    /* ================================================================
     * MEMASANG TAG ROLE KE PERANGKAT (TANPA EXTERNAL ID)
     * ================================================================ */
    window.pagSetDeviceRole = async function(role) {
      if (!role) return;
      try {
        const r = String(role).toLowerCase().trim();
        console.log("[OneSignal] 🏷️ Memasang Tag Role ke Perangkat:", r);
        
        // Menggunakan Tag OneSignal agar bisa difilter saat kirim push notifikasi role
        await OneSignal.User.addTag("role", r);
        window.PAG_ONESIGNAL_STATE.currentRole = r;
      } catch (e) {
        console.error("[OneSignal] Gagal memasang tag role:", e);
      }
    };

    /* ================================================================
     * LISTENER POSTMESSAGE DARI GOOGLE APPS SCRIPT IFRAME
     * ================================================================ */
    window.addEventListener('message', async function(event) {
  if (!event.data) return;
  let data = event.data;

  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch(e) { return; }
  }

  if (data.type === 'PAG_LOGIN_SUCCESS' || data.type === 'PAG_SESSION_READY') {
    const uRole = data.role || 'superuser';
    localStorage.setItem('PAG_USER_ROLE', uRole);
    if (window.pagSetDeviceRole) {
      await window.pagSetDeviceRole(uRole);
    }
  }
});

      // Logout
      if (data.type === 'PAG_LOGOUT') {
        console.log("[OneSignal] User logout - menghapus cache role");
        localStorage.removeItem('PAG_USER_ROLE');
        localStorage.removeItem('PAG_USER_NAMA');
        OneSignalDeferred.push(async function(OneSignal) {
          await OneSignal.User.removeTag("role");
        });
      }
    });

    /* ================================================================
     * FUNGSI UPDATE TAMPILAN JIKA SUDAH AKTIF
     * ================================================================ */
    function periksaStatusSubscription() {
      OneSignalDeferred.push(function(OneSignal) {
        const isPushSupported = OneSignal.Notifications.isPushSupported();
        const permission = Notification.permission;
        const isOptedIn = OneSignal.User.PushSubscription.optedIn;

        if (permission === 'granted' && isOptedIn) {
          var btn = document.getElementById('btnNotif');
          var desc = document.getElementById('notifDesc');
          var indicator = document.querySelector('#notifBox .status-indicator');

          if (btn) {
            btn.textContent = 'Aktif ✔';
            btn.className = 'btn-action btn-success';
            btn.disabled = true;
          }
          if (desc) {
            desc.textContent = 'Notifikasi push sudah aktif di perangkat ini.';
          }
          if (indicator) {
            indicator.classList.add('active');
          }
        }
      });
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #appFrame {
      width: 100%; height: 100%; border: none; display: block; background: #f8fafc;
      position: absolute; inset: 0; z-index: 1;
    }
    #setupModal {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, rgba(248,250,252,0.95) 0%, rgba(226,232,240,0.95) 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 999999;
      padding: 20px; overflow-y: auto; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .setup-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px; padding: 32px 24px; max-width: 420px; width: 100%;
      text-align: center; position: relative;
    }
    .brand-badge {
      display: inline-block; background: linear-gradient(135deg, #0d9488, #0f766e);
      color: #ffffff; font-weight: 800; font-size: 20px; padding: 8px 16px;
      border-radius: 12px; margin-bottom: 16px; letter-spacing: 1px;
    }
    .action-box {
      background: #ffffff; border: 1px solid rgba(203, 213, 225, 0.8);
      border-radius: 16px; padding: 16px; margin-bottom: 14px; text-align: left;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .btn-action { padding: 9px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; }
    .btn-primary { background: linear-gradient(180deg, #0d9488 0%, #0f766e 100%); color: #ffffff; }
    .btn-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; cursor: default; }
    .status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; margin-right: 6px; }
    .status-indicator.active { background: #22c55e; }
  </style>
</head>
<body>

  <div id="setupModal">
    <div class="setup-card">
      <div class="brand-badge">P.A.G</div>
      <h2>PT. PUTRA AULIA GROUP</h2>
      <p style="font-size:13px; color:#475569; margin-bottom:24px;">Aktifkan notifikasi dan install aplikasi untuk memantau dokumen & tender.</p>

      <div class="action-box" id="notifBox">
        <div>
          <h4 style="font-size:13.5px; font-weight:700;"><span class="status-indicator"></span>🔔 Notifikasi Real-Time</h4>
          <p style="font-size:11.5px; color:#64748b;" id="notifDesc">Wajib diaktifkan agar update dokumen masuk ke perangkat.</p>
        </div>
        <button id="btnNotif" type="button" class="btn-action btn-primary" onclick="aktifkanNotifikasi()">Aktifkan</button>
      </div>

      <button type="button" style="width:100%; padding:14px; border-radius:14px; background:#0d9488; color:#fff; font-weight:700; border:none; cursor:pointer;" onclick="bukaAplikasiUtama()">
        Lanjutkan ke Aplikasi ➔
      </button>
    </div>
  </div>

  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec" 
    allow="clipboard-read; clipboard-write; geolocation; camera; microphone;"
  ></iframe>

  <script>
    var APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec";
    var frame = document.getElementById('appFrame');
    var setupModal = document.getElementById('setupModal');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/OneSignalSDKWorker.js').catch(function(e) {});
      });
    }

    function aktifkanNotifikasi() {
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.Notifications.requestPermission();
          periksaStatusSubscription();
        } catch (err) {}
      });
    }

    function bukaAplikasiUtama() {
      localStorage.setItem('PAG_SETUP_DONE', 'true');
      if (setupModal) setupModal.style.display = 'none';
    }

    if (localStorage.getItem('PAG_SETUP_DONE') === 'true') {
      if (setupModal) setupModal.style.display = 'none';
    }

    window.addEventListener('hashchange', function() {
      var hash = window.location.hash || '';
      if (frame && hash) frame.src = APPS_SCRIPT_EXEC_URL + hash;
    });
  </script>
</body>
</html>
