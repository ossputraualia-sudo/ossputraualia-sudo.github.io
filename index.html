<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f766e"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <title>PAG Docs</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #ffffff;

    }


    #app {

      width: 100%;

      height: 100%;

    }


    /*
     * LOCK SCREEN
     *
     * Ini BUKAN notification banner.
     *
     * Ini hanya pengunci aplikasi ketika
     * notification permission belum diberikan.
     */

    #notificationLock {

      position: fixed;

      inset: 0;

      z-index: 999999;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;

      background: #f4f7f8;

    }


    #notificationLock.hidden {

      display: none;

    }


    .lockCard {

      width: min(
        430px,
        100%
      );

      padding: 30px;

      border-radius: 20px;

      background: #ffffff;

      box-shadow:
        0 15px 45px
        rgba(
          0,
          0,
          0,
          .12
        );

      text-align: center;

    }


    .lockLogo {

      width: 72px;

      height: 72px;

      margin:
        0 auto
        18px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 18px;

      background: #0f766e;

      color: white;

      font-size: 23px;

      font-weight: 800;

    }


    .lockCard h1 {

      margin:
        0 0
        10px;

      font-size: 21px;

    }


    .lockCard p {

      margin:
        8px 0
        18px;

      color: #5f6870;

      font-size: 14px;

      line-height: 1.6;

    }


    .lockButton {

      width: 100%;

      padding: 14px 20px;

      border: 0;

      border-radius: 11px;

      background: #0f766e;

      color: white;

      font-weight: 700;

      cursor: pointer;

    }


    .lockButton:disabled {

      opacity: .55;

      cursor: default;

    }


    .lockSmall {

      font-size: 12px !important;

      color: #7b858d !important;

    }


    #errorBox {

      display: none;

      margin-top: 14px;

      padding: 10px;

      border-radius: 9px;

      background: #fff1f1;

      color: #a33;

      font-size: 12px;

      text-align: left;

      word-break: break-word;

    }


    #appFrame {

      display: none;

      width: 100%;

      height: 100%;

      border: 0;

    }

  </style>

</head>


<body>


<div id="app">


  <!-- =====================================================
       LOCK
       ===================================================== -->

  <div id="notificationLock">

    <div class="lockCard">

      <div class="lockLogo">
        PAG
      </div>


      <h1 id="lockTitle">
        Izin Notifikasi Diperlukan
      </h1>


      <p id="lockText">

        PAG Docs menggunakan
        notifikasi browser sebagai
        satu-satunya sistem
        pemberitahuan.

        Izinkan notifikasi
        untuk membuka aplikasi.

      </p>


      <button
        id="allowButton"
        class="lockButton"
      >
        Aktifkan Notifikasi
      </button>


      <p class="lockSmall">

        Setelah diizinkan,
        notifikasi diproses oleh
        Service Worker dan dapat
        diterima saat PAG Docs
        sedang dibuka maupun tidak.

      </p>


      <div id="errorBox"></div>

    </div>

  </div>


  <!-- =====================================================
       MAIN APPLICATION
       ===================================================== -->

  <iframe
    id="appFrame"
    title="PAG Docs"
    allow="notifications"
  ></iframe>


</div>


<script>

(() => {

  "use strict";


  /* ========================================================
   * CONFIG
   * ======================================================== */

  const CONFIG = {

    APP_SCRIPT_URL:
      "https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec",


    SB_URL:
      "https://qywqxcvnlehmiqrkpwdd.supabase.co",


    /*
     * PUBLISHABLE KEY
     *
     * BENAR:
     *
     * sb_publishable_Trk4jYTk3nI93sFtmWO6Tg_-ps4vYLq
     */

    SB_KEY:
      "sb_publishable_Trk4jYTk3nI93sFtmWO6Tg_-ps4vYLq",


    VAPID_PUBLIC_KEY:
      "BJA7AZcYbZ-m23nmGsoICga9u-MhkIOfaL4ZuYTF0lO0PyUQKztgodNHp3EjQxKXTfMq0eO0nIDEyi5SHlKEZPg",


    SW_PATH:
      "./sw.js",


    DEVICE_STORAGE:
      "PAG_DOCS_PUSH_DEVICE_ID",


    BADGE_STORAGE:
      "PAG_DOCS_UNREAD_COUNT"

  };


  /* ========================================================
   * ELEMENT
   * ======================================================== */

  const lock =
    document.getElementById(
      "notificationLock"
    );


  const lockTitle =
    document.getElementById(
      "lockTitle"
    );


  const lockText =
    document.getElementById(
      "lockText"
    );


  const allowButton =
    document.getElementById(
      "allowButton"
    );


  const errorBox =
    document.getElementById(
      "errorBox"
    );


  const appFrame =
    document.getElementById(
      "appFrame"
    );


  /* ========================================================
   * STATE
   * ======================================================== */

  let swRegistration =
    null;


  let initialized =
    false;


  let session = {

    user_id: null,

    role: null

  };


  /* ========================================================
   * ERROR
   * ======================================================== */

  function showError(message) {

    errorBox.textContent =
      String(message || "");

    errorBox.style.display =
      "block";

  }


  function clearError() {

    errorBox.textContent =
      "";

    errorBox.style.display =
      "none";

  }


  /* ========================================================
   * LOCK
   * ======================================================== */

  function showLock(
    title,
    message,
    buttonText
  ) {

    lockTitle.textContent =
      title;

    lockText.textContent =
      message;

    allowButton.textContent =
      buttonText ||
      "Aktifkan Notifikasi";

    lock.classList.remove(
      "hidden"
    );

  }


  function hideLock() {

    lock.classList.add(
      "hidden"
    );

  }


  /* ========================================================
   * DEVICE ID
   * ======================================================== */

  function getDeviceId() {

    let id =
      localStorage.getItem(
        CONFIG.DEVICE_STORAGE
      );


    if (!id) {

      if (
        crypto.randomUUID
      ) {

        id =
          crypto.randomUUID();

      } else {

        id =
          "pag-" +
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .slice(2);

      }


      localStorage.setItem(
        CONFIG.DEVICE_STORAGE,
        id
      );

    }


    return id;

  }


  /* ========================================================
   * DEVICE LABEL
   * ======================================================== */

  function getDeviceLabel() {

    const ua =
      navigator.userAgent ||
      "";


    if (
      /Android/i.test(ua)
    ) {

      return "Android";

    }


    if (
      /iPhone|iPad|iPod/i.test(ua)
    ) {

      return "iOS";

    }


    if (
      /Windows/i.test(ua)
    ) {

      return "Windows";

    }


    if (
      /Macintosh|Mac OS/i.test(ua)
    ) {

      return "macOS";

    }


    if (
      /Linux/i.test(ua)
    ) {

      return "Linux";

    }


    return "Browser";

  }


  /* ========================================================
   * VAPID KEY
   * ======================================================== */

  function vapidToUint8Array(
    base64
  ) {

    const padding =
      "=".repeat(
        (4 - base64.length % 4) % 4
      );


    const base64Url =
      (
        base64 + padding
      )
        .replace(
          /-/g,
          "+"
        )
        .replace(
          /_/g,
          "/"
        );


    const raw =
      atob(base64Url);


    return Uint8Array.from(
      [...raw].map(
        char =>
          char.charCodeAt(0)
      )
    );

  }


  /* ========================================================
   * SUPABASE REST
   *
   * PENTING:
   *
   * sb_publishable_* hanya dikirim sebagai
   * apikey.
   *
   * JANGAN:
   *
   * Authorization: Bearer sb_publishable_...
   *
   * ======================================================== */

  async function supabaseFetch(
    path,
    options = {}
  ) {

    const response =
      await fetch(
        CONFIG.SB_URL + path,
        {

          ...options,

          headers: {

            apikey:
              CONFIG.SB_KEY,

            Accept:
              "application/json",

            ...(options.headers || {})

          }

        }
      );


    const text =
      await response.text();


    if (!response.ok) {

      throw new Error(
        "Supabase " +
        response.status +
        ": " +
        text
      );

    }


    if (!text) {

      return null;

    }


    try {

      return JSON.parse(text);

    } catch (_) {

      return text;

    }

  }


  /* ========================================================
   * BADGE
   * ======================================================== */

  async function setBadge(
    count
  ) {

    const n =
      Math.max(
        0,
        Math.min(
          999,
          Number(count) || 0
        )
      );


    localStorage.setItem(
      CONFIG.BADGE_STORAGE,
      String(n)
    );


    /*
     * Page-side Badging API.
     */

    try {

      if (
        typeof navigator.setAppBadge ===
        "function"
      ) {

        if (n > 0) {

          await navigator.setAppBadge(
            n
          );

        } else {

          if (
            typeof navigator.clearAppBadge ===
            "function"
          ) {

            await navigator.clearAppBadge();

          }

        }

      }

    } catch (error) {

      console.warn(
        "[PAG] Badge:",
        error
      );

    }


    /*
     * Kirim juga ke Service Worker.
     */

    try {

      if (
        swRegistration?.active
      ) {

        swRegistration.active.postMessage({

          type:
            n > 0
              ? "SET_APP_BADGE"
              : "CLEAR_APP_BADGE",

          count:
            n

        });

      }

    } catch (_) {}

  }


  /* ========================================================
   * SW VERSION
   * ======================================================== */

  async function getSwVersion() {

    return new Promise(
      resolve => {

        const channel =
          new MessageChannel();


        const timer =
          setTimeout(
            () => {

              resolve(
                "unknown"
              );

            },
            1500
          );


        channel.port1.onmessage =
          event => {

            clearTimeout(
              timer
            );


            resolve(
              event.data?.version ||
              "unknown"
            );

          };


        swRegistration?.active?.postMessage(
          {
            type:
              "PAG_SW_PING"
          },
          [
            channel.port2
          ]
        );

      }
    );

  }


  /* ========================================================
   * SAVE SUBSCRIPTION
   * ======================================================== */

  async function saveSubscription(
    subscription
  ) {

    const json =
      subscription.toJSON();


    const keys =
      json.keys || {};


    if (
      !json.endpoint ||
      !keys.p256dh ||
      !keys.auth
    ) {

      throw new Error(
        "Push subscription tidak lengkap."
      );

    }


    const row = {

      device_id:
        getDeviceId(),

      user_id:
        session.user_id || null,

      role:
        session.role || null,

      endpoint:
        json.endpoint,

      keys_p256dh:
        keys.p256dh,

      keys_auth:
        keys.auth,

      device_label:
        getDeviceLabel(),

      updated_at:
        new Date().toISOString()

    };


    await supabaseFetch(

      "/rest/v1/web_push_subscriptions" +
      "?on_conflict=endpoint",

      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json",

          "Prefer":
            "resolution=merge-duplicates,return=minimal"

        },

        body:
          JSON.stringify(row)

      }

    );


    console.log(
      "[PAG] Push subscription tersimpan."
    );

  }


  /* ========================================================
   * INITIALIZE PUSH
   * ======================================================== */

  async function initializePush() {

    if (initialized) {

      return;

    }


    if (
      !window.isSecureContext
    ) {

      throw new Error(
        "PAG Docs membutuhkan HTTPS."
      );

    }


    if (
      !("serviceWorker" in navigator)
    ) {

      throw new Error(
        "Browser tidak mendukung Service Worker."
      );

    }


    if (
      !("PushManager" in window)
    ) {

      throw new Error(
        "Browser tidak mendukung Web Push."
      );

    }


    if (
      !("Notification" in window)
    ) {

      throw new Error(
        "Browser tidak mendukung Notification API."
      );

    }


    if (
      Notification.permission !==
      "granted"
    ) {

      throw new Error(
        "Izin notifikasi belum granted."
      );

    }


    /* ------------------------------------------------------
     * REGISTER SERVICE WORKER
     * ------------------------------------------------------ */

    swRegistration =
      await navigator.serviceWorker.register(
        CONFIG.SW_PATH,
        {
          scope:
            "./"
        }
      );


    swRegistration =
      await navigator.serviceWorker.ready;


    console.log(
      "[PAG] SW:",
      await getSwVersion()
    );


    /* ------------------------------------------------------
     * GET EXISTING SUBSCRIPTION
     * ------------------------------------------------------ */

    let subscription =
      await swRegistration
        .pushManager
        .getSubscription();


    /* ------------------------------------------------------
     * CREATE SUBSCRIPTION
     * ------------------------------------------------------ */

    if (!subscription) {

      subscription =
        await swRegistration
          .pushManager
          .subscribe({

            userVisibleOnly:
              true,

            applicationServerKey:
              vapidToUint8Array(
                CONFIG.VAPID_PUBLIC_KEY
              )

          });

    }


    /* ------------------------------------------------------
     * SAVE
     * ------------------------------------------------------ */

    await saveSubscription(
      subscription
    );


    initialized =
      true;


    /* ------------------------------------------------------
     * OPEN APP
     * ------------------------------------------------------ */

    hideLock();


    appFrame.style.display =
      "block";


    if (
      !appFrame.src
    ) {

      appFrame.src =
        CONFIG.APP_SCRIPT_URL;

    }


    /* ------------------------------------------------------
     * RESTORE BADGE
     * ------------------------------------------------------ */

    const oldBadge =
      Number(
        localStorage.getItem(
          CONFIG.BADGE_STORAGE
        ) || 0
      );


    if (
      oldBadge > 0
    ) {

      await setBadge(
        oldBadge
      );

    }


    console.log(
      "[PAG] Push system READY."
    );

  }


  /* ========================================================
   * USER REQUEST PERMISSION
   * ======================================================== */

  async function requestNotificationPermission() {

    clearError();

    allowButton.disabled =
      true;


    try {

      const permission =
        await Notification.requestPermission();


      if (
        permission !==
        "granted"
      ) {

        showLock(

          "Notifikasi Belum Diizinkan",

          "PAG Docs dikunci sampai izin notifikasi diberikan. Jika sebelumnya memilih Blokir, aktifkan kembali izin notifikasi melalui pengaturan browser.",

          "Coba Lagi"

        );


        return;

      }


      await initializePush();


    } catch (error) {

      console.error(
        "[PAG] Push init:",
        error
      );


      showError(
        error?.message ||
        String(error)
      );


      showLock(

        "Notifikasi Belum Siap",

        "Periksa koneksi internet dan izin notifikasi, kemudian coba lagi.",

        "Coba Lagi"

      );

    } finally {

      allowButton.disabled =
        false;

    }

  }


  /* ========================================================
   * MESSAGE DARI APPS SCRIPT
   *
   * Apps Script dapat mengirim:
   *
   * window.parent.postMessage({
   *   type: "SYNC_USER_SESSION",
   *   user_id: "...",
   *   role: "user_teknik"
   * }, "*");
   *
   * ======================================================== */

  async function handleIframeMessage(
    event
  ) {

    if (
      event.source !==
      appFrame.contentWindow
    ) {

      return;

    }


    const data =
      event.data || {};


    /* ------------------------------------------------------
     * SESSION
     * ------------------------------------------------------ */

    if (
      data.type ===
      "SYNC_USER_SESSION"
    ) {

      session.user_id =
        data.user_id ??
        data.userId ??
        data.user?.id ??
        null;


      session.role =
        data.role ??
        data.user?.role ??
        null;


      console.log(
        "[PAG] Session synced:",
        session.user_id,
        session.role
      );


      /*
       * Update subscription dengan
       * user_id dan role terbaru.
       */

      try {

        const subscription =
          await swRegistration
            ?.pushManager
            ?.getSubscription();


        if (subscription) {

          await saveSubscription(
            subscription
          );

        }

      } catch (error) {

        console.warn(
          "[PAG] Update session subscription:",
          error
        );

      }

    }


    /* ------------------------------------------------------
     * BADGE
     * ------------------------------------------------------ */

    if (
      data.type ===
      "SET_APP_BADGE"
    ) {

      await setBadge(
        data.count
      );

    }


    if (
      data.type ===
      "CLEAR_APP_BADGE"
    ) {

      await setBadge(
        0
      );

    }

  }


  /* ========================================================
   * BOOT
   * ======================================================== */

  async function boot() {

    allowButton.addEventListener(
      "click",
      requestNotificationPermission
    );


    window.addEventListener(
      "message",
      handleIframeMessage
    );


    /* ------------------------------------------------------
     * BASIC SUPPORT
     * ------------------------------------------------------ */

    if (
      !window.isSecureContext
    ) {

      showLock(

        "Koneksi Tidak Aman",

        "Web Push PAG Docs membutuhkan HTTPS.",

        "Tutup"

      );


      allowButton.disabled =
        true;


      return;

    }


    if (
      !("Notification" in window) ||
      !("serviceWorker" in navigator) ||
      !("PushManager" in window)
    ) {

      showLock(

        "Browser Tidak Mendukung",

        "Gunakan browser yang mendukung Web Push dan Service Worker.",

        "Tutup"

      );


      allowButton.disabled =
        true;


      return;

    }


    /* ------------------------------------------------------
     * PERMISSION SUDAH GRANTED
     *
     * TIDAK ADA LOCK LAGI.
     *
     * TIDAK ADA POLLING.
     *
     * TIDAK ADA VISIBILITYCHANGE.
     * ------------------------------------------------------ */

    if (
      Notification.permission ===
      "granted"
    ) {

      try {

        await initializePush();

      } catch (error) {

        console.error(
          "[PAG] Boot:",
          error
        );


        showError(
          error?.message ||
          String(error)
        );


        showLock(

          "Push Belum Siap",

          "PAG Docs belum dapat menyimpan subscription notifikasi. Periksa koneksi internet lalu coba lagi.",

          "Coba Lagi"

        );

      }


      return;

    }


    /* ------------------------------------------------------
     * BLOCKED
     * ------------------------------------------------------ */

    if (
      Notification.permission ===
      "denied"
    ) {

      showLock(

        "Notifikasi Diblokir",

        "PAG Docs dikunci karena notifikasi browser diblokir. Aktifkan izin notifikasi untuk situs ini melalui pengaturan browser.",

        "Coba Lagi"

      );


      return;

    }


    /* ------------------------------------------------------
     * DEFAULT
     * ------------------------------------------------------ */

    showLock(

      "Izin Notifikasi Diperlukan",

      "PAG Docs menggunakan notifikasi browser sebagai satu-satunya sistem pemberitahuan. Izinkan notifikasi untuk membuka aplikasi.",

      "Aktifkan Notifikasi"

    );

  }


  /* ========================================================
   * START
   * ======================================================== */

  boot();

})();

</script>


</body>
</html>
