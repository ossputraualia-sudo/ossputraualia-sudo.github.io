<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PT. Putra Aulia Group</title>
  
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PT.PA">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #appFrame {
      width: 100%; height: 100%; border: none; display: block; background: #f8fafc;
      position: absolute; inset: 0; z-index: 1;
    }

    /* PENGUNCI KEAMANAN SISTEM (SKENARIO A) */
    #lockScreenOverlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 99999999;
      padding: 24px; overflow-y: auto;
    }

    .lock-card {
      background: #ffffff;
      border-radius: 28px; padding: 36px 28px; max-width: 460px; width: 100%;
      text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .badge-icon {
      width: 64px; height: 64px; border-radius: 20px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 32px; margin-bottom: 18px;
    }
    .badge-icon.blocked { background: #fee2e2; color: #ef4444; border: 2px solid #fca5a5; }
    .badge-icon.prompt { background: #ccfbf1; color: #0f766e; border: 2px solid #99f6e4; }

    .lock-title { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 8px; line-height: 1.3; }
    .lock-desc { font-size: 13.5px; color: #475569; line-height: 1.5; margin-bottom: 24px; }

    .unblock-guide {
      background: #f8fafc; border: 1.5px dashed #cbd5e1;
      border-radius: 18px; padding: 18px; text-align: left; margin-bottom: 24px;
    }

    .guide-step {
      display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px;
      font-size: 13px; color: #334155; line-height: 1.4;
    }
    .guide-step:last-child { margin-bottom: 0; }

    .step-num {
      width: 22px; height: 22px; border-radius: 50%; background: #0f766e; color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; flex-shrink: 0; margin-top: 2px;
    }

    .btn-main {
      width: 100%; padding: 15px; border-radius: 14px; font-size: 14px; font-weight: 800;
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 8px; transition: transform 0.1s ease, background 0.2s ease;
    }
    .btn-main:active { transform: scale(0.98); }
    .btn-teal { background: #0f766e; color: #ffffff; }
    .btn-teal:hover { background: #0d9488; }
    .btn-blue { background: #2563eb; color: #ffffff; }
    .btn-blue:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <!-- PENGUNCI KEAMANAN SISTEM (SKENARIO A) -->
  <div id="lockScreenOverlay">
    <div class="lock-card" id="lockCard"></div>
  </div>

  <!-- Jendela Aplikasi Utama -->
  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec" 
    allow="clipboard-read; clipboard-write; geolocation; camera; microphone;"
  ></iframe>

  <script>
    var APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec";
    
    // ⚡ KUNCI RESMI
    var VAPID_PUBLIC_KEY = "BFmbNUOxV304wqekMka5EzEwv7sAapDLaPzlDBN2M-fcbSX9osQvksqcMyBzYYXkls3Cz3o06ZIDz7xsvnzpl-Q".trim();
    var SB_URL = "https://qywqxcvnlehmiqrkpwdd.supabase.co";
    var SB_KEY = "sb_publishable_Trk4jYTk3nI93sFtmWO6Tg_-ps4vYLq";

    var overlay = document.getElementById('lockScreenOverlay');
    var lockCard = document.getElementById('lockCard');
    var frame = document.getElementById('appFrame');
    var _isRegistering = false;

    function urlBase64ToUint8Array(base64String) {
      var padding = '='.repeat((4 - base64String.length % 4) % 4);
      var base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      var rawData = window.atob(base64);
      var outputArray = new Uint8Array(rawData.length);
      for (var i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    function periksaIzinDanKunciSistem() {
      if (!('Notification' in window)) {
        bukaAplikasi();
        return;
      }

      var status = Notification.permission;

      if (status === 'granted') {
        bukaAplikasi();
        sembuhkanDanDaftarkanToken();
        return;
      }

      overlay.style.display = 'flex';

      if (status === 'denied') {
        lockCard.innerHTML = 
          '<div class="badge-icon blocked">⛔</div>' +
          '<h2 class="lock-title">AKSES SISTEM DIBEKUKAN</h2>' +
          '<p class="lock-desc">Aplikasi mendeteksi <b>Notifikasi Latar Belakang DIBLOKIR</b> pada perangkat ini. Anda <b>WAJIB</b> membuka izin notifikasi untuk menggunakan sistem ini.</p>' +
          
          '<div class="unblock-guide">' +
            '<div style="font-weight:800; font-size:12.5px; color:#0f766e; margin-bottom:12px; text-transform:uppercase;">👉 Cara Membuka Blokir:</div>' +
            '<div class="guide-step">' +
              '<span class="step-num">1</span>' +
              '<span>Klik ikon <b>Gembok / Setelan 🔒</b> di sebelah kiri URL web ini (pada address bar atas).</span>' +
            '</div>' +
            '<div class="guide-step">' +
              '<span class="step-num">2</span>' +
              '<span>Ubah <b>Notifikasi (Notifications)</b> dari <i>Blokir</i> menjadi <b>Izinkan (Allow)</b>.</span>' +
            '</div>' +
          '</div>' +

          '<button type="button" class="btn-main btn-blue" onclick="window.location.reload()">' +
            '🔄 Saya Sudah Mengizinkan (Buka Akses)' +
          '</button>';
      } else {
        lockCard.innerHTML = 
          '<div class="badge-icon prompt">🔔</div>' +
          '<h2 class="lock-title">AKTIFKAN NOTIFIKASI KANTOR</h2>' +
          '<p class="lock-desc">Diperlukan izin notifikasi agar info tender dan dokumen kadaluarsa tetap melompat ke layar saat Anda membuka <b>Microsoft Excel / HP di kantong</b>.</p>' +
          
          '<button type="button" class="btn-main btn-teal" onclick="mintaIzinSekarang()">' +
            '🔔 Izinkan & Masuk ke Sistem' +
          '</button>';
      }
    }

    async function mintaIzinSekarang() {
      var perm = await Notification.requestPermission();
      if (perm === 'granted') {
        bukaAplikasi();
        sembuhkanDanDaftarkanToken(null, null, true); // true = pemicu klik manual
      } else {
        periksaIzinDanKunciSistem();
      }
    }

    function bukaAplikasi() {
      overlay.style.display = 'none';
    }

    if ('permissions' in navigator) {
      navigator.permissions.query({ name: 'notifications' }).then(function(p) {
        p.onchange = function() {
          periksaIzinDanKunciSistem();
        };
      }).catch(function() {});
    }

    /* =========================================================
     * ⚡ DAFTARKAN PERANGKAT (MULTI-DEVICE ANTI-SALING HAPUS)
     * ========================================================= */
    async function sembuhkanDanDaftarkanToken(targetRole, targetUserId, isManualClick) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      if (Notification.permission !== 'granted') return;
      if (_isRegistering) return;
      _isRegistering = true;

      try {
        var reg = await navigator.serviceWorker.ready;
        var sub = await reg.pushManager.getSubscription();

        if (sub) {
          try { await sub.unsubscribe(); } catch(e) {}
        }

        // Minta token baru dari Google FCM
        var subscribeOptions = { userVisibleOnly: true };
        try {
          subscribeOptions.applicationServerKey = VAPID_PUBLIC_KEY;
          sub = await reg.pushManager.subscribe(subscribeOptions);
        } catch (eStr) {
          subscribeOptions.applicationServerKey = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
          sub = await reg.pushManager.subscribe(subscribeOptions);
        }

        var subJson = sub.toJSON();
        var currentRole = (targetRole || localStorage.getItem('PAG_USER_ROLE') || 'superuser').toLowerCase().trim();

        // ⚡ DETEKSI NAMA PERANGKAT (AGAR TERLIHAT JELAS DI SUPABASE)
        var isAndroid = /Android/i.test(navigator.userAgent);
        var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        var labelPerangkat = isAndroid ? "HP Android" : (isIOS ? "iPhone iOS" : "Laptop / PC Windows");

        var payload = {
          role: currentRole,
          user_id: labelPerangkat, // ⚡ NAMA PERANGKAT TERTULIS DI SINI!
          endpoint: subJson.endpoint,
          keys_p256dh: subJson.keys.p256dh,
          keys_auth: subJson.keys.auth,
          updated_at: new Date().toISOString()
        };

        // ⚡ HAPUS HANYA PERANGKAT INI SAJA (BERDASARKAN ENDPOINT), BUKAN MENGHAPUS SEMUA!
        if (subJson && subJson.endpoint) {
          await fetch(SB_URL + '/rest/v1/web_push_subscriptions?endpoint=eq.' + encodeURIComponent(subJson.endpoint), {
            method: 'DELETE',
            headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
          });
        }

        // SIMPAN DATA PERANGKAT INI
        await fetch(SB_URL + '/rest/v1/web_push_subscriptions', {
          method: 'POST',
          headers: {
            'apikey': SB_KEY,
            'Authorization': 'Bearer ' + SB_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        console.log("✅ Terdaftar di Supabase:", labelPerangkat);

        // Jika staf mengklik dari HP, beri tahu pop-up sukses
        if (isManualClick || isAndroid) {
          alert("✅ Berhasil! " + labelPerangkat + " Anda resmi terdaftar untuk menerima notifikasi.");
        }

      } catch (err) {
        console.error('Pendaftaran Gagal:', err);
      } finally {
        _isRegistering = false;
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').then(function() {
          periksaIzinDanKunciSistem();
        });
      });
    }

    window.addEventListener('message', function(event) {
      if (!event.data) return;
      var data = event.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch(e) { return; }
      }

      if (data.type === 'SYNC_USER_SESSION' && data.role) {
        localStorage.setItem('PAG_USER_ROLE', data.role);
        sembuhkanDanDaftarkanToken(data.role);
      }
    });

    window.addEventListener('hashchange', function() {
      var hash = window.location.hash || '';
      if (frame && hash) {
        try { frame.contentWindow.location.hash = hash; } catch (e) { frame.src = APPS_SCRIPT_EXEC_URL + hash; }
      }
    });

    periksaIzinDanKunciSistem();
  </script>
</body>
</html>
