/****************---------------------------------------------

var Core = (function () {
  var S = { 
    sessionToken: null,
    user: null, 
    permissions: null, 
    settings: {}, 
    master: { skk: [], jenjang: [], jenis_laporan: [] }, 
    menu: 'dashboard', 
    filterAwal: null 
  };
  var _booting = false, _eventsReady = false, _initialized = false;
  var TABLES = {}, TABLE_TIMERS = {}, FILES = {};
  var LAST_MENU_KEY = 'PAG_DOCS_LAST_MENU', USER_SESSION_KEY = 'PAG_DOCS_ACTIVE_USER', SESSION_TOKEN_KEY = 'PAG_DOCS_SESSION_TOKEN';

  var _notifTimer = null;
  var _knownNotifIds = {};
  var _firstLoadNotif = true;
  var supabaseRealtimeClient = null;
  var _sharedAudioCtx = null;

  // ⚡ URL APPS SCRIPT ANDA SEBAGAI GARANSI RESMI
  var OFFICIAL_GAS_URL = "https://script.google.com/macros/s/AKfycbzSB9Nxg5tvWPI3Jrfrow9Mxs3ebSV31eoQ6TJW7o43oFx7m5MdK5WqVKbMDoig8hCVrA/exec";

  function cacheGet(key) {
    try {
      var val = localStorage.getItem('PAG_CACHE_' + key);
      return val ? JSON.parse(val) : null;
    } catch(e) { return null; }
  }

  function cacheSet(key, val) {
    try {
      localStorage.setItem('PAG_CACHE_' + key, JSON.stringify(val));
    } catch(e) {}
  }

  function getSbConfig_() {
    if (window._SUPABASE_CONFIG_ && window._SUPABASE_CONFIG_.url && window._SUPABASE_CONFIG_.key) {
      return window._SUPABASE_CONFIG_;
    }
    return {
      url: 'https://qywqxcvnlehmiqrkpwdd.supabase.co',
      key: 'sb_publishable_Trk4jYTk3nI93sFtmWO6Tg_-ps4vYLq'
    };
  }

  function sbDirect(endpoint, method, payload, onOk, opt) {
    opt = opt || {};
    var cfg = getSbConfig_();
    var url = cfg.url + '/rest/v1/' + endpoint;
    var httpMethod = method || 'GET';

    var options = {
      method: httpMethod,
      headers: {
        'apikey': cfg.key,
        'Authorization': 'Bearer ' + cfg.key,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      }
    };

    if (payload && (httpMethod === 'POST' || httpMethod === 'PATCH' || httpMethod === 'PUT')) {
      options.body = JSON.stringify(payload);
    }

    fetch(url, options)
      .then(function (res) {
        if (!res.ok) {
          return res.text().then(function (errText) {
            throw new Error(errText || ('HTTP ' + res.status));
          });
        }
        var contentType = res.headers.get('content-type');
        if (contentType && contentType.indexOf('application/json') !== -1) {
          return res.json();
        }
        return res.text();
      })
      .then(function (data) {
        if (opt.sukses) toast(opt.sukses, 'ok');
        if (typeof onOk === 'function') onOk(data);
      })
      .catch(function (err) {
        if (typeof opt.gagal === 'function') {
          opt.gagal(err);
        } else {
          var msg = (err && err.message) ? err.message : 'Kesalahan komunikasi Supabase.';
          toast('❌ ' + msg, 'err');
        }
      });
  }

  function playNotifChime_() {
    try {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      
      if (!_sharedAudioCtx) {
        _sharedAudioCtx = new AudioContextClass();
      }
      if (_sharedAudioCtx.state === 'suspended') {
        _sharedAudioCtx.resume();
      }

      var osc = _sharedAudioCtx.createOscillator();
      var gain = _sharedAudioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, _sharedAudioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, _sharedAudioCtx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.2, _sharedAudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, _sharedAudioCtx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(_sharedAudioCtx.destination);
      osc.start();
      osc.stop(_sharedAudioCtx.currentTime + 0.35);
    } catch (eSound) {}
  }

  function tampilkanNotifikasiOS(judul, pesan, targetUrl) {
    playNotifChime_();
    try {
      var targetInduk = window.top || window.parent;
      if (targetInduk && targetInduk !== window) {
        targetInduk.postMessage({
          type: 'SHOW_OS_NOTIFICATION',
          judul: judul || 'PT. Putra Aulia - Pemberitahuan',
          pesan: pesan || '',
          url: targetUrl || '#'
        }, '*');
      }
    } catch (eBridge) {}
  }

  function initUniversalRealtimeSync() {
    var cfg = getSbConfig_();
    if (typeof supabase === 'undefined') return;
    if (supabaseRealtimeClient) return;

    try {
      supabaseRealtimeClient = supabase.createClient(cfg.url, cfg.key);
      var globalChannel = supabaseRealtimeClient.channel('global-db-changes');

      globalChannel.on(
        'postgres_changes',
        { event: '*', schema: 'public' },
        function(payload) {
          var activeMenu = S.menu || 'dashboard';
          var isPerusahaanActive = (activeMenu === 'perusahaan' || activeMenu === 'portofolio');
          var isTenderActive = (activeMenu === 'tender' || activeMenu === 'dokumenpq');
          var isRadarActive = (activeMenu === 'radartender');
          var isPaketActive = (activeMenu === 'paket');
          var isPersonilActive = (activeMenu === 'personil');
          var isBankRefActive = (activeMenu === 'bankref');

          if (payload.table === 'notifikasi_tender') {
            if (isRadarActive && typeof RadarTender !== 'undefined' && typeof RadarTender.muatData === 'function') {
              RadarTender.muatData();
            }
          } else if (payload.table === 'perusahaan' || payload.table === 'perusahaan_dokumen') {
            if (isPerusahaanActive && typeof Perusahaan !== 'undefined' && typeof Perusahaan.render === 'function') {
              Perusahaan.render(el('content'));
            }
          } else if (payload.table === 'personil' || payload.table === 'personil_dokumen') {
            if (isPersonilActive && typeof Personil !== 'undefined' && typeof Personil.render === 'function') {
              Personil.render(el('content'));
            }
          } else if (payload.table === 'tender') {
            if (isTenderActive && typeof Tender !== 'undefined' && typeof Tender.render === 'function') {
              Tender.render(el('content'));
            }
          } else if (payload.table === 'paket_berjalan' || payload.table === 'paket_dokumen') {
            if (isPaketActive && typeof Paket !== 'undefined' && typeof Paket.render === 'function') {
              Paket.render(el('content'));
            }
          } else if (payload.table === 'portofolio_sikap') {
            if (activeMenu === 'portofolio' && typeof PortofolioSikap !== 'undefined' && typeof PortofolioSikap.render === 'function') {
              PortofolioSikap.render(el('content'));
            }
          } else if (payload.table.indexOf('bank_referensi') !== -1 || payload.table.indexOf('bank_ref_') !== -1) {
            if (isBankRefActive && typeof BankReferensi !== 'undefined' && typeof BankReferensi.render === 'function') {
              BankReferensi.render(el('content'));
            }
          } else if (payload.table === 'master_surat') {
            if (activeMenu === 'surat' && typeof Surat !== 'undefined' && typeof Surat.render === 'function') {
              Surat.render(el('content'));
            }
          } else if (payload.table === 'notifikasi_internal') {
            if (payload.eventType === 'INSERT' && payload.new) {
              var newNotif = payload.new;
              if (!_knownNotifIds[newNotif.id]) {
                _knownNotifIds[newNotif.id] = true;
                tampilkanNotifikasiOS(newNotif.judul || 'Pemberitahuan Baru', newNotif.pesan || '', newNotif.link || '#');
              }
            }
            cekNotifikasiBaru();
          }

          if (activeMenu === 'dashboard' && typeof Dashboard !== 'undefined' && typeof Dashboard.render === 'function') {
            Dashboard.render(el('content'));
          }
        }
      );

      globalChannel.subscribe();
    } catch (e) {
      console.error('Gagal menginisialisasi Supabase Realtime:', e);
    }
  }

  var MENU = [
    { id: 'dashboard', label: 'Dashboard', render: function (h, f) { if (typeof Dashboard !== 'undefined' && Dashboard && typeof Dashboard.render === 'function') Dashboard.render(h, f); } },
    { id: 'perusahaan', label: 'Data Perusahaan', render: function (h, f) { if (typeof Perusahaan !== 'undefined' && Perusahaan && typeof Perusahaan.render === 'function') Perusahaan.render(h, f); } },
    { 
      id: 'radartender', 
      label: 'Radar SPSE', 
      render: function (h, f) { 
        if (typeof RadarTender !== 'undefined' && RadarTender && typeof RadarTender.render === 'function') {
          RadarTender.render(h, f); 
        } else {
          h.innerHTML = '<div class="card" style="padding:24px; text-align:center;"><h3 style="color:#dc2626;">Modul Radar SPSE Belum Dimuat</h3></div>';
        }
      } 
    },
    { id: 'tender', label: 'Data Tender', render: function (h, f) { if (typeof Tender !== 'undefined' && Tender && typeof Tender.render === 'function') Tender.render(h, f); } },    
    { id: 'personil', label: 'Data Personil', render: function (h, f) { if (typeof Personil !== 'undefined' && Personil && typeof Personil.render === 'function') Personil.render(h, f); } },
    { 
      id: 'kaktanggapan', 
      label: 'AI KAK', 
      render: function (h, f) { 
        if (typeof KakTanggapan !== 'undefined' && KakTanggapan && typeof KakTanggapan.render === 'function') {
          KakTanggapan.render(h, f); 
        } else {
          h.innerHTML = '<div class="card" style="padding:24px; text-align:center;"><h3 style="color:#dc2626;">Modul AI Dokumen Belum Dimuat</h3></div>';
        }
      } 
    },
    { 
      id: 'rab', 
      label: 'Pembuat RAB', 
      render: function (h, f) { 
        if (typeof ModulRab !== 'undefined' && ModulRab && typeof ModulRab.render === 'function') {
          ModulRab.render(h, f); 
        } else {
          h.innerHTML = '<div class="card" style="padding:24px; text-align:center;"><h3 style="color:#dc2626;">Modul RAB Belum Dimuat</h3></div>';
        }
      } 
    },
    { id: 'paket', label: 'Data Paket Berjalan', render: function (h, f) { if (typeof Paket !== 'undefined' && Paket && typeof Paket.render === 'function') Paket.render(h, f); } },
    { id: 'pantaupersonil', label: 'Pantau Personil', render: function (h, f) { if (typeof PantauPersonil !== 'undefined' && PantauPersonil && typeof PantauPersonil.render === 'function') PantauPersonil.render(h, f); } },
    { id: 'surat', label: 'Master Surat', render: function (h, f) { if (typeof Surat !== 'undefined' && Surat && typeof Surat.render === 'function') Surat.render(h, f); } },
    { 
      id: 'bankref', 
      label: 'Bank Referensi', 
      render: function (h, f) { 
        if (typeof BankReferensi !== 'undefined' && BankReferensi && typeof BankReferensi.render === 'function') {
          BankReferensi.render(h, f); 
        } else {
          h.innerHTML = '<div class="card" style="padding:24px; text-align:center;"><h3 style="color:#dc2626;">Modul Bank Referensi Belum Dimuat</h3></div>';
        }
      } 
    },
    { id: 'pengaturan', label: '⚙ Pengaturan', render: function (h, f) { if (typeof Pengaturan !== 'undefined' && Pengaturan && typeof Pengaturan.render === 'function') Pengaturan.render(h, f); } }
  ];

  function el(id) { return document.getElementById(id); }
  function safeString(v) { return String(v === null || v === undefined ? '' : v); }
  function safeArray(v) { return Array.isArray(v) ? v : []; }
  function safeObject(v) { return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; }
  function esc(s) { return safeString(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

  function getEffectiveRole() { return (S.user && S.user.role) ? String(S.user.role).toLowerCase().trim() : 'guest'; }
  function isSuperuser() { var r = getEffectiveRole(); return r === 'superuser' || r === 'admin'; }
  function isTeknik() { var r = getEffectiveRole(); return isSuperuser() || r === 'user teknik' || r === 'teknik'; }
  function isTender() { var r = getEffectiveRole(); return r === 'user tender' || r === 'tender'; }
  function isBiasa() { var r = getEffectiveRole(); return r === 'user biasa' || r === 'biasa'; }

  function canInput() { 
    if (S.permissions && typeof S.permissions.canInput === 'boolean') return S.permissions.canInput;
    return isSuperuser() || isTeknik() || isTender(); 
  }
  function canDeleteDirect() { 
    if (S.permissions && typeof S.permissions.canDeleteDirect === 'boolean') return S.permissions.canDeleteDirect;
    return isSuperuser() || isTeknik(); 
  }
  function canRequestDelete() { 
    if (S.permissions && typeof S.permissions.canRequestDelete === 'boolean') return S.permissions.canRequestDelete;
    return isTender(); 
  }
  function canDownload() { 
    if (S.permissions && typeof S.permissions.canDownload === 'boolean') return S.permissions.canDownload;
    return isSuperuser() || isTeknik(); 
  }

  function isMenuAllowed(id) {
    if (!id) return false;
    if (id === 'dashboard' || id === 'radartender') return true;
    
    var keyMap = {
      'perusahaan': 'perusahaan', 'portofolio': 'portofolio', 'radartender': 'tender',
      'personil': 'personil', 'tender': 'tender', 'dokumenpq': 'dokumenpq',
      'paket': 'paket', 'pantaupersonil': 'pantaupersonil', 'surat': 'surat',
      'kaktanggapan': 'kaktanggapan', 'rab': 'rab', 'bankref': 'bankref', 'pengaturan': 'pengaturan'
    };

    var menuKey = keyMap[id] || id;
    if (S.permissions && S.permissions.menus) {
      if (typeof S.permissions.menus[menuKey] !== 'undefined') {
        return !!S.permissions.menus[menuKey];
      }
    }

    var r = getEffectiveRole();
    return (r === 'superuser' || r === 'admin');
  }

  function saveLastMenu(id) {
    if (!id || !isMenuAllowed(id)) return;
    try { localStorage.setItem(LAST_MENU_KEY, id); } catch (e) {}
    S.menu = id;
  }

  function getLastMenu() {
    try {
      var params = new URLSearchParams(window.location.search);
      var qPage = params.get('page') || params.get('p') || params.get('tab');
      if (qPage && isMenuAllowed(qPage)) return qPage;
    } catch (eParams) {}

    try { 
      var hash = safeString(window.location.hash).replace(/^#/, '').trim(); 
      if (hash && isMenuAllowed(hash)) return hash; 
    } catch (eHash) {}

    try { 
      var stored = localStorage.getItem(LAST_MENU_KEY); 
      if (stored && isMenuAllowed(stored)) return stored; 
    } catch (eStore) {}

    return 'dashboard';
  }

  function init() {
    setupEvents();
    if (_initialized || _booting) return;
    _initialized = true;
    _booting = true;

    var boot = safeObject(window._INITIAL_BOOT_);
    if (boot.settings) S.settings = safeObject(boot.settings);
    if (boot.master) {
      var m = safeObject(boot.master);
      S.master = { skk: safeArray(m.skk), jenjang: safeArray(m.jenjang), jenis_laporan: safeArray(m.jenis_laporan) };
    }
    applyTheme();

    var savedToken = null;
    try { savedToken = localStorage.getItem(SESSION_TOKEN_KEY); } catch (e) {}

    var localCachedUser = null;
    try {
      var rawUser = localStorage.getItem(USER_SESSION_KEY);
      if (rawUser) localCachedUser = JSON.parse(rawUser);
    } catch (eUser) {}

    if (savedToken && localCachedUser && (localCachedUser.id || localCachedUser.email)) {
      _booting = false;
      S.sessionToken = savedToken;
      S.user = localCachedUser;
      if (typeof window.applySecurityAndRole === 'function') window.applySecurityAndRole(S.user);
      showApp();
      var last = getLastMenu();
      saveLastMenu(last);
      go(last);
      startRealtimeNotif();

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function (res) {
          if (res && res.ok && res.user) {
            S.user = res.user;
            S.permissions = res.permissions || null;
            try { localStorage.setItem(USER_SESSION_KEY, JSON.stringify(res.user)); } catch (e) {}
          } else {
            logout(true);
          }
        }).validateSession(savedToken);
      }
      return;
    }

    if (!savedToken) {
      _booting = false;
      S.user = null;
      S.sessionToken = null;
      showLogin();
      return;
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function (res) {
        _booting = false;
        if (res && res.ok && res.user) {
          S.sessionToken = savedToken;
          S.user = res.user;
          S.permissions = res.permissions || null;
          try { localStorage.setItem(USER_SESSION_KEY, JSON.stringify(res.user)); } catch (e) {}

          if (typeof window.applySecurityAndRole === 'function') {
            window.applySecurityAndRole(S.user);
          }

          showApp();
          var lastMenu = getLastMenu();
          saveLastMenu(lastMenu);
          go(lastMenu);
          startRealtimeNotif();
        } else {
          logout(true);
        }
      }).withFailureHandler(function () {
        _booting = false;
        showLogin();
      }).validateSession(savedToken);
      return;
    }

    _booting = false;
    showLogin();
  }

  function applyBootData(b) {
    b = safeObject(b);
    S.settings = safeObject(b.settings);
    var master = safeObject(b.master);
    S.master = { skk: safeArray(master.skk), jenjang: safeArray(master.jenjang), jenis_laporan: safeArray(master.jenis_laporan) };
    applyTheme();

    var savedToken = null;
    try { savedToken = localStorage.getItem(SESSION_TOKEN_KEY); } catch (e) {}

    if (savedToken && typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function (res) {
        if (res && res.ok && res.user) {
          S.sessionToken = savedToken;
          S.user = res.user;
          S.permissions = res.permissions || null;
          try { localStorage.setItem(USER_SESSION_KEY, JSON.stringify(res.user)); } catch (e) {}
          if (typeof window.applySecurityAndRole === 'function') window.applySecurityAndRole(S.user);
          showApp();
          var last = getLastMenu();
          saveLastMenu(last);
          go(last);
          startRealtimeNotif();
        } else {
          logout(true);
        }
      }).withFailureHandler(function () {
        showLogin();
      }).validateSession(savedToken);
    } else {
      S.user = null;
      S.sessionToken = null;
      showLogin();
    }
  }

  function setSessionUser(userData, sessionToken) {
    S.user = userData;
    if (sessionToken) {
      S.sessionToken = sessionToken;
      try { localStorage.setItem(SESSION_TOKEN_KEY, sessionToken); } catch (e) {}
    }
    try {
      localStorage.setItem(USER_SESSION_KEY, JSON.stringify(userData));
      var d = new Date();
      d.setTime(d.getTime() + (7*24*60*60*1000));
      document.cookie = USER_SESSION_KEY + "=" + encodeURIComponent(JSON.stringify(userData)) + ";expires=" + d.toUTCString() + ";path=/";
    } catch (e) {}
    startRealtimeNotif();
  }

  function showApp() {
    var login = el('loginPage'), app = el('appPage');
    if (login) { login.classList.add('hidden'); login.style.setProperty('display', 'none', 'important'); }
    if (app) { app.classList.remove('hidden'); app.style.setProperty('display', 'flex', 'important'); }
    renderAppHeader(); 
    buildMenu(); 
    startRealtimeNotif();
    setTimeout(initUniversalRealtimeSync, 400);
  }

  function showLogin() {
    var login = el('loginPage'), app = el('appPage');
    if (app) { app.classList.add('hidden'); app.style.setProperty('display', 'none', 'important'); }
    if (login) { login.classList.remove('hidden'); login.style.setProperty('display', 'block', 'important'); }
    var wm = el('watermarkLayer'); if (wm) wm.style.display = 'none';
    document.body.classList.remove('protected-mode');
    if (_notifTimer) clearInterval(_notifTimer);
  }

  function renderAppHeader() {
    var userLabel = el('userLabel');
    if (userLabel && S.user) userLabel.textContent = (S.user.nama || S.user.username);
  }

  function logout(silent) {
    var tokenToDelete = S.sessionToken || null;
    if (!tokenToDelete) {
      try { tokenToDelete = localStorage.getItem(SESSION_TOKEN_KEY); } catch (e) {}
    }

    S.user = null;
    S.sessionToken = null;
    S.permissions = null;
    if (_notifTimer) clearInterval(_notifTimer);

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      try {
        google.script.run.logoutSession(tokenToDelete);
      } catch (eLogout) {}
    }

    try {
      localStorage.removeItem(SESSION_TOKEN_KEY);
      localStorage.removeItem(USER_SESSION_KEY);
      localStorage.removeItem(LAST_MENU_KEY);
      localStorage.removeItem('PAG_CACHE_DASHBOARD_DATA');
      localStorage.removeItem('PAG_CACHE_PERSONIL_INIT_DATA');
      document.cookie = USER_SESSION_KEY + "=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;";
    } catch (e) {}

    showLogin();
    if (!silent) toast('Anda telah keluar dari sistem.', 'inf');
  }

  function cekNotifikasiBaru() {
    if (!S.user) return;

    sbDirect('notifikasi_internal?select=id,judul,pesan,link,dibaca&order=created_at.desc&limit=50', 'GET', null, function (data) {
      data = Array.isArray(data) ? data : [];

      data.forEach(function (n) {

        if (isBelum) {

          unreadCount++;

        }

      if (badge) {

  function getBaseExecUrl() {
    // 1. Cek parameter pwa_host yang dikirim dari PWA GitHub
    try {
      var params = new URLSearchParams(window.location.search);
      var pwaHost = params.get('pwa_host');
      if (pwaHost) {
        sessionStorage.setItem('PAG_PWA_HOST', pwaHost);
        return pwaHost;
      }
      var cachedHost = sessionStorage.getItem('PAG_PWA_HOST');
      if (cachedHost) return cachedHost;
    } catch(eParam) {}

    // 2. Deteksi dari document.referrer jika dibuka di dalam wrapper PWA GitHub
    try {
      if (document.referrer && document.referrer.indexOf('http') === 0) {
        var ref = document.referrer.split('?')[0].split('#')[0];
        if (ref.indexOf('google.com') === -1 && ref.indexOf('googleusercontent.com') === -1) {
          return ref;
        }
      }
    } catch(eRef) {}

    // 3. JIKA SEDANG DI DALAM IFRAME PWA (tanpa pwa_host):
    // Jangan gunakan script.google.com sebagai href agar PWA tidak menganggapnya domain luar!
    if (window.self !== window.top) {
      return ''; 
    }

    // 4. Fallback jika dibuka langsung di browser Apps Script
    if (window._WEB_APP_URL_) {
      return window._WEB_APP_URL_;
    }

    return '';
  }

  function handleMenuClick(e, pageId) {
    // Jika user sengaja menekan Ctrl, Cmd, Shift, atau Middle-click pada Laptop/PC:
    // Biarkan browser membuka tab baru
    if (e && (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1)) {
      return true;
    }

    // PENTING: Pada klik kiri normal / layar sentuh HP PWA:
    // WAJIB batalkan event default agar PWA TIDAK melempar ke browser Chrome!
    if (e && e.preventDefault) e.preventDefault();
    if (e && e.stopPropagation) e.stopPropagation();

    go(pageId);
    closeMenu();
    return false;
  }

        dropWrapTender.appendChild(subDivTender);
        frag.appendChild(dropWrapTender);

      } else {
        var aDefault = document.createElement('a');
        var targetLink = baseUrl ? (baseUrl + '?page=' + encodeURIComponent(m.id)) : ('#' + m.id);
        aDefault.href = targetLink;
        aDefault.id = 'nav-' + m.id;
        aDefault.target = '_self'; // ⚡ Netralisir <base target="_top">
        aDefault.className = 'nav-link' + (m.id === S.menu ? ' active' : '');
        aDefault.textContent = m.label;
        aDefault.onclick = (function(menuId) {
          return function(e) {
            return handleMenuClick(e, menuId);
          };
        })(m.id);
        frag.appendChild(aDefault);
      }
    });

    nav.innerHTML = ''; nav.appendChild(frag);
  }

  /* =========================================================
   * GO / ROUTING
   * ========================================================= */
  function go(id, filterAwal) {
    if (!isMenuAllowed(id)) id = 'dashboard';
    var m = null;
    
    if (id === 'portofolio') {
      m = { 
        id: 'portofolio', 
        label: 'Data Pengalaman', 
        render: function(h, f) { 
          if (typeof PortofolioSikap !== 'undefined' && PortofolioSikap && typeof PortofolioSikap.render === 'function') {
            PortofolioSikap.render(h, f);
          } else {
            h.innerHTML = '<div class="card" style="padding:24px; text-align:center; color:#dc2626;"><h4>Modul Data Pengalaman belum dimuat</h4></div>';
          }
        } 
      };
    } else if (id === 'dokumenpq') {
      m = { 
        id: 'dokumenpq', 
        label: 'Dokumen PQ', 
        render: function(h, f) { 
          if (typeof DokumenPQ !== 'undefined' && DokumenPQ && typeof DokumenPQ.render === 'function') {
            DokumenPQ.render(h, f);
          } else {
            h.innerHTML = '<div class="card" style="padding:24px; text-align:center; color:#dc2626;"><h4>Modul Dokumen PQ belum dimuat</h4></div>';
          }
        } 
      };
    } else {
      for (var i = 0; i < MENU.length; i++) { if (MENU[i] && MENU[i].id === id) { m = MENU[i]; break; } }
    }

    if (!m) { id = 'dashboard'; m = MENU[0]; }
    S.menu = id; S.filterAwal = filterAwal || null; saveLastMenu(id);

    // ⚡ GANTI BLOK LAMA DENGAN INI:
    // Kirim sinyal ke PWA GitHub di luar iframe agar address bar PWA terupdate secara realtime
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'PAG_SET_URL',
          page: id,
          title: (m.label || id) + ' - PT. Putra Aulia'
        }, '*');
      } else {
        // Jika dibuka langsung di browser tanpa PWA
        var baseUrl = getBaseExecUrl();
        if (baseUrl) {
          var targetFullUrl = baseUrl + '?page=' + encodeURIComponent(id);
          window.history.replaceState({ page: id }, '', targetFullUrl);
        }
      }
    } catch (eMsg) {}

    var mq = el('marquee');
    if (mq && id !== 'dashboard') {
      mq.classList.add('hidden');
    }

    var navPerusahaan = el('nav-perusahaan');
    if (navPerusahaan) {
      if (id === 'portofolio') {
        navPerusahaan.innerHTML = 'Data Pengalaman <span style="font-size:10px; margin-left:2px;">▾</span>';
      } else {
        navPerusahaan.innerHTML = 'Data Perusahaan <span style="font-size:10px; margin-left:2px;">▾</span>';
      }
    }

    var navTender = el('nav-tender');
    if (navTender) {
      if (id === 'dokumenpq') {
        navTender.innerHTML = 'PQ Anggota KSO <span style="font-size:10px; margin-left:2px;">▾</span>';
      } else {
        navTender.innerHTML = 'Data Tender <span style="font-size:10px; margin-left:2px;">▾</span>';
      }
    }

    MENU.forEach(function (x) { 
      if (!x) return; 
      var menuLink = el('nav-' + x.id); 
      if (menuLink) {
        menuLink.classList.toggle('active', x.id === id || (id === 'portofolio' && x.id === 'perusahaan') || (id === 'dokumenpq' && x.id === 'tender')); 
      }
    });

    var host = el('content'); if (!host) return;

    var renderTimer = setTimeout(function() {
      if (host.querySelector('.loader-container')) {
        host.innerHTML = '<div class="card" style="padding:24px; text-align:center;"><h3 style="color:#ef4444; margin-bottom:8px;">⚠️ Waktu Memuat Habis</h3><p style="color:var(--text-muted); font-size:13px; margin-bottom:16px;">Gagal mengambil data dari server.</p><button class="btn sm" onclick="Core.go(\'' + id + '\')">🔄 Muat Ulang Halaman</button></div>';
      }
    }, 8000);

    try { 
      if (m && typeof m.render === 'function') { 
        m.render(host, filterAwal); 
        clearTimeout(renderTimer); 
      } else { 
        clearTimeout(renderTimer); 
        host.innerHTML = '<div class="card" style="padding:20px; text-align:center;">Modul belum ada.</div>'; 
      }
    } catch (err) { 
      clearTimeout(renderTimer); 
      console.error('Render error:', err);
      host.innerHTML = '<div class="card" style="padding:24px; color:#dc2626"><h4>Gagal memuat halaman</h4><p style="font-size:12px;">' + esc(err.message) + '</p></div>'; 
    }

    window.scrollTo(0, 0);
  }

  function setupEvents() {
    if (_eventsReady) return; _eventsReady = true;

    // Popstate listener untuk navigasi tombol Back/Forward browser
    window.addEventListener('popstate', function (e) {
      var targetPage = getLastMenu();
      if (targetPage && isMenuAllowed(targetPage) && targetPage !== S.menu) {
        go(targetPage);
      }
    });

    window.addEventListener('hashchange', function () { 
      var hash = safeString(window.location.hash).replace(/^#/, ''); 
      if (hash && isMenuAllowed(hash)) go(hash); 
    });
    
    document.addEventListener('click', function (e) { 
      var navbar = document.getElementById('navbar');
      var hamburger = document.getElementById('hamburgerBtn') || document.querySelector('.hamburger');
      var subDropPrsh = el('subDropdownPerusahaan');
      var subDropTender = el('subDropdownTender');

      if (subDropPrsh && !e.target.closest('#nav-perusahaan') && !subDropPrsh.contains(e.target)) {
        subDropPrsh.style.display = 'none';
      }
      if (subDropTender && !e.target.closest('#nav-tender') && !subDropTender.contains(e.target)) {
        subDropTender.style.display = 'none';
      }

      if (hamburger && (hamburger === e.target || hamburger.contains(e.target))) {
        return;
      }

      if (navbar && navbar.classList.contains('open')) {
        if (!navbar.contains(e.target)) {
          closeMenu();
        }
      }
    });
    
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  }

  function applyTheme() { 
    var s = safeObject(S.settings); 
    var brandEl = el('appBrand'); 
    if (brandEl) brandEl.textContent = s.nama_perusahaan || 'PT. PUTRA AULIA GROUP'; 
  }

  function toggleTema() { if (document.body) document.body.classList.toggle('dark'); }

  function toast(msg, type) { 
    var host = el('toast'); if (!host) return; 
    var d = document.createElement('div'); d.className = 'toast ' + (type || 'ok'); d.textContent = safeString(msg); host.appendChild(d); 
    setTimeout(function () { if (d && d.parentNode) d.remove(); }, 3500); 
  }

  function modal(title, bodyHtml, footHtml, wide) { 
    var host = el('modalHost'); if (!host) return; 
    var footerString = footHtml ? '<div class="modal-foot">' + footHtml + '</div>' : '';
    host.innerHTML = '<div class="modal" id="modalNow"><div class="modal-box ' + (wide ? 'wide' : '') + '"><div class="modal-head"><h3>' + safeString(title) + '</h3><button class="close-btn-x" onclick="Core.closeModal()">✕</button></div><div class="modal-body">' + (bodyHtml || '') + '</div>' + footerString + '</div></div>'; 
  }
  function closeModal() { var host = el('modalHost'); if (host) host.innerHTML = ''; }

  function preview(fileId, nama) { 
    if (!fileId) { toast('Belum ada file.', 'err'); return; } 
    var id = encodeURIComponent(fileId); 
    var btnDrive = canDownload() ? '<a class="btn" target="_blank" href="https://drive.google.com/file/d/' + id + '/view">Buka di Drive</a>' : ''; 
    
    modal(
      'Preview: ' + esc(nama || ''), 
      '<div style="width:100%; height:75vh; min-height:500px; display:flex; flex-direction:column;"><iframe class="preview" style="width:100%; height:100%; border:none; flex:1;" src="https://drive.google.com/file/d/' + id + '/preview"></iframe></div>', 
      btnDrive, 
      true
    ); 
  }

  function fileField(key, label) { 
    if (!canInput()) return ''; 
    return '<label class="fld"><span>' + esc(label) + '</span><input type="file" id="f_' + esc(key) + '" onchange="Core.bacaFile(\'' + esc(key) + '\')"></label>'; 
  }

  function bacaFile(key) { 
    key = safeString(key); 
    var input = el('f_' + key); 
    if (!input || !input.files || !input.files.length) return; 
    
    var file = input.files[0]; 
    var rd = new FileReader(); 
    
    var btns = document.querySelectorAll('.btn:not(.close-btn-x)');
    btns.forEach(function(b){ b.disabled = true; b.style.opacity = '0.5'; });
    
    rd.onload = function () { 
      var result = safeString(rd.result); 
      FILES[key] = { 
        base64: result.indexOf(',') !== -1 ? result.split(',')[1] : result, 
        mimeType: file.type || 'application/octet-stream', 
        fileName: file.name || 'file' 
      }; 
      btns.forEach(function(b){ b.disabled = false; b.style.opacity = '1'; });
      toast('Berkas siap diunggah', 'ok'); 
    }; 
    rd.readAsDataURL(file); 
  }

  function getFile(key) { return (FILES[safeString(key)] || null); }
  function clearFiles() { FILES = {}; }

  function table(cfg) {
    if (!cfg || !cfg.id) return ''; TABLES[cfg.id] = cfg;
    var filterHtml = (cfg.filters || []).map(function (f) {
      if (!f || !f.key) return ''; 
      var values = uniq((cfg.rows || []).map(function (r) { return r ? r[f.key] : ''; })).sort();
      return '<select id="' + esc(cfg.id) + '_fl_' + esc(f.key) + '" onchange="Core.tableRefresh(\'' + esc(cfg.id) + '\')"><option value="">' + esc(f.label || f.key) + ': Semua</option>' + values.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') + '</select>';
    }).join('');
    var exportBtnHtml = canDownload() ? '<button class="btn warn btn-download" onclick="Core.exportCSV(\'' + esc(cfg.id) + '\')">⬇ Export CSV</button>' : '';
    var addBtnHtml = canInput() ? (cfg.addButton || '') : '';
    return '<div class="card">' + (cfg.judul ? '<h3>' + esc(cfg.judul) + '</h3>' : '') + '<div class="toolbar no-print"><input type="search" id="' + esc(cfg.id) + '_q" placeholder="🔍 Cari…" oninput="Core.tableSearchDebounced(\'' + esc(cfg.id) + '\')">' + filterHtml + (cfg.toolbarExtra || '') + addBtnHtml + '<span class="spacer" style="flex:1"></span><button class="btn sec" onclick="Core.tableReset(\'' + esc(cfg.id) + '\')">Reset</button>' + exportBtnHtml + '<span id="' + esc(cfg.id) + '_cnt" class="chip"></span></div><div class="tbl-wrap" id="' + esc(cfg.id) + '_wrap"></div></div>';
  }

  function uniq(a) { var result = [], seen = {}; safeArray(a).forEach(function (v) { if (v === '' || v === undefined || v === null) return; var key = safeString(v); if (!seen[key]) { seen[key] = true; result.push(v); } }); return result; }
  
  function tableData(id) {
    var cfg = TABLES[id]; if (!cfg) return []; 
    var qEl = el(id + '_q'), q = qEl ? safeString(qEl.value).toLowerCase().trim() : ''; 
    return safeArray(cfg.rows).filter(function (r) { 
      var filters = safeArray(cfg.filters); 
      for (var i = 0; i < filters.length; i++) { 
        var f = filters[i]; if (!f || !f.key) continue; 
        var sel = el(id + '_fl_' + f.key); if (sel && sel.value && safeString(r[f.key]) !== sel.value) return false; 
      } 
      if (q) { 
        var cols = safeArray(cfg.columns), found = false; 
        for (var j = 0; j < cols.length; j++) { var c = cols[j]; if (!c) continue; var value = safeString(r[c.key]).toLowerCase(); if (value.indexOf(q) !== -1) { found = true; break; } } 
        if (!found) return false; 
      } 
      return true; 
    });
  }

  function tableRefresh(id) {
    var cfg = TABLES[id]; if (!cfg) return; 
    var wrap = el(id + '_wrap'); if (!wrap) return; 
    var rows = tableData(id), columns = safeArray(cfg.columns); 
    var html = '<table class="tbl"><thead><tr><th>No</th>' + columns.map(function (c) { return '<th>' + esc(c && c.label ? c.label : '') + '</th>'; }).join('') + (cfg.actions ? '<th>Aksi</th>' : '') + '</tr></thead><tbody>'; 
    if (!rows.length) { html += '<tr><td colspan="' + (columns.length + 1 + (cfg.actions ? 1 : 0)) + '" style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada data.</td></tr>'; } 
    else { 
      for (var i = 0; i < rows.length; i++) { 
        var r = rows[i] || {}; html += '<tr><td>' + (i + 1) + '</td>'; 
        for (var j = 0; j < columns.length; j++) { var c = columns[j] || {}; var value = typeof c.render === 'function' ? c.render(r) : esc(r[c.key]); html += '<td>' + (value || '') + '</td>'; } 
        if (typeof cfg.actions === 'function') { html += '<td>' + (cfg.actions(r) || '') + '</td>'; } 
        html += '</tr>'; 
      } 
    } 
    html += '</tbody></table>'; wrap.innerHTML = html; 
    var counter = el(id + '_cnt'); if (counter) counter.textContent = rows.length + ' data'; 
  }

  function tableSearchDebounced(id) { if (TABLE_TIMERS[id]) clearTimeout(TABLE_TIMERS[id]); TABLE_TIMERS[id] = setTimeout(function () { tableRefresh(id); delete TABLE_TIMERS[id]; }, 200); }
  function tableReset(id) { var cfg = TABLES[id]; if (!cfg) return; var q = el(id + '_q'); if (q) q.value = ''; safeArray(cfg.filters).forEach(function (f) { if (!f || !f.key) return; var s = el(id + '_fl_' + f.key); if (s) s.value = ''; }); tableRefresh(id); }

  function exportCSV(id) { 
    if (!canDownload()) { toast('⚠️ Hak akses Anda dibatasi.', 'err'); return; } 
    var cfg = TABLES[id]; if (!cfg) return; 
    var rows = tableData(id), columns = safeArray(cfg.columns), csv = []; 
    csv.push(columns.map(function (c) { return '"' + safeString(c && c.label ? c.label : '').replace(/"/g, '""') + '"'; }).join(',')); 
    rows.forEach(function (r) { r = r || {}; csv.push(columns.map(function (c) { return '"' + safeString(r[c.key]).replace(/"/g, '""') + '"'; }).join(',')); }); 
    var blob = new Blob(['\ufeff' + csv.join('\n')], { type: 'text/csv;charset=utf-8;' }); var url = URL.createObjectURL(blob); 
    var a = document.createElement('a'); a.href = url; a.download = safeString(cfg.judul || 'export').replace(/\s+/g, '_') + '.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 1000); toast('Export CSV berhasil', 'ok'); 
  }

  function call(fn, args, onOk, opt) { 
    opt = opt || {}; if (!fn || typeof fn !== 'string') return; 
    if (typeof google === 'undefined' || !google.script || !google.script.run) { if (typeof opt.gagal === 'function') opt.gagal({ message: 'Google Script Environment tidak tersedia' }); return; }
    var runner = google.script.run.withSuccessHandler(function (r) { if (opt.sukses) toast(opt.sukses, 'ok'); if (typeof onOk === 'function') onOk(r); }).withFailureHandler(function (e) { var msg = e && e.message ? e.message : 'Kesalahan server.'; toast(msg, 'err'); if (typeof opt.gagal === 'function') opt.gagal(e); }); 
    try { runner[fn].apply(runner, safeArray(args)); } catch (err) { toast(err.message || 'Gagal menjalankan server.', 'err'); if (typeof opt.gagal === 'function') opt.gagal(err); } 
  }

  function sisaHari(tgl) { if (!tgl) return null; var e = new Date(tgl); if (isNaN(e.getTime())) return null; var t = new Date(); t.setHours(0, 0, 0, 0); return Math.ceil((e - t) / 86400000); }
  function badgeSisa(tgl) { var s = sisaHari(tgl); if (s === null) return ''; if (s < 0) return '<span class="badge b-red">Kadaluarsa</span>'; if (s <= 7) return '<span class="badge b-red">' + s + ' hari</span>'; if (s <= 14) return '<span class="badge b-org">' + s + ' hari</span>'; if (s <= 30) return '<span class="badge b-yel">' + s + ' hari</span>'; return '<span class="badge b-grn">' + s + ' hari</span>'; }

  return { 
    state: S, el: el, esc: esc, init: init, applyBootData: applyBootData, setSessionUser: setSessionUser, showApp: showApp, showLogin: showLogin, logout: logout, 
    renderAppHeader: renderAppHeader, buildMenu: buildMenu, renderNavbar: buildMenu, go: go, nav: go, 
    handleMenuClick: handleMenuClick, 
    toggleTema: toggleTema, applyTheme: applyTheme, 
    toggleMenu: toggleMenu, closeMenu: closeMenu,
    toast: toast, modal: modal, closeModal: closeModal, preview: preview, fileField: fileField, bacaFile: bacaFile, getFile: getFile, clearFiles: clearFiles, table: table, tableRefresh: tableRefresh, tableSearchDebounced: tableSearchDebounced, tableReset: tableReset, exportCSV: exportCSV, call: call, sbDirect: sbDirect, cacheGet: cacheGet, cacheSet: cacheSet, badgeSisa: badgeSisa, sisaHari: sisaHari, isSuperuser: isSuperuser, isTeknik: isTeknik, isTender: isTender, isBiasa: isBiasa, canInput: canInput, canDeleteDirect: canDeleteDirect, canRequestDelete: canRequestDelete, canDownload: canDownload, getEffectiveRole: getEffectiveRole, saveLastMenu: saveLastMenu, getLastMenu: getLastMenu, isMenuAllowed: isMenuAllowed, bukaNotifikasi: bukaNotifikasi, formTulisPesanBaru: formTulisPesanBaru, kirimPesanBaru: kirimPesanBaru, formBalasNotif: formBalasNotif, kirimBalasanNotif: kirimBalasanNotif, tandaiDibaca: tandaiDibaca, cekNotifikasiBaru: cekNotifikasiBaru, tampilkanNotifikasiOS: tampilkanNotifikasiOS, setNotifTab: setNotifTab, tandaiSemuaSudahDibaca: tandaiSemuaSudahDibaca, bukaLinkNotif: bukaLinkNotif, getMaster: function () { return S.master; }, getUser: function () { return S.user; }, getSessionToken: function () { return S.sessionToken; }, getRole: getEffectiveRole,
    storage: window.AppStorage 
  };
})();

/* =========================================================
 * FUNGSI PENGATUR RESIZE KIRI-KANAN (DUAL FORM)
 * ========================================================= */
function initResizableSplit(containerId) {
  var container = document.getElementById(containerId);
  if (!container) return;

  var panes = container.querySelectorAll('.split-pane');
  if (panes.length < 2) return;

  var leftPane = panes[0];
  var rightPane = panes[1];

  var resizer = container.querySelector('.split-resizer');
  if (!resizer) {
    resizer = document.createElement('div');
    resizer.className = 'split-resizer';
    container.insertBefore(resizer, rightPane);
  }

  var isResizing = false;

  resizer.addEventListener('mousedown', function (e) {
    isResizing = true;
    resizer.classList.add('active');
    document.body.style.cursor = 'col-resize';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function (e) {
    if (!isResizing) return;
    if (window.innerWidth <= 900) return;

    var containerRect = container.getBoundingClientRect();
    var offsetX = e.clientX - containerRect.left;
    var totalWidth = containerRect.width;

    var percentage = (offsetX / totalWidth) * 100;
    if (percentage < 20) percentage = 20;
    if (percentage > 80) percentage = 80;

    leftPane.style.flex = '0 0 ' + percentage + '%';
    rightPane.style.flex = '0 0 ' + (100 - percentage) + '%';
  });

  document.addEventListener('mouseup', function () {
    if (isResizing) {
      isResizing = false;
      resizer.classList.remove('active');
      document.body.style.cursor = 'default';
    }
  });
}
