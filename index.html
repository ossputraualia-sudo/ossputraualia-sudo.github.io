<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">

  <title>PT. Putra Aulia</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f766e; /* Mencegah layar putih berkedip */
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* ======================================================
     * SPLASH SCREEN ELEGAN (PEMBERANTAS GLITCH)
     * ====================================================== */
    #splashScreen {
      position: fixed;
      inset: 0;
      z-index: 999998;
      background: #0f766e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #splashScreen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splashLogo {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      background: #ffffff;
      color: #0f766e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }

    .splashTitle {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .splashSubtitle {
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 24px;
    }

    .splashSpinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spinSplash 0.8s linear infinite;
    }

    @keyframes spinSplash {
      to { transform: rotate(360deg); }
    }

    /* ======================================================
     * NOTIFICATION LOCK
     * ====================================================== */
    #notificationLock {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: #f4f7f8;
    }

    #notificationLock.hidden {
      display: none !important;
    }

    .lockCard {
      width: min(430px, 100%);
      padding: 30px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .lockLogo {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #0f766e;
      color: white;
      font-size: 23px;
      font-weight: 800;
    }

    .lockCard h1 {
      margin: 0 0 10px;
      font-size: 21px;
      color: #1e293b;
    }

    .lockCard p {
      margin: 8px 0 18px;
      color: #5f6870;
      font-size: 14px;
      line-height: 1.6;
    }

    .lockButton {
      width: 100%;
      padding: 14px 20px;
      border: 0;
      border-radius: 11px;
      background: #0f766e;
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .lockButton:hover {
      background: #115e59;
    }

    .lockButton:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .lockSmall {
      font-size: 12px !important;
      color: #7b858d !important;
      margin-top: 14px;
    }

    #errorBox {
      display: none;
      margin-top: 14px;
      padding: 10px;
      border-radius: 9px;
      background: #fff1f1;
      color: #a33;
      font-size: 12px;
      text-align: left;
      word-break: break-word;
    }

    /* ======================================================
     * APPLICATION IFRAME
     * ====================================================== */
    #appFrame {
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
      background: #ffffff;
    }

    #appFrame.ready {
      opacity: 1;
    }

    @media (max-width: 600px) {
      #notificationLock {
        padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      }
      .lockCard {
        padding: 24px 20px;
        border-radius: 18px;
      }
      .lockLogo {
        width: 64px;
        height: 64px;
        margin-bottom: 15px;
      }
      .lockCard h1 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <!-- 1. SPLASH SCREEN TRANSISI HALUS (ANTI-KEDIP) -->
  <div id="splashScreen">
    <div class="splashLogo">PAG</div>
    <div class="splashTitle">PT. PUTRA AULIA GROUP</div>
    <div class="splashSubtitle">Sistem Manajemen Dokumen & Radar Tender</div>
    <div class="splashSpinner"></div>
  </div>

  <!-- 2. NOTIFICATION LOCK -->
  <div id="notificationLock" class="hidden" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="lockCard">
      <div class="lockLogo">PAG</div>
      <h1 id="lockTitle">Izin Notifikasi Diperlukan</h1>
      <p id="lockText">
        Aplikasi menggunakan notifikasi browser sebagai satu-satunya sistem pemberitahuan real-time.
        Izinkan notifikasi untuk membuka aplikasi.
      </p>
      <button id="allowButton" class="lockButton" type="button">Aktifkan Notifikasi</button>
      <p class="lockSmall">by: Azhar</p>
      <div id="errorBox" role="alert"></div>
    </div>
  </div>

  <!-- 3. MAIN APPLICATION (GOOGLE APPS SCRIPT IFRAME) -->
  <iframe id="appFrame" title="PT. Putra Aulia"></iframe>

</div>

<script>
(() => {
  "use strict";

  const CONFIG = {
    APP_SCRIPT_URL:
      "https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec",
    SB_URL:
      "https://qywqxcvnlehmiqrkpwdd.supabase.co",
    SB_KEY:
      "sb_publishable_Trk4jYTk3nI93sFtmWO6Tg_-ps4vYLq",
    VAPID_PUBLIC_KEY:
      "BJA7AZcYbZ-m23nmGsoICga9u-MhkIOfaL4ZuYTF0lO0PyUQKztgodNHp3EjQxKXTfMq0eO0nIDEyi5SHlKEZPg",
    SW_PATH:
      "./sw.js",
    SW_SCOPE:
      "./",
    DEVICE_STORAGE:
      "PAG_DOCS_PUSH_DEVICE_ID",
    BADGE_STORAGE:
      "PAG_DOCS_UNREAD_COUNT",
    MAX_RETRY: 2,
    NETWORK_TIMEOUT: 12000
  };

  const lock = document.getElementById("notificationLock");
  const lockTitle = document.getElementById("lockTitle");
  const lockText = document.getElementById("lockText");
  const allowButton = document.getElementById("allowButton");
  const errorBox = document.getElementById("errorBox");
  const appFrame = document.getElementById("appFrame");
  const splashScreen = document.getElementById("splashScreen");

  let swRegistration = null;
  let initialized = false;
  let booting = false;
  let session = { user_id: null, role: null };
  const health = {
    secure: false, supported: false, permission: "unknown",
    serviceWorker: false, subscription: false, subscriptionSaved: false,
    standalone: false, lastError: null
  };

  function log(...args) { console.log("[PAG]", ...args); }
  function warn(...args) { console.warn("[PAG]", ...args); }
  function error(...args) { console.error("[PAG]", ...args); }

  function dismissSplash() {
    if (splashScreen) {
      splashScreen.classList.add("fade-out");
      appFrame.classList.add("ready");
    }
  }

  function showError(message) {
    errorBox.textContent = String(message || "");
    errorBox.style.display = "block";
  }

  function clearError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
  }

  function showLock(title, message, buttonText) {
    dismissSplash();
    lockTitle.textContent = title || "Notifikasi Diperlukan";
    lockText.textContent = message || "";
    allowButton.textContent = buttonText || "Aktifkan Notifikasi";
    lock.classList.remove("hidden");
  }

  function hideLock() {
    lock.classList.add("hidden");
  }

  function openApplication() {
    hideLock();

    // Event penangkap selesainya load iframe (mencegah glitch)
    appFrame.onload = () => {
      dismissSplash();
    };

    if (!appFrame.getAttribute("src")) {
      appFrame.src = CONFIG.APP_SCRIPT_URL;
    }

    // Safety timeout: jika dalam 4 detik iframe belum trigger onload, paksa buka splash
    setTimeout(dismissSplash, 4000);
  }

  function lockApplicationInstantly() {
    dismissSplash();
    appFrame.classList.remove("ready");
    showBlockedState();
  }

  function getDeviceId() {
    let id = localStorage.getItem(CONFIG.DEVICE_STORAGE);
    if (!id) {
      if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
        id = crypto.randomUUID();
      } else {
        id = "pag-" + Date.now() + "-" + Math.random().toString(36).slice(2);
      }
      localStorage.setItem(CONFIG.DEVICE_STORAGE, id);
    }
    return id;
  }

  function getDeviceLabel() {
    const ua = navigator.userAgent || "";
    if (/Android/i.test(ua)) return "Android";
    if (/iPhone|iPad|iPod/i.test(ua)) return "iOS";
    if (/Windows/i.test(ua)) return "Windows";
    if (/Macintosh|Mac OS/i.test(ua)) return "macOS";
    if (/Linux/i.test(ua)) return "Linux";
    return "Browser";
  }

  function isStandalonePWA() {
    const standalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
    const iosStandalone = window.navigator.standalone === true;
    return Boolean(standalone || iosStandalone);
  }

  function vapidToUint8Array(base64) {
    const padding = "=".repeat((4 - base64.length % 4) % 4);
    const base64Url = (base64 + padding).replace(/-/g, "+").replace(/_/g, "/");
    const raw = atob(base64Url);
    return Uint8Array.from([...raw].map(char => char.charCodeAt(0)));
  }

  async function fetchWithTimeout(url, options = {}, timeout = CONFIG.NETWORK_TIMEOUT) {
    const controller = new AbortController();
    const timer = setTimeout(() => { controller.abort(); }, timeout);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  async function supabaseFetch(path, options = {}) {
    const response = await fetchWithTimeout(CONFIG.SB_URL + path, {
      ...options,
      headers: {
        apikey: CONFIG.SB_KEY,
        Accept: "application/json",
        ...(options.headers || {})
      }
    });
    const text = await response.text();
    if (!response.ok) throw new Error("Supabase " + response.status + ": " + text);
    if (!text) return null;
    try { return JSON.parse(text); } catch (_) { return text; }
  }

  async function retry(fn, maxRetry = CONFIG.MAX_RETRY) {
    let lastError = null;
    for (let attempt = 0; attempt <= maxRetry; attempt++) {
      try {
        return await fn(attempt);
      } catch (errorValue) {
        lastError = errorValue;
        if (attempt >= maxRetry) break;
        await new Promise(resolve => setTimeout(resolve, 500 * (attempt + 1)));
      }
    }
    throw lastError;
  }

  async function setBadge(count) {
    const n = Math.max(0, Math.min(999, Number(count) || 0));
    localStorage.setItem(CONFIG.BADGE_STORAGE, String(n));

    try {
      if (typeof navigator.setAppBadge === "function") {
        if (n > 0) {
          await navigator.setAppBadge(n);
        } else if (typeof navigator.clearAppBadge === "function") {
          await navigator.clearAppBadge();
        }
      }
    } catch (badgeError) {}

    try {
      const worker = swRegistration?.active;
      if (worker) {
        worker.postMessage({ type: n > 0 ? "SET_APP_BADGE" : "CLEAR_APP_BADGE", count: n });
      }
    } catch (_) {}
  }

  async function getSwVersion() {
    return new Promise(resolve => {
      if (!swRegistration?.active) { resolve("unknown"); return; }
      const channel = new MessageChannel();
      const timer = setTimeout(() => { resolve("unknown"); }, 1500);
      channel.port1.onmessage = event => {
        clearTimeout(timer);
        resolve(event.data?.version || "unknown");
      };
      try {
        swRegistration.active.postMessage({ type: "PAG_SW_PING" }, [channel.port2]);
      } catch (errorValue) {
        clearTimeout(timer);
        resolve("unknown");
      }
    });
  }

  async function cleanupOldDeviceSubscriptions(endpoint) {
    const deviceId = getDeviceId();
    if (!deviceId || !endpoint) return;
    try {
      const query = "/rest/v1/web_push_subscriptions?device_id=eq." +
        encodeURIComponent(deviceId) + "&endpoint=neq." + encodeURIComponent(endpoint);
      await supabaseFetch(query, { method: "DELETE" });
    } catch (errorValue) {}
  }

  async function saveSubscription(subscription) {
    const json = subscription.toJSON();
    const keys = json.keys || {};
    if (!json.endpoint || !keys.p256dh || !keys.auth) return;

    const row = {
      device_id: getDeviceId(),
      user_id: session.user_id || null,
      role: session.role || null,
      endpoint: json.endpoint,
      keys_p256dh: keys.p256dh,
      keys_auth: keys.auth,
      device_label: getDeviceLabel(),
      updated_at: new Date().toISOString()
    };

    await cleanupOldDeviceSubscriptions(json.endpoint);

    await supabaseFetch("/rest/v1/web_push_subscriptions?on_conflict=endpoint", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates,return=minimal"
      },
      body: JSON.stringify(row)
    });

    health.subscriptionSaved = true;
    log("Push subscription tersimpan di Supabase.");
  }

  async function registerServiceWorker() {
    swRegistration = await navigator.serviceWorker.register(CONFIG.SW_PATH, {
      scope: CONFIG.SW_SCOPE,
      updateViaCache: "none"
    });
    swRegistration = await navigator.serviceWorker.ready;
    health.serviceWorker = true;
    log("SW Version:", await getSwVersion());
    return swRegistration;
  }

  async function ensurePushSubscription() {
    if (!swRegistration) throw new Error("Service Worker belum siap.");
    if (Notification.permission !== "granted") throw new Error("Izin notifikasi belum granted.");

    let subscription = await swRegistration.pushManager.getSubscription();
    if (!subscription) {
      subscription = await swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: vapidToUint8Array(CONFIG.VAPID_PUBLIC_KEY)
      });
    }

    health.subscription = true;
    return subscription;
  }

  async function initializePush() {
    if (initialized) return true;
    if (booting) return false;
    booting = true;

    try {
      if (!window.isSecureContext) throw new Error("Aplikasi membutuhkan HTTPS.");
      if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
        throw new Error("Browser tidak mendukung Service Worker / Web Push.");
      }

      await registerServiceWorker();
      const subscription = await retry(async () => ensurePushSubscription());
      await retry(async () => saveSubscription(subscription));

      const oldBadge = Number(localStorage.getItem(CONFIG.BADGE_STORAGE) || 0);
      if (oldBadge > 0) await setBadge(oldBadge);

      initialized = true;
      log("Push system READY.");
      return true;

    } catch (errorValue) {
      error("Push init error:", errorValue);
    } finally {
      booting = false;
    }
  }

  function setupRealtimePermissionMonitor() {
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'notifications' }).then(permissionStatus => {
        permissionStatus.onchange = () => {
          if (permissionStatus.state === 'granted') {
            openApplication();
            initializePush().catch(() => {});
          } else {
            lockApplicationInstantly();
          }
        };
      }).catch(() => {});
    }
  }

  async function requestNotificationPermission() {
    clearError();
    allowButton.disabled = true;

    try {
      if (Notification.permission === "denied") {
        showBlockedState();
        return;
      }

      if (Notification.permission === "granted") {
        openApplication();
        await initializePush();
        return;
      }

      const permission = await Notification.requestPermission();
      health.permission = permission;

      if (permission === "granted") {
        openApplication();
        await initializePush();
      } else if (permission === "denied") {
        showBlockedState();
      } else {
        showLock(
          "Notifikasi Belum Diizinkan",
          "Izinkan notifikasi agar Aplikasi dapat mengirim pemberitahuan penting.",
          "Aktifkan Notifikasi"
        );
      }

    } catch (errorValue) {
      showError(errorValue?.message || String(errorValue));
    } finally {
      allowButton.disabled = false;
    }
  }

  function showBlockedState() {
    showLock(
      "Aplikasi Diblokir",
      "Karena izin notifikasi diblokir di browser. Buka pengaturan browser, izinkan notifikasi, lalu muat ulang halaman.",
      "Saya Sudah Mengizinkan"
    );
    allowButton.disabled = false;
  }

  async function handleAllowButton() {
    clearError();
    if (Notification.permission === "denied") {
      if (Notification.permission === "granted") {
        openApplication();
        await initializePush();
      } else {
        showBlockedState();
      }
      return;
    }
    await requestNotificationPermission();
  }

  async function handleIframeMessage(event) {
    if (event.source !== appFrame.contentWindow) return;
    const data = event.data || {};
    if (typeof data !== "object") return;

    if (data.type === "SYNC_USER_SESSION") {
      session.user_id = data.user_id ?? data.userId ?? data.user?.id ?? null;
      session.role = data.role ?? data.user?.role ?? null;

      try {
        const subscription = await swRegistration?.pushManager?.getSubscription();
        if (subscription) await saveSubscription(subscription);
      } catch (e) {}
    }

    if (data.type === "SET_APP_BADGE") await setBadge(data.count);
    if (data.type === "CLEAR_APP_BADGE") await setBadge(0);
  }

  function getPlatformMessage() {
    const ua = navigator.userAgent || "";
    const mobile = /Android|iPhone|iPad|iPod/i.test(ua);
    if (!mobile || isStandalonePWA()) return null;

    if (/iPhone|iPad|iPod/i.test(ua)) {
      return "Untuk menerima notifikasi Aplikasi di iPhone/iPad, tambahkan Aplikasi ke Layar Utama (Add to Home Screen) terlebih dahulu.";
    }
    return null;
  }

  async function boot() {
    allowButton.addEventListener("click", handleAllowButton);
    window.addEventListener("message", handleIframeMessage);
    setupRealtimePermissionMonitor();

    if (!window.isSecureContext) {
      showLock("Koneksi Tidak Aman", "Web Push Aplikasi membutuhkan HTTPS.", "Tutup");
      allowButton.disabled = true;
      return;
    }

    if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
      showLock("Browser Tidak Mendukung", "Browser ini tidak mendukung Web Push. Gunakan Chrome atau Edge.", "Tutup");
      allowButton.disabled = true;
      return;
    }

    // JIKA IZIN SUDAH DIBERIKAN: LANGSUNG BUKA TANPA GLITCH
    if (Notification.permission === "granted") {
      openApplication();
      initializePush().catch(() => {});
      return;
    }

    if (Notification.permission === "denied") {
      showBlockedState();
      return;
    }

    const mobileMessage = getPlatformMessage();
    if (mobileMessage) {
      showLock("Pasang Aplikasi Terlebih Dahulu", mobileMessage, "Saya Sudah Memasang");
      allowButton.addEventListener("click", async () => {
        if (isStandalonePWA()) {
          await requestNotificationPermission();
        } else {
          showLock("Aplikasi Belum Terpasang", mobileMessage, "Saya Sudah Memasang");
        }
      }, { once: true });
      return;
    }

    showLock(
      "Izin Notifikasi Diperlukan",
      "Aplikasi menggunakan notifikasi browser sebagai satu-satunya sistem pemberitahuan. Izinkan notifikasi untuk membuka aplikasi.",
      "Aktifkan Notifikasi"
    );
  }

  boot();
})();
</script>

</body>
</html>
