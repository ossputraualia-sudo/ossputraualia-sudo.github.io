<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PAG Docs - PT. Putra Aulia Group</title>
  
  <!-- PWA & Mobile Web Meta -->
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PAG Docs">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- OneSignal Web Push SDK (v16+) -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "e9c3d005-53b3-4bef-8721-dd6062e20559",
        safari_web_id: "web.onesignal.auto.e9c3d005-53b3-4bef-8721-dd6062e20559",
        notifyButton: {
          enable: false
        },
        allowLocalhostAsSecureOrigin: true
      });

      // Minta izin push notifikasi otomatis
      OneSignal.Notifications.requestPermission();
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f766e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #f1f5f9;
    }
    /* Loading Splash Screen */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .splash-logo {
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      padding: 16px 24px;
      border-radius: 20px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .splash-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .splash-sub {
      font-size: 12px;
      color: #99f6e4;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splashScreen">
    <div class="splash-logo">PAG</div>
    <div class="splash-title">PT. PUTRA AULIA GROUP</div>
    <div class="splash-sub">Sistem Manajemen Dokumen Terpadu</div>
    <div class="spinner"></div>
  </div>

  <!-- GOOGLE APPS SCRIPT WEB APP IFRAME -->
  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec" 
    allow="clipboard-read; clipboard-write; geolocation; camera; microphone;"
  ></iframe>

  <script>
    var APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec";

    var frame = document.getElementById('appFrame');
    var splash = document.getElementById('splashScreen');

    // 1. Sinkronisasi Hash URL (Deep Linking dari Notifikasi ke Halaman Menu)
    function syncUrlToIframe() {
      var hash = window.location.hash || '';
      if (frame && APPS_SCRIPT_EXEC_URL) {
        var targetUrl = APPS_SCRIPT_EXEC_URL + (hash ? hash : '');
        if (!frame.src || frame.src.indexOf(APPS_SCRIPT_EXEC_URL) === -1) {
          frame.src = targetUrl;
        }
      }
    }

    // 2. Transisi Splash Screen saat Aplikasi Siap
    frame.onload = function() {
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() {
          splash.style.visibility = 'hidden';
        }, 400);
      }
    };

    // 3. Jembatan Sinkronisasi Role Login ke OneSignal Tag
    window.addEventListener('message', function(event) {
      var data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'SET_ONESIGNAL_USER') {
        var role = String(data.role || 'user biasa').toLowerCase().trim();
        var email = String(data.email || '').trim().toLowerCase();
        var nama = String(data.nama || 'User').trim();

        window.OneSignalDeferred.push(async function(OneSignal) {
          if (email) {
            await OneSignal.login(email);
          }

          // Pasang Label Tag Role untuk filter pengiriman notifikasi
          await OneSignal.User.addTags({
            role: role,
            nama: nama,
            email: email,
            app: 'PAG_DOCS'
          });

          console.log('✅ OneSignal Tag Berhasil Ditetapkan:', role, email);
        });
      }
    });

    syncUrlToIframe();
    window.addEventListener('hashchange', syncUrlToIframe);

    // Registrasi Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./OneSignalSDKWorker.js').catch(function(err) {
          console.log('SW Registration error:', err);
        });
      });
    }
  </script>
</body>
</html>
