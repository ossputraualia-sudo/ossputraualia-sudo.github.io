<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f766e"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="PAG Docs"
  >

  <title>
    PAG Docs
  </title>


  <!-- ======================================================
       MANIFEST
       ====================================================== -->

  <link
    rel="manifest"
    href="./manifest.json"
  >


  <link
    rel="icon"
    type="image/png"
    href="./icon-192.png"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    #appFrame {

      display: block;

      width: 100%;

      height: 100%;

      border: 0;

      background: #ffffff;
    }


    /* ======================================================
       NOTIFICATION PERMISSION GATE
       ====================================================== */

    #lockScreenOverlay {

      position: fixed;

      inset: 0;

      z-index: 999999;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(255,255,255,.96);

      padding: 24px;
    }


    #lockScreenOverlay.hidden {

      display: none;
    }


    .permission-card {

      width: min(
        430px,
        100%
      );

      padding: 28px;

      border-radius: 20px;

      background: #ffffff;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.14);

      text-align: center;
    }


    .permission-icon {

      width: 64px;

      height: 64px;

      margin: 0 auto 18px;

      border-radius: 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #0f766e;

      color: white;

      font-size: 28px;
    }


    .permission-card h2 {

      margin:
        0 0 10px;

      font-size: 21px;

      color: #111827;
    }


    .permission-card p {

      margin:
        0 0 22px;

      line-height: 1.55;

      color: #6b7280;

      font-size: 14px;
    }


    #notificationPermissionButton {

      width: 100%;

      border: 0;

      border-radius: 12px;

      padding: 13px 18px;

      background: #0f766e;

      color: white;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;
    }


    #notificationPermissionButton:hover {

      opacity: .92;
    }


    #notificationContinueButton {

      margin-top: 10px;

      width: 100%;

      border: 0;

      background: transparent;

      color: #6b7280;

      padding: 10px;

      cursor: pointer;
    }


    /* ======================================================
       INTERNAL BANNER
       ====================================================== */

    #pagNotificationBanner {

      position: fixed;

      top: 16px;

      right: 16px;

      z-index: 999998;

      width: min(
        380px,
        calc(100vw - 32px)
      );

      padding: 15px 16px;

      border-radius: 14px;

      background: #ffffff;

      box-shadow:
        0 12px 40px
        rgba(0,0,0,.18);

      border-left:
        4px solid #0f766e;

      display: none;

      cursor: pointer;
    }


    #pagNotificationBanner.show {

      display: block;

      animation:
        pagBannerIn
        .22s ease-out;
    }


    .pag-banner-title {

      font-weight: 700;

      font-size: 14px;

      color: #111827;

      margin-bottom: 5px;
    }


    .pag-banner-body {

      font-size: 13px;

      line-height: 1.45;

      color: #4b5563;
    }


    @keyframes pagBannerIn {

      from {

        opacity: 0;

        transform:
          translateY(-10px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }

  </style>

</head>


<body>


  <!-- ======================================================
       MAIN APP
       ====================================================== -->

  <iframe
    id="appFrame"
    src="about:blank"
    allow="
      clipboard-read;
      clipboard-write;
      geolocation;
      camera;
      microphone;
      notifications
    "
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>


  <!-- ======================================================
       PERMISSION GATE
       ====================================================== -->

  <div
    id="lockScreenOverlay"
    class="hidden"
  >

    <div class="permission-card">

      <div class="permission-icon">
        🔔
      </div>

      <h2>
        Aktifkan Notifikasi PAG Docs
      </h2>

      <p>
        Izinkan notifikasi agar Anda tetap menerima
        informasi PAG Docs walaupun aplikasi sedang
        tidak dibuka.
      </p>

      <button
        id="notificationPermissionButton"
        type="button"
      >
        Aktifkan Notifikasi
      </button>

      <button
        id="notificationContinueButton"
        type="button"
      >
        Lanjut tanpa notifikasi
      </button>

    </div>

  </div>


  <!-- ======================================================
       INTERNAL BANNER
       ====================================================== -->

  <div
    id="pagNotificationBanner"
    role="status"
    aria-live="polite"
  >

    <div
      class="pag-banner-title"
      id="pagBannerTitle"
    >
      PAG Docs
    </div>

    <div
      class="pag-banner-body"
      id="pagBannerBody"
    >
      Ada informasi baru.
    </div>

  </div>


<script>

/* ============================================================
 * PAG DOCS PUSH CLIENT
 * VERSION: PAG-PUSH-V4
 * ============================================================ */

(() => {

  "use strict";


  /* ==========================================================
   * CONFIG
   * ========================================================== */

  const APPS_SCRIPT_EXEC_URL =
    "https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec";


  const VAPID_PUBLIC_KEY =
    "BFmbNUOxV304wqekMka5EzEwv7sAapDLaPzlDBN2M-fcbSX9osQvksqcMyBzYYXkls3Cz3o06ZIDz7xsvnzpl-Q";


  const SB_URL =
    "https://qywqxcvnlehmiqrkpwdd.supabase.co";


  const SB_KEY =
    "sb_publishable_Trk4jYTk3nI93sFtmWO6Tg_-ps4vYLq";


  const SW_PATH =
    "./sw.js";


  const SW_VERSION =
    "PAG-PUSH-V4";


  const DEVICE_ID_KEY =
    "PAG_DOCS_PUSH_DEVICE_ID";


  /* ==========================================================
   * STATE
   * ========================================================== */

  let _serviceWorkerRegistration = null;

  let _pushSubscription = null;

  let _pushSubscriptionJSON = null;

  let _userSession = null;

  let _deviceId = null;

  let _deviceLabel = null;

  let _subscriptionSaveRunning = false;

  let _permissionWatcher = null;

  let _bannerTimer = null;


  /* ==========================================================
   * ELEMENTS
   * ========================================================== */

  const appFrame =
    document.getElementById(
      "appFrame"
    );


  const overlay =
    document.getElementById(
      "lockScreenOverlay"
    );


  const permissionButton =
    document.getElementById(
      "notificationPermissionButton"
    );


  const continueButton =
    document.getElementById(
      "notificationContinueButton"
    );


  const banner =
    document.getElementById(
      "pagNotificationBanner"
    );


  const bannerTitle =
    document.getElementById(
      "pagBannerTitle"
    );


  const bannerBody =
    document.getElementById(
      "pagBannerBody"
    );


  /* ==========================================================
   * DEVICE ID
   * ========================================================== */

  function getDeviceId() {

    try {

      let id =
        localStorage.getItem(
          DEVICE_ID_KEY
        );


      if (id) {
        return id;
      }


      id =
        "pag-" +
        Date.now().toString(36) +
        "-" +
        Math.random()
          .toString(36)
          .slice(2, 10);


      localStorage.setItem(
        DEVICE_ID_KEY,
        id
      );


      return id;

    } catch {

      return (
        "pag-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2, 10)
      );
    }
  }


  /* ==========================================================
   * DEVICE LABEL
   * ========================================================== */

  function getDeviceLabel() {

    const ua =
      navigator.userAgent ||
      "";


    let browser =
      "Browser";


    if (
      /Edg\//i.test(ua)
    ) {

      browser =
        "Microsoft Edge";

    } else if (
      /Firefox\//i.test(ua)
    ) {

      browser =
        "Mozilla Firefox";

    } else if (
      /Chrome\//i.test(ua)
    ) {

      browser =
        "Google Chrome";

    } else if (
      /Safari\//i.test(ua) &&
      !/Chrome\//i.test(ua)
    ) {

      browser =
        "Safari";
    }


    let device =
      "Desktop";


    if (
      /Android/i.test(ua)
    ) {

      device =
        "Android";

    } else if (
      /iPhone|iPad|iPod/i.test(ua)
    ) {

      device =
        "iPhone/iPad";

    } else if (
      /Windows/i.test(ua)
    ) {

      device =
        "Windows";

    } else if (
      /Macintosh|Mac OS X/i.test(ua)
    ) {

      device =
        "macOS";

    } else if (
      /Linux/i.test(ua)
    ) {

      device =
        "Linux";
    }


    return (
      browser +
      " - " +
      device
    );
  }


  /* ==========================================================
   * BASE64 → UINT8ARRAY
   * ========================================================== */

  function urlBase64ToUint8Array(
    base64String
  ) {

    const padding =
      "=".repeat(
        (4 -
          base64String.length % 4
        ) % 4
      );


    const base64 =
      (
        base64String +
        padding
      )
      .replace(
        /-/g,
        "+"
      )
      .replace(
        /_/g,
        "/"
      );


    const rawData =
      window.atob(
        base64
      );


    return Uint8Array.from(
      [...rawData].map(
        char =>
          char.charCodeAt(0)
      )
    );
  }


  /* ==========================================================
   * SUPABASE REST
   * ========================================================== */

  async function supabaseFetch(
    path,
    options = {}
  ) {

    const headers =
      new Headers(
        options.headers || {}
      );


    headers.set(
      "apikey",
      SB_KEY
    );


    headers.set(
      "Authorization",
      "Bearer " + SB_KEY
    );


    headers.set(
      "Content-Type",
      "application/json"
    );


    const response =
      await fetch(
        SB_URL +
        path,
        {
          ...options,
          headers
        }
      );


    if (!response.ok) {

      const text =
        await response.text()
          .catch(
            () => ""
          );


      throw new Error(
        "Supabase " +
        response.status +
        ": " +
        text
      );
    }


    return response;
  }


  /* ==========================================================
   * SERVICE WORKER
   * ========================================================== */

  async function siapkanServiceWorker() {

    if (
      !("serviceWorker" in navigator)
    ) {

      console.warn(
        "[PAG] Service Worker tidak tersedia"
      );

      return null;
    }


    try {

      let registration =
        await navigator.serviceWorker.getRegistration(
          "./"
        );


      if (!registration) {

        registration =
          await navigator.serviceWorker.register(
            SW_PATH,
            {
              scope: "./",
              updateViaCache: "none"
            }
          );
      }


      _serviceWorkerRegistration =
        registration;


      await navigator.serviceWorker.ready;


      /*
       * Ping hanya untuk verifikasi.
       */
      try {

        const worker =
          registration.active ||
          navigator.serviceWorker.controller;


        if (worker) {

          worker.postMessage({
            type:
              "PAG_SW_PING"
          });
        }

      } catch {}


      return registration;

    } catch (error) {

      console.error(
        "[PAG] Service Worker error:",
        error
      );

      return null;
    }
  }


  /* ==========================================================
   * PUSH SUBSCRIPTION
   * ========================================================== */

  async function buatPushSubscription() {

    if (
      !("PushManager" in window)
    ) {

      throw new Error(
        "PushManager tidak tersedia"
      );
    }


    if (
      !("Notification" in window)
    ) {

      throw new Error(
        "Notification API tidak tersedia"
      );
    }


    if (
      Notification.permission !==
      "granted"
    ) {

      throw new Error(
        "Permission notification belum granted"
      );
    }


    if (
      !_serviceWorkerRegistration
    ) {

      await siapkanServiceWorker();
    }


    if (
      !_serviceWorkerRegistration
    ) {

      throw new Error(
        "Service Worker gagal disiapkan"
      );
    }


    let subscription =
      await _serviceWorkerRegistration
        .pushManager
        .getSubscription();


    if (!subscription) {

      const applicationServerKey =
        urlBase64ToUint8Array(
          VAPID_PUBLIC_KEY
        );


      subscription =
        await _serviceWorkerRegistration
          .pushManager
          .subscribe({

            userVisibleOnly:
              true,

            applicationServerKey
          });
    }


    _pushSubscription =
      subscription;


    _pushSubscriptionJSON =
      subscription.toJSON();


    return subscription;
  }


  /* ==========================================================
   * SAVE SUBSCRIPTION
   * ========================================================== */

  async function simpanSubscription() {

    if (
      _subscriptionSaveRunning
    ) {

      return;
    }


    if (
      !_pushSubscriptionJSON?.endpoint
    ) {

      return;
    }


    _subscriptionSaveRunning =
      true;


    try {

      const keys =
        _pushSubscriptionJSON.keys ||
        {};


      const payload = {

        device_id:
          _deviceId,

        user_id:
          _userSession?.user_id ??
          null,

        role:
          _userSession?.role ||
          "semua",

        endpoint:
          _pushSubscriptionJSON.endpoint,

        keys_p256dh:
          keys.p256dh ||
          null,

        keys_auth:
          keys.auth ||
          null,

        device_label:
          _deviceLabel,

        updated_at:
          new Date()
            .toISOString()
      };


      await supabaseFetch(
        "/rest/v1/web_push_subscriptions?on_conflict=endpoint",
        {
          method:
            "POST",

          headers: {

            Prefer:
              "resolution=merge-duplicates,return=minimal"
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


      console.log(
        "[PAG] Push subscription tersimpan"
      );

    } catch (error) {

      /*
       * Jangan blok aplikasi.
       */
      console.warn(
        "[PAG] Subscription save failed:",
        error
      );

    } finally {

      _subscriptionSaveRunning =
        false;
    }
  }


  /* ==========================================================
   * BACKGROUND PUSH SETUP
   * ========================================================== */

  async function siapkanPushBackground() {

    if (
      Notification.permission !==
      "granted"
    ) {

      return;
    }


    try {

      await siapkanServiceWorker();

      await buatPushSubscription();

      await simpanSubscription();

    } catch (error) {

      console.warn(
        "[PAG] Background push gagal:",
        error
      );
    }
  }


  /* ==========================================================
   * SESSION DARI APPS SCRIPT
   *
   * JS_Core.html dapat mengirim:
   *
   * window.parent.postMessage({
   *   type: "SYNC_USER_SESSION",
   *   session: {...}
   * }, "*")
   * ========================================================== */

  function handleMessage(event) {

    const data =
      event.data;


    if (!data) {
      return;
    }


    /* --------------------------------------------------------
     * SESSION
     * -------------------------------------------------------- */

    if (
      data.type ===
      "SYNC_USER_SESSION"
    ) {

      _userSession =
        data.session ||
        data.user ||
        null;


      /*
       * Subscription sudah ada?
       * Update user/role di database.
       */

      if (
        _pushSubscriptionJSON
      ) {

        simpanSubscription();
      }


      return;
    }


    /* --------------------------------------------------------
     * INTERNAL BANNER
     * -------------------------------------------------------- */

    if (
      data.type ===
      "SHOW_OS_NOTIFICATION"
    ) {

      tampilkanInternalNotification(
        data
      );

      return;
    }


    /* --------------------------------------------------------
     * SET BADGE
     * -------------------------------------------------------- */

    if (
      data.type ===
      "SET_APP_BADGE"
    ) {

      setPAGBadge(
        data.count
      );

      return;
    }


    /* --------------------------------------------------------
     * CLEAR BADGE
     * -------------------------------------------------------- */

    if (
      data.type ===
      "CLEAR_APP_BADGE"
    ) {

      clearPAGBadge();

      return;
    }


    /* --------------------------------------------------------
     * SW NOTIFICATION OPENED
     * -------------------------------------------------------- */

    if (
      data.type ===
      "PAG_NOTIFICATION_OPENED"
    ) {

      /*
       * Jangan tampilkan ulang banner.
       * Notification OS sudah diklik.
       */

      return;
    }
  }


  window.addEventListener(
    "message",
    handleMessage
  );


  /* ==========================================================
   * INTERNAL BANNER
   * ========================================================== */

  function tampilkanInternalNotification(
    data
  ) {

    bannerTitle.textContent =
      data.title ||
      data.judul ||
      "PAG Docs";


    bannerBody.textContent =
      data.body ||
      data.pesan ||
      data.message ||
      "Ada informasi baru.";


    banner.classList.add(
      "show"
    );


    clearTimeout(
      _bannerTimer
    );


    _bannerTimer =
      setTimeout(
        () => {

          banner.classList.remove(
            "show"
          );

        },
        6000
      );
  }


  /* ==========================================================
   * BADGE
   * ========================================================== */

  async function setPAGBadge(
    count
  ) {

    try {

      const value =
        Number(count);


      if (
        "setAppBadge" in navigator
      ) {

        if (
          Number.isFinite(value) &&
          value > 0
        ) {

          await navigator.setAppBadge(
            Math.min(
              Math.floor(value),
              999
            )
          );

        } else {

          await navigator.setAppBadge();
        }

        return;
      }

    } catch (error) {

      console.warn(
        "[PAG] Page badge error:",
        error
      );
    }


    /*
     * Fallback ke Service Worker.
     */

    try {

      const registration =
        _serviceWorkerRegistration ||
        await navigator.serviceWorker.ready;


      const worker =
        registration.active;


      if (worker) {

        worker.postMessage({

          type:
            "SET_BADGE",

          count
        });
      }

    } catch {}
  }


  async function clearPAGBadge() {

    try {

      if (
        "clearAppBadge" in navigator
      ) {

        await navigator.clearAppBadge();
      }

    } catch {}


    try {

      const registration =
        _serviceWorkerRegistration ||
        await navigator.serviceWorker.ready;


      if (
        registration.active
      ) {

        registration.active.postMessage({
          type:
            "CLEAR_BADGE"
        });
      }

    } catch {}
  }


  /* ==========================================================
   * REQUEST NOTIFICATION
   * ========================================================== */

  async function panggilAksiNotifikasi() {

    if (
      !("Notification" in window)
    ) {

      overlay.classList.add(
        "hidden"
      );

      return;
    }


    try {

      const permission =
        await Notification.requestPermission();


      if (
        permission ===
        "granted"
      ) {

        /*
         * Hilangkan gate SEGERA.
         */
        overlay.classList.add(
          "hidden"
        );


        /*
         * Jangan menunggu push.
         */
        siapkanPushBackground();


        return;
      }


      /*
       * User menolak / browser tidak memberikan
       * permission.
       */

      overlay.classList.add(
        "hidden"
      );

    } catch (error) {

      console.warn(
        "[PAG] Permission error:",
        error
      );


      overlay.classList.add(
        "hidden"
      );
    }
  }


  /* ==========================================================
   * INITIAL PERMISSION CHECK
   * ========================================================== */

  function cekPermissionAwal() {

    /*
     * Tidak ada Notification API.
     * Aplikasi tetap dibuka.
     */

    if (
      !("Notification" in window)
    ) {

      overlay.classList.add(
        "hidden"
      );

      return;
    }


    switch (
      Notification.permission
    ) {

      case "granted":

        /*
         * Langsung masuk aplikasi.
         */

        overlay.classList.add(
          "hidden"
        );


        /*
         * Push berjalan di background.
         */

        siapkanPushBackground();

        break;


      case "denied":

        /*
         * Jangan mengunci aplikasi.
         */

        overlay.classList.add(
          "hidden"
        );

        break;


      default:

        /*
         * Hanya permission pertama kali
         * yang menampilkan gate.
         */

        overlay.classList.remove(
          "hidden"
        );

        break;
    }
  }


  /* ==========================================================
   * PERMISSION CHANGE WATCHER
   * ========================================================== */

  async function setupPermissionWatcher() {

    try {

      if (
        !navigator.permissions
      ) {

        return;
      }


      _permissionWatcher =
        await navigator.permissions.query({
          name:
            "notifications"
        });


      _permissionWatcher.onchange =
        () => {

          const permission =
            Notification.permission;


          /*
           * Hanya bereaksi ketika permission
           * benar-benar berubah.
           */

          if (
            permission ===
            "granted"
          ) {

            overlay.classList.add(
              "hidden"
            );


            siapkanPushBackground();

          } else {

            overlay.classList.add(
              "hidden"
            );
          }
        };

    } catch (error) {

      console.warn(
        "[PAG] Permission watcher unavailable:",
        error
      );
    }
  }


  /* ==========================================================
   * LOAD APPS SCRIPT
   * ========================================================== */

  function loadApp() {

    if (
      appFrame.src !==
      APPS_SCRIPT_EXEC_URL
    ) {

      appFrame.src =
        APPS_SCRIPT_EXEC_URL;
    }
  }


  /* ==========================================================
   * FRAME LOAD
   * ========================================================== */

  appFrame.addEventListener(
    "load",
    () => {

      /*
       * Jika session sudah diketahui,
       * kirim kembali ke Apps Script.
       */

      if (
        _userSession
      ) {

        try {

          appFrame.contentWindow
            .postMessage({

              type:
                "PAG_PARENT_SESSION",

              session:
                _userSession

            }, "*");

        } catch {}
      }
    }
  );


  /* ==========================================================
   * PERMISSION BUTTON
   * ========================================================== */

  permissionButton.addEventListener(
    "click",
    () => {

      panggilAksiNotifikasi();
    }
  );


  /* ==========================================================
   * CONTINUE WITHOUT NOTIFICATION
   * ========================================================== */

  continueButton.addEventListener(
    "click",
    () => {

      overlay.classList.add(
        "hidden"
      );
    }
  );


  /* ==========================================================
   * BANNER CLICK
   * ========================================================== */

  banner.addEventListener(
    "click",
    () => {

      banner.classList.remove(
        "show"
      );
    }
  );


  /* ==========================================================
   * SERVICE WORKER MESSAGE
   * ========================================================== */

  if (
    "serviceWorker" in navigator
  ) {

    navigator.serviceWorker.addEventListener(
      "message",
      event => {

        const data =
          event.data;


        if (
          data?.type ===
          "PAG_SW_PONG"
        ) {

          console.log(
            "[PAG] Service Worker:",
            data.version
          );
        }
      }
    );
  }


  /* ==========================================================
   * INITIALIZE
   * ========================================================== */

  async function init() {

    /*
     * Device information tidak menunggu apa pun.
     */

    _deviceId =
      getDeviceId();


    _deviceLabel =
      getDeviceLabel();


    /*
     * APP DIBUKA SEGERA.
     */

    loadApp();


    /*
     * Cek notification.
     */

    cekPermissionAwal();


    /*
     * Watch permission.
     */

    setupPermissionWatcher();


    /*
     * Register SW di background.
     *
     * Tidak menghambat aplikasi.
     */

    setTimeout(
      () => {

        siapkanServiceWorker();

      },
      300
    );


    /*
     * Update SW setelah aplikasi hidup.
     */

    setTimeout(
      async () => {

        try {

          const registration =
            await navigator.serviceWorker
              .getRegistration("./");


          if (
            registration
          ) {

            await registration.update();
          }

        } catch {}

      },
      2000
    );
  }


  /*
   * PENTING:
   *
   * Tidak ada:
   * - visibilitychange
   * - focus
   * - pageshow
   * - polling 3 detik
   * - lock notification berulang
   */

  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      init,
      {
        once: true
      }
    );

  } else {

    init();
  }

})();
</script>

</body>
</html>
