<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PT. PUTRA AULIA KONSULTAN</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PAG Docs">
  
  <!-- Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- OneSignal Web Push SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    var unreadCount = 0;

    // --- FUNGSI BADGE NOTIFIKASI (APP BADGE API) ---
    function pasangBadge(jumlah) {
      if ('setAppBadge' in navigator) {
        if (jumlah > 0) {
          navigator.setAppBadge(jumlah).catch(function(e) { console.log('Badge error:', e); });
        } else {
          navigator.clearAppBadge().catch(function(e) { console.log('Clear badge error:', e); });
        }
      }
    }

    function hapusBadge() {
      unreadCount = 0;
      pasangBadge(0);
    }

    // Bersihkan badge saat aplikasi dibuka/difokuskan oleh pengguna
    window.addEventListener('focus', hapusBadge);
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        hapusBadge();
      }
    });

    // Inisialisasi OneSignal
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "e9c3d005-53b3-4bef-8721-dd6062e20559"
      });

      // Jika ada notifikasi push yang masuk saat browser menyala, naikkan badge angka
      OneSignal.Notifications.addEventListener('foregroundWillDisplay', function() {
        unreadCount++;
        pasangBadge(unreadCount);
      });

      // Sembunyikan tombol izin jika sudah berlangganan
      const isPushSupported = OneSignal.Notifications.isPushSupported();
      if (isPushSupported) {
        const permission = OneSignal.Notifications.permission;
        if (permission) {
          var btn = document.getElementById('btnNotif');
          if (btn) btn.style.display = 'none';
        }
      }
    });

    // Menerima perintah update badge dari Apps Script iframe
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'SET_UNREAD_BADGE') {
        var count = parseInt(event.data.count, 10) || 0;
        pasangBadge(count);
      }
    });

    async function mintaIzinNotif() {
      try {
        if (!window.OneSignal) {
          alert("OneSignal belum siap atau diblokir ekstensi browser.");
          return;
        }
        await OneSignal.Notifications.requestPermission();
        await OneSignal.User.PushSubscription.optIn();
        alert("✅ Berhasil! Perangkat terdaftar.");
        var btn = document.getElementById('btnNotif');
        if (btn) btn.style.display = 'none';
      } catch (err) {
        alert("Gagal mengaktifkan notifikasi: " + err.message);
      }
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #btnNotif {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: #0f766e;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 50px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      z-index: 9999999;
      transition: all 0.2s ease-in-out;
    }
    #btnNotif:hover { background-color: #115e59; transform: translateY(-2px); }
    #btnNotif:active { transform: scale(0.96); }
    #offlineBanner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #ef4444;
      color: #ffffff;
      text-align: center;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      z-index: 9999999;
    }
  </style>
</head>
<body>

  <div id="offlineBanner">⚠️ Anda sedang offline. Sambungkan internet untuk mengelola data.</div>

  <button id="btnNotif" onclick="mintaIzinNotif()">
    🔔 Aktifkan Notifikasi
  </button>

  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec" 
    allow="geolocation; microphone; camera; clipboard-write">
  </iframe>

  <script>
    function checkConnection() {
      const banner = document.getElementById('offlineBanner');
      if (banner) banner.style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online', checkConnection);
    window.addEventListener('offline', checkConnection);
  </script>
</body>
</html>
