<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f766e"
  >

  <meta
    name="description"
    content="PAG Docs - Sistem Dokumentasi dan Manajemen PT Putra Aulia Group"
  >

  <title>PAG Docs</title>

  <!-- ======================================================
       PWA
       ====================================================== -->

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="./icon-192.png"
  >


  <!-- ======================================================
       STYLE
       ====================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    /* ====================================================
       APP FRAME
       ==================================================== */

    #appFrame {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;

      background: #ffffff;
    }


    /* ====================================================
       NOTIFICATION PERMISSION GATE
       ==================================================== */

    #lockScreenOverlay {

      position: fixed;

      inset: 0;

      z-index: 999999;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;

      background:
        rgba(255, 255, 255, 0.97);

      transition:
        opacity 0.18s ease,
        visibility 0.18s ease;

    }


    #lockScreenOverlay.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }


    .notif-lock-card {

      width: min(
        440px,
        100%
      );

      padding: 30px 26px;

      border-radius: 18px;

      background: #ffffff;

      box-shadow:
        0 18px 60px rgba(0, 0, 0, 0.15);

      text-align: center;

      border:
        1px solid #e5e7eb;

    }


    .notif-lock-icon {

      width: 64px;

      height: 64px;

      margin:
        0 auto 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background: #ecfdf5;

      font-size: 30px;

    }


    .notif-lock-title {

      margin: 0 0 10px;

      font-size: 21px;

      font-weight: 700;

      color: #111827;

    }


    .notif-lock-message {

      margin: 0 auto 22px;

      max-width: 360px;

      line-height: 1.55;

      font-size: 14px;

      color: #6b7280;

    }


    #notifActionButton {

      width: 100%;

      min-height: 46px;

      padding: 11px 18px;

      border: 0;

      border-radius: 10px;

      background: #0f766e;

      color: #ffffff;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

    }


    #notifActionButton:hover {

      background: #115e59;

    }


    #notifActionButton:disabled {

      opacity: 0.65;

      cursor: wait;

    }


    .notif-lock-hint {

      margin-top: 14px;

      font-size: 12px;

      line-height: 1.45;

      color: #9ca3af;

    }


    /* ====================================================
       STATUS
       ==================================================== */

    #notifStatus {

      display: none;

      margin-top: 12px;

      font-size: 12px;

      color: #6b7280;

    }


    #notifStatus.show {

      display: block;

    }

  </style>
</head>


<body>


  <!-- ======================================================
       MAIN APPLICATION
       ====================================================== -->

  <iframe
    id="appFrame"
    src="about:blank"
    title="PAG Docs"
    allow="
      clipboard-read;
      clipboard-write;
      geolocation;
      camera;
      microphone;
      notifications
    "
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>


  <!-- ======================================================
       NOTIFICATION PERMISSION OVERLAY

       Overlay INI TIDAK lagi menjadi splash screen.

       Hanya muncul jika permission browser masih:
       "default"
       ====================================================== -->

  <div
    id="lockScreenOverlay"
    class="hidden"
    aria-hidden="true"
  >

    <div class="notif-lock-card">

      <div class="notif-lock-icon">
        🔔
      </div>


      <h1
        id="notifLockTitle"
        class="notif-lock-title"
      >
        Aktifkan Notifikasi
      </h1>


      <p
        id="notifLockMessage"
        class="notif-lock-message"
      >
        Aktifkan notifikasi agar PAG Docs dapat
        memberi tahu Anda ketika ada informasi baru.
      </p>


      <button
        id="notifActionButton"
        type="button"
        onclick="window.panggilAksiNotifikasi()"
      >
        AKTIFKAN NOTIFIKASI
      </button>


      <div
        id="notifStatus"
      ></div>


      <div class="notif-lock-hint">

        Notifikasi hanya digunakan untuk pemberitahuan
        dari PAG Docs. Aplikasi tetap dapat digunakan
        setelah izin ditolak.

      </div>

    </div>

  </div>


  <!-- ======================================================
       JAVASCRIPT
       ====================================================== -->

  <script>

    "use strict";


    /* ======================================================
       CONFIGURATION
       ====================================================== */

    const APPS_SCRIPT_EXEC_URL =
      "https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec";


    const VAPID_PUBLIC_KEY =
      "BFmbNUOxV304wqekMka5EzEwv7sAapDLaPzlDBN2M-fcbSX9osQvksqcMyBzYYXkls3Cz3o06ZIDz7xsvnzpl-Q";


    const SB_URL =
      "https://qywqxcvnlehmiqrkpwdd.supabase.co";


    /*
     * Publishable / anon key.
     *
     * JANGAN gunakan service_role key di frontend.
     */

    const SB_KEY =
      "sb_publishable_Trk4jYTk3nI93sFtmWO6Tg_-ps4vYLq";


    const SW_PATH =
      "./sw.js";


    const SW_VERSION =
      "PAG-PUSH-V3";


    /* ======================================================
       STATE
       ====================================================== */

    let _serviceWorkerRegistration = null;

    let _pushSubscription = null;

    let _pushSubscriptionJSON = null;

    let _userSession = null;

    let _deviceId = null;

    let _deviceLabel = null;

    let _appLoaded = false;

    let _permissionWatcher = null;

    let _pushBackgroundRunning = false;

    let _subscriptionSaveRunning = false;


    /* ======================================================
       DOM
       ====================================================== */

    const appFrame =
      document.getElementById(
        "appFrame"
      );


    const lockOverlay =
      document.getElementById(
        "lockScreenOverlay"
      );


    const notifActionButton =
      document.getElementById(
        "notifActionButton"
      );


    const notifLockTitle =
      document.getElementById(
        "notifLockTitle"
      );


    const notifLockMessage =
      document.getElementById(
        "notifLockMessage"
      );


    const notifStatus =
      document.getElementById(
        "notifStatus"
      );


    /* ======================================================
       LOG
       ====================================================== */

    function log(...args) {

      console.log(
        "[PAG]",
        ...args
      );

    }


    function warn(...args) {

      console.warn(
        "[PAG]",
        ...args
      );

    }


    /* ======================================================
       LOCAL STORAGE
       ====================================================== */

    function safeLocalStorageGet(key) {

      try {

        return localStorage.getItem(
          key
        );

      } catch {

        return null;

      }

    }


    function safeLocalStorageSet(
      key,
      value
    ) {

      try {

        localStorage.setItem(
          key,
          value
        );

      } catch {

        /* ignore */

      }

    }


    /* ======================================================
       DEVICE ID
       ====================================================== */

    function getDeviceId() {

      if (_deviceId) {

        return _deviceId;

      }


      const storageKey =
        "PAG_DOCS_PUSH_DEVICE_ID";


      let existing =
        safeLocalStorageGet(
          storageKey
        );


      if (
        existing &&
        existing.trim()
      ) {

        _deviceId =
          existing.trim();

        return _deviceId;

      }


      const randomPart =
        Math.random()
          .toString(36)
          .slice(2, 10);


      _deviceId =
        "pag-" +
        Date.now().toString(36) +
        "-" +
        randomPart;


      safeLocalStorageSet(
        storageKey,
        _deviceId
      );


      return _deviceId;

    }


    /* ======================================================
       DEVICE LABEL
       ====================================================== */

    function getDeviceLabel() {

      if (_deviceLabel) {

        return _deviceLabel;

      }


      const ua =
        navigator.userAgent ||
        "";


      let browser =
        "Browser";


      let os =
        "Unknown OS";


      if (
        /Edg\//i.test(ua)
      ) {

        browser =
          "Microsoft Edge";

      } else if (
        /Chrome\//i.test(ua)
      ) {

        browser =
          "Google Chrome";

      } else if (
        /Firefox\//i.test(ua)
      ) {

        browser =
          "Mozilla Firefox";

      } else if (
        /Safari\//i.test(ua) &&
        !/Chrome\//i.test(ua)
      ) {

        browser =
          "Safari";

      }


      if (
        /Android/i.test(ua)
      ) {

        os =
          "Android";

      } else if (
        /iPhone|iPad|iPod/i.test(ua)
      ) {

        os =
          "iOS";

      } else if (
        /Windows/i.test(ua)
      ) {

        os =
          "Windows";

      } else if (
        /Mac OS X/i.test(ua)
      ) {

        os =
          "macOS";

      } else if (
        /Linux/i.test(ua)
      ) {

        os =
          "Linux";

      }


      _deviceLabel =
        browser +
        " / " +
        os;


      return _deviceLabel;

    }


    /* ======================================================
       BASE64 → UINT8ARRAY
       ====================================================== */

    function urlBase64ToUint8Array(
      base64String
    ) {

      if (
        !base64String ||
        typeof base64String !== "string"
      ) {

        throw new Error(
          "VAPID public key kosong."
        );

      }


      const padding =
        "=".repeat(
          (4 - base64String.length % 4) % 4
        );


      const base64 =
        (
          base64String
            .replace(/-/g, "+")
            .replace(/_/g, "/") +
          padding
        );


      const rawData =
        atob(base64);


      const outputArray =
        new Uint8Array(
          rawData.length
        );


      for (
        let i = 0;
        i < rawData.length;
        i++
      ) {

        outputArray[i] =
          rawData.charCodeAt(i);

      }


      /*
       * VAPID P-256 public key:
       *
       * 65 bytes
       * first byte = 04
       */

      if (
        outputArray.length !== 65 ||
        outputArray[0] !== 4
      ) {

        throw new Error(
          "VAPID public key tidak valid."
        );

      }


      return outputArray;

    }


    /* ======================================================
       SUPABASE REQUEST
       ====================================================== */

    async function sbRequest(
      path,
      options = {}
    ) {

      const url =
        SB_URL +
        path;


      const headers = {

        "apikey":
          SB_KEY,

        "Authorization":
          "Bearer " + SB_KEY,

        "Content-Type":
          "application/json",

        "Accept":
          "application/json",

        ...(options.headers || {})

      };


      const response =
        await fetch(
          url,
          {
            ...options,
            headers
          }
        );


      const text =
        await response.text();


      let data =
        null;


      if (text) {

        try {

          data =
            JSON.parse(
              text
            );

        } catch {

          data =
            text;

        }

      }


      if (
        !response.ok
      ) {

        let message =
          "Supabase HTTP " +
          response.status;


        if (
          data &&
          typeof data === "object"
        ) {

          message =
            data.message ||
            data.error_description ||
            data.error ||
            data.hint ||
            message;

        } else if (
          typeof data === "string" &&
          data.trim()
        ) {

          message =
            data;

        }


        throw new Error(
          message
        );

      }


      return data;

    }


    /* ======================================================
       SHOW / HIDE LOCK
       ====================================================== */

    function showNotificationGate(
      title,
      message,
      buttonText
    ) {

      notifLockTitle.textContent =
        title ||
        "Aktifkan Notifikasi";


      notifLockMessage.textContent =
        message ||
        "Aktifkan notifikasi PAG Docs.";


      notifActionButton.textContent =
        buttonText ||
        "AKTIFKAN NOTIFIKASI";


      notifActionButton.disabled =
        false;


      notifStatus.classList.remove(
        "show"
      );


      lockOverlay.classList.remove(
        "hidden"
      );


      lockOverlay.setAttribute(
        "aria-hidden",
        "false"
      );

    }


    function hideNotificationGate() {

      lockOverlay.classList.add(
        "hidden"
      );


      lockOverlay.setAttribute(
        "aria-hidden",
        "true"
      );


      notifActionButton.disabled =
        false;

    }


    function setNotifStatus(
      message
    ) {

      notifStatus.textContent =
        message || "";


      notifStatus.classList.toggle(
        "show",
        !!message
      );

    }


    /* ======================================================
       LOAD MAIN APP
       ====================================================== */

    function muatAplikasiUtama() {

      if (_appLoaded) {

        return;

      }


      if (
        !APPS_SCRIPT_EXEC_URL
      ) {

        warn(
          "APPS_SCRIPT_EXEC_URL kosong."
        );

        return;

      }


      _appLoaded =
        true;


      appFrame.src =
        APPS_SCRIPT_EXEC_URL;


      log(
        "PAG Docs loaded."
      );

    }


    /* ======================================================
       SERVICE WORKER
       ====================================================== */

    async function siapkanServiceWorker() {

      if (
        !("serviceWorker" in navigator)
      ) {

        throw new Error(
          "Browser tidak mendukung Service Worker."
        );

      }


      /*
       * Gunakan registration yang sudah ada
       * jika tersedia.
       */

      let registration =
        await navigator.serviceWorker.getRegistration(
          "./"
        );


      if (!registration) {

        registration =
          await navigator.serviceWorker.register(
            SW_PATH,
            {
              scope: "./"
            }
          );

      }


      _serviceWorkerRegistration =
        registration;


      /*
       * Tunggu SW yang aktif.
       *
       * Tidak memakai controller manual.
       * Ini menghindari startup menggantung.
       */

      await navigator.serviceWorker.ready;


      log(
        "Service Worker ready.",
        registration.scope
      );


      /*
       * Ping untuk memastikan SW V3.
       */

      try {

        const target =
          navigator.serviceWorker.controller ||
          registration.active;


        if (target) {

          target.postMessage({
            type:
              "PAG_SW_PING"
          });

        }

      } catch (error) {

        warn(
          "SW ping gagal:",
          error
        );

      }


      return registration;

    }


    /* ======================================================
       GET / CREATE PUSH SUBSCRIPTION
       ====================================================== */

    async function buatPushSubscription() {

      if (
        !("PushManager" in window)
      ) {

        throw new Error(
          "Browser tidak mendukung Web Push."
        );

      }


      if (
        !_serviceWorkerRegistration
      ) {

        await siapkanServiceWorker();

      }


      let subscription =
        await _serviceWorkerRegistration.pushManager.getSubscription();


      if (!subscription) {

        const applicationServerKey =
          urlBase64ToUint8Array(
            VAPID_PUBLIC_KEY
          );


        subscription =
          await _serviceWorkerRegistration.pushManager.subscribe({

            userVisibleOnly:
              true,

            applicationServerKey

          });

      }


      _pushSubscription =
        subscription;


      _pushSubscriptionJSON =
        subscription.toJSON();


      log(
        "Push subscription ready."
      );


      return subscription;

    }


    /* ======================================================
       BUILD SUPABASE PAYLOAD
       ====================================================== */

    function buildSubscriptionPayload() {

      if (
        !_pushSubscriptionJSON
      ) {

        return null;

      }


      const keys =
        _pushSubscriptionJSON.keys ||
        {};


      return {

        device_id:
          getDeviceId(),

        user_id:
          _userSession?.user_id ??
          null,

        role:
          _userSession?.role ||
          "semua",

        endpoint:
          _pushSubscriptionJSON.endpoint,

        keys_p256dh:
          keys.p256dh ||
          null,

        keys_auth:
          keys.auth ||
          null,

        device_label:
          getDeviceLabel(),

        updated_at:
          new Date().toISOString()

      };

    }


    /* ======================================================
       SAVE SUBSCRIPTION TO SUPABASE
       ====================================================== */

    async function simpanSubscriptionKeSupabase() {

      if (
        _subscriptionSaveRunning
      ) {

        return;

      }


      const payload =
        buildSubscriptionPayload();


      if (!payload) {

        throw new Error(
          "Push subscription belum tersedia."
        );

      }


      _subscriptionSaveRunning =
        true;


      try {

        const result =
          await sbRequest(
            "/rest/v1/web_push_subscriptions?on_conflict=endpoint",
            {

              method:
                "POST",

              headers: {

                "Prefer":
                  "resolution=merge-duplicates,return=representation"

              },

              body:
                JSON.stringify(
                  payload
                )

            }
          );


        log(
          "Push subscription tersimpan.",
          result
        );


        return result;

      } finally {

        _subscriptionSaveRunning =
          false;

      }

    }


    /* ======================================================
       UPDATE SESSION KE SUBSCRIPTION
       ====================================================== */

    async function updateSubscriptionSession() {

      if (
        !_pushSubscriptionJSON
      ) {

        return;

      }


      try {

        await simpanSubscriptionKeSupabase();

      } catch (error) {

        warn(
          "Update session subscription gagal:",
          error
        );

      }

    }


    /* ======================================================
       BACKGROUND PUSH SETUP
       ====================================================== */

    async function siapkanPushBackground() {

      if (
        _pushBackgroundRunning
      ) {

        return;

      }


      if (
        !("Notification" in window)
      ) {

        warn(
          "Notification API tidak tersedia."
        );

        return;

      }


      if (
        Notification.permission !==
        "granted"
      ) {

        return;

      }


      _pushBackgroundRunning =
        true;


      try {

        await siapkanServiceWorker();

        await buatPushSubscription();

        await simpanSubscriptionKeSupabase();


        log(
          "Push background setup selesai."
        );

      } catch (error) {

        /*
         * SANGAT PENTING:
         *
         * Error push tidak boleh
         * mengunci PAG Docs.
         */

        warn(
          "Push background setup gagal:",
          error
        );

      } finally {

        _pushBackgroundRunning =
          false;

      }

    }


    /* ======================================================
       REQUEST NOTIFICATION PERMISSION
       ====================================================== */

    async function requestNotificationPermission() {

      if (
        !("Notification" in window)
      ) {

        return "unsupported";

      }


      const current =
        Notification.permission;


      if (
        current ===
        "granted"
      ) {

        return "granted";

      }


      if (
        current ===
        "denied"
      ) {

        return "denied";

      }


      /*
       * Permission request hanya dilakukan
       * akibat tindakan pengguna.
       */

      const result =
        await Notification.requestPermission();


      return result;

    }


    /* ======================================================
       MAIN NOTIFICATION ACTION
       ====================================================== */

    async function panggilAksiNotifikasi() {

      notifActionButton.disabled =
        true;


      setNotifStatus(
        "Memproses izin notifikasi..."
      );


      try {

        if (
          !("Notification" in window)
        ) {

          hideNotificationGate();

          muatAplikasiUtama();

          return;

        }


        let permission =
          Notification.permission;


        if (
          permission ===
          "default"
        ) {

          permission =
            await requestNotificationPermission();

        }


        /*
         * GRANTED
         */

        if (
          permission ===
          "granted"
        ) {

          hideNotificationGate();

          muatAplikasiUtama();

          /*
           * Push dipersiapkan di background.
           */

          void siapkanPushBackground();

          return;

        }


        /*
         * DENIED
         *
         * Aplikasi tetap dibuka.
         */

        if (
          permission ===
          "denied"
        ) {

          hideNotificationGate();

          muatAplikasiUtama();

          return;

        }


        /*
         * Fallback
         */

        hideNotificationGate();

        muatAplikasiUtama();

      } catch (error) {

        warn(
          "Permission notification error:",
          error
        );


        /*
         * Push gagal bukan berarti
         * aplikasi gagal.
         */

        hideNotificationGate();

        muatAplikasiUtama();

      } finally {

        notifActionButton.disabled =
          false;

      }

    }


    window.panggilAksiNotifikasi =
      panggilAksiNotifikasi;


    /* ======================================================
       INITIAL PERMISSION CHECK
       ====================================================== */

    async function cekPermissionAwal() {

      /*
       * Browser tidak mendukung Notification.
       */

      if (
        !("Notification" in window)
      ) {

        hideNotificationGate();

        muatAplikasiUtama();

        return;

      }


      const permission =
        Notification.permission;


      log(
        "Notification permission:",
        permission
      );


      /*
       * GRANTED
       *
       * Langsung masuk aplikasi.
       * Push dikerjakan background.
       */

      if (
        permission ===
        "granted"
      ) {

        hideNotificationGate();

        muatAplikasiUtama();

        void siapkanPushBackground();

        return;

      }


      /*
       * DENIED
       *
       * Jangan lock aplikasi.
       */

      if (
        permission ===
        "denied"
      ) {

        hideNotificationGate();

        muatAplikasiUtama();

        warn(
          "Notification permission ditolak browser."
        );

        return;

      }


      /*
       * DEFAULT
       *
       * Tampilkan gate satu kali.
       */

      if (
        permission ===
        "default"
      ) {

        showNotificationGate(
          "Aktifkan Notifikasi",
          "Aktifkan notifikasi agar PAG Docs dapat memberi tahu Anda ketika ada informasi baru.",
          "AKTIFKAN NOTIFIKASI"
        );

        return;

      }


      /*
       * Fallback.
       */

      hideNotificationGate();

      muatAplikasiUtama();

    }


    /* ======================================================
       PERMISSION CHANGE WATCHER
       ====================================================== */

    async function mulaiPermissionWatcher() {

      if (
        !("permissions" in navigator)
      ) {

        return;

      }


      try {

        _permissionWatcher =
          await navigator.permissions.query({
            name: "notifications"
          });


        _permissionWatcher.onchange =
          () => {

            const state =
              Notification.permission;


            log(
              "Notification permission changed:",
              state
            );


            if (
              state ===
              "granted"
            ) {

              hideNotificationGate();

              muatAplikasiUtama();

              void siapkanPushBackground();

              return;

            }


            if (
              state ===
              "denied"
            ) {

              hideNotificationGate();

              muatAplikasiUtama();

              return;

            }


            /*
             * Default hanya tampilkan gate
             * jika aplikasi belum dibuka.
             */

            if (
              state === "default" &&
              !_appLoaded
            ) {

              showNotificationGate(
                "Aktifkan Notifikasi",
                "Aktifkan notifikasi agar PAG Docs dapat memberi tahu Anda ketika ada informasi baru.",
                "AKTIFKAN NOTIFIKASI"
              );

            }

          };

      } catch (error) {

        warn(
          "Permission watcher tidak tersedia:",
          error
        );

      }

    }


    /* ======================================================
       APP FRAME MESSAGE
       ====================================================== */

    window.addEventListener(
      "message",
      event => {

        /*
         * Hanya terima message dari iframe
         * PAG Docs.
         */

        if (
          event.source !==
          appFrame.contentWindow
        ) {

          return;

        }


        const data =
          event.data;


        if (
          !data ||
          typeof data !== "object"
        ) {

          return;

        }


        /* --------------------------------------------------
           SESSION USER
           -------------------------------------------------- */

        if (
          data.type ===
          "SYNC_USER_SESSION"
        ) {

          _userSession =
            data.session ||
            data.user ||
            data.payload ||
            null;


          log(
            "User session synchronized:",
            _userSession
          );


          /*
           * Update subscription dengan
           * user_id + role terbaru.
           */

          void updateSubscriptionSession();

          return;

        }


        /* --------------------------------------------------
           SHOW OS NOTIFICATION
           -------------------------------------------------- */

        if (
          data.type ===
          "SHOW_OS_NOTIFICATION"
        ) {

          void tampilkanOSNotification(
            data
          );

          return;

        }


        /* --------------------------------------------------
           SET BADGE
           -------------------------------------------------- */

        if (
          data.type ===
          "SET_APP_BADGE"
        ) {

          void setPAGBadge(
            data.count
          );

          return;

        }


        /* --------------------------------------------------
           CLEAR BADGE
           -------------------------------------------------- */

        if (
          data.type ===
          "CLEAR_APP_BADGE"
        ) {

          void clearPAGBadge();

          return;

        }

      }
    );


    /* ======================================================
       SHOW OS NOTIFICATION
       ====================================================== */

    async function tampilkanOSNotification(
      data
    ) {

      try {

        if (
          !_serviceWorkerRegistration
        ) {

          await siapkanServiceWorker();

        }


        const title =
          data.title ||
          data.judul ||
          "PAG Docs";


        const body =
          data.body ||
          data.pesan ||
          data.message ||
          "Ada informasi baru.";


        await _serviceWorkerRegistration.showNotification(
          title,
          {

            body,

            icon:
              data.icon ||
              "./icon-192.png",

            badge:
              data.badge ||
              "./icon-192.png",

            tag:
              data.tag ||
              "pag-docs-notification",

            renotify:
              true,

            requireInteraction:
              true,

            data: {

              url:
                data.url ||
                data.link ||
                APPS_SCRIPT_EXEC_URL

            }

          }
        );

      } catch (error) {

        warn(
          "OS notification gagal:",
          error
        );

      }

    }


    /* ======================================================
       APP BADGE
       ====================================================== */

    async function setPAGBadge(
      count
    ) {

      try {

        const numericCount =
          Number(count);


        /*
         * Cara utama:
         * Badging API halaman.
         */

        if (
          typeof navigator.setAppBadge ===
          "function"
        ) {

          if (
            Number.isFinite(
              numericCount
            ) &&
            numericCount > 0
          ) {

            await navigator.setAppBadge(
              Math.min(
                Math.floor(
                  numericCount
                ),
                999
              )
            );

          } else {

            await navigator.setAppBadge();

          }


          return;

        }


        /*
         * Fallback:
         * Service Worker.
         */

        if (
          navigator.serviceWorker
        ) {

          const registration =
            _serviceWorkerRegistration ||
            await navigator.serviceWorker.ready;


          const target =
            navigator.serviceWorker.controller ||
            registration.active;


          if (target) {

            target.postMessage({

              type:
                "SET_BADGE",

              count:
                Number.isFinite(
                  numericCount
                )
                  ? numericCount
                  : null

            });

          }

        }

      } catch (error) {

        warn(
          "setPAGBadge error:",
          error
        );

      }

    }


    /* ======================================================
       CLEAR BADGE
       ====================================================== */

    async function clearPAGBadge() {

      try {

        if (
          typeof navigator.clearAppBadge ===
          "function"
        ) {

          await navigator.clearAppBadge();

        }


        if (
          navigator.serviceWorker
        ) {

          const registration =
            _serviceWorkerRegistration ||
            await navigator.serviceWorker.ready;


          const target =
            navigator.serviceWorker.controller ||
            registration.active;


          if (target) {

            target.postMessage({

              type:
                "CLEAR_BADGE"

            });

          }

        }

      } catch (error) {

        warn(
          "clearPAGBadge error:",
          error
        );

      }

    }


    /* ======================================================
       SW MESSAGE
       ====================================================== */

    navigator.serviceWorker?.addEventListener(
      "message",
      event => {

        const data =
          event.data;


        if (
          !data ||
          typeof data !== "object"
        ) {

          return;

        }


        if (
          data.type ===
          "PAG_SW_PONG"
        ) {

          log(
            "Service Worker:",
            data.version
          );

        }

      }
    );


    /* ======================================================
       PAGE VISIBILITY
       ====================================================== */

    /*
     * SENGAJA TIDAK digunakan untuk
     * memanggil ulang notification setup.
     *
     * Ini mencegah:
     *
     * "MENYIAPKAN NOTIFIKASI"
     *
     * muncul seperti splash screen
     * setiap kembali ke halaman.
     */

    document.addEventListener(
      "visibilitychange",
      () => {

        /*
         * Tidak melakukan apa-apa.
         */

      }
    );


    /* ======================================================
       IFRAME LOAD
       ====================================================== */

    appFrame.addEventListener(
      "load",
      () => {

        log(
          "Apps Script iframe loaded."
        );


        /*
         * Jika session sudah diketahui,
         * kirim ulang ke iframe.
         */

        if (
          _userSession
        ) {

          try {

            appFrame.contentWindow.postMessage(

              {

                type:
                  "PAG_SESSION_AVAILABLE",

                session:
                  _userSession

              },

              "*"

            );

          } catch (error) {

            warn(
              "Session postMessage gagal:",
              error
            );

          }

        }

      }
    );


    /* ======================================================
       SERVICE WORKER UPDATE
       ====================================================== */

    async function cekServiceWorkerUpdate() {

      try {

        if (
          _serviceWorkerRegistration
        ) {

          await _serviceWorkerRegistration.update();

        }

      } catch (error) {

        warn(
          "SW update check gagal:",
          error
        );

      }

    }


    /* ======================================================
       STARTUP
       ====================================================== */

    async function startup() {

      log(
        "PAG Docs startup:",
        SW_VERSION
      );


      getDeviceId();

      getDeviceLabel();


      /*
       * Jangan menunggu service worker.
       *
       * Jangan menunggu Supabase.
       *
       * Jangan menunggu subscription.
       *
       * Jangan menunggu push.
       *
       * Yang menentukan lock hanya
       * Notification.permission.
       */

      await mulaiPermissionWatcher();

      await cekPermissionAwal();


      /*
       * Update SW di background.
       */

      if (
        "serviceWorker" in navigator
      ) {

        setTimeout(
          () => {

            void cekServiceWorkerUpdate();

          },
          1500
        );

      }

    }


    /* ======================================================
       RUN
       ====================================================== */

    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        () => {

          void startup();

        },
        {
          once: true
        }
      );

    } else {

      void startup();

    }

  </script>

</body>
</html>
