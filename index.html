       ======================================================== -->

  <title>PT. Putra Aulia</title>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: Arial, Helvetica, sans-serif; background: #0f766e; /* Mencegah flash putih */
    }
    #app { width: 100%; height: 100%; position: relative; }

    /* ======================================================
     * 🚀 ANTI LAYAR PUTIH: SPLASH SCREEN BRANDED PAG
     * ====================================================== */
    #pagSplashScreen {
      position: absolute; inset: 0; z-index: 50;
      background: #ffffff; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #pagSplashScreen.loaded { opacity: 0; visibility: hidden; pointer-events: none; }
    
    .splash-logo {
      width: 76px; height: 76px; border-radius: 20px;
      background: #0f766e; color: #ffffff; font-size: 26px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 30px rgba(15, 118, 110, 0.3);
      animation: pulseLogo 1.6s infinite ease-in-out;
    }
    .splash-title { margin-top: 16px; font-size: 18px; font-weight: 800; color: #0f172a; }
    .splash-sub { font-size: 13px; color: #64748b; margin-top: 4px; }
    
    .progress-bar-wrap {
      width: 140px; height: 4px; background: #e2e8f0;
      border-radius: 4px; margin-top: 20px; overflow: hidden; position: relative;
    }
    .progress-bar-fill {
      width: 40%; height: 100%; background: #0f766e;
      border-radius: 4px; position: absolute;
      animation: moveProgress 1.2s infinite ease-in-out;
    }

    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes moveProgress {
      0% { left: -40%; width: 30%; }
      50% { width: 60%; }
      100% { left: 100%; width: 40%; }
    }

    /* ======================================================
     * NOTIFICATION LOCK (UTUH 100%)
     * ====================================================== */
    #notificationLock {
      position: fixed; inset: 0; z-index: 999999;
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: #f4f7f8;
    }
    #notificationLock.hidden { display: none !important; }

    .lockCard {
      width: min(430px, 100%); padding: 30px; border-radius: 20px;
      background: #ffffff; box-shadow: 0 15px 45px rgba(0, 0, 0, .12); text-align: center;
    }
    .lockLogo {
      width: 72px; height: 72px; margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 18px; background: #0f766e; color: white; font-size: 23px; font-weight: 800;
    }
    .lockCard h1 { margin: 0 0 10px; font-size: 21px; }
    .lockCard p { margin: 8px 0 18px; color: #5f6870; font-size: 14px; line-height: 1.6; }
    .lockButton {
      width: 100%; padding: 14px 20px; border: 0; border-radius: 11px;
      background: #0f766e; color: white; font-weight: 700; cursor: pointer;
    }
    .lockButton:disabled { opacity: .55; cursor: default; }
    .lockSmall { font-size: 12px !important; color: #7b858d !important; }

    #errorBox {
      display: none; margin-top: 14px; padding: 10px; border-radius: 9px;
      background: #fff1f1; color: #a33; font-size: 12px; text-align: left; word-break: break-word;
    }

    #appFrame {
      display: block; width: 100%; height: 100%; border: 0; background: #ffffff;
      transform: translateZ(0); /* Akselerasi Hardware GPU */
    }

    #btnEmergencyReload {
      display: none; margin-top: 18px; background: transparent;
      border: 1px solid #cbd5e1; color: #64748b; font-size: 12px;
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;
    }

    @media (max-width: 600px) {
      #notificationLock { padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); }
      .lockCard { padding: 24px 20px; border-radius: 18px; }
      .lockLogo { width: 64px; height: 64px; margin-bottom: 15px; }
      .lockCard h1 { font-size: 19px; }
    }
  </style>
</head>

<body>
<div id="app">

  <!-- =====================================================
       0. SPLASH SCREEN (MENGHAPUS LAYAR PUTIH SEJAK DETIK KE-0)
       ===================================================== -->
  <div id="pagSplashScreen">
    <div class="splash-logo">PAG</div>
    <div class="splash-title">PT. PUTRA AULIA</div>
    <div class="splash-sub">Memuat Sistem Dokumen & Tender...</div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill"></div></div>
    <button type="button" id="btnEmergencyReload" onclick="forceReloadApp()">Muat Ulang Aplikasi 🔄</button>
  </div>

  <!-- =====================================================
       1. SINGLE NOTIFICATION LOCK (UTUH)
       ===================================================== -->
  <div id="notificationLock" class="hidden" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="lockCard">
      <div class="lockLogo">PAG</div>
      <h1 id="lockTitle">Izin Notifikasi Diperlukan</h1>
      <p id="lockText">
        Aplikasi menggunakan notifikasi browser sebagai satu-satunya sistem pemberitahuan.
        Izinkan notifikasi untuk membuka aplikasi.
      </p>
      <button id="allowButton" class="lockButton" type="button">Aktifkan Notifikasi</button>
      <p class="lockSmall">by: Azhar</p>
      <div id="errorBox" role="alert"></div>
    </div>
  </div>

  <!-- =====================================================
       2. MAIN APPLICATION (HIGH PRIORITY FETCH)
       ===================================================== -->
  <iframe
    id="appFrame"
    title="PT. Putra Aulia"
    src="https://script.google.com/macros/s/AKfycbw9p0LNniGmxeuXBwpQgp-zrGLfDu2RJoToVHkoc4-iYskNwjwBvY_Z5jO75wbzzU-cuw/exec"
    loading="eager"
    fetchpriority="high"
    allow="geolocation; microphone; camera; display-capture; clipboard-read; clipboard-write;"
  ></iframe>

</div>

<script>
(() => {
  "use strict";

  /* ========================================================
   * CONFIG (UTUH 100%)
   * ======================================================== */
  const CONFIG = {
    APP_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbw9p0LNniGmxeuXBwpQgp-zrGLfDu2RJoToVHkoc4-iYskNwjwBvY_Z5jO75wbzzU-cuw/exec",
    SB_URL: "https://qywqxcvnlehmiqrkpwdd.supabase.co",
    SB_KEY: "sb_publishable_Trk4jYTk3nI93sFtmWO6Tg_-ps4vYLq",
    VAPID_PUBLIC_KEY: "BJA7AZcYbZ-m23nmGsoICga9u-MhkIOfaL4ZuYTF0lO0PyUQKztgodNHp3EjQxKXTfMq0eO0nIDEyi5SHlKEZPg",
    SW_PATH: "./sw.js",
    SW_SCOPE: "./",
    DEVICE_STORAGE: "PAG_DOCS_PUSH_DEVICE_ID",
    BADGE_STORAGE: "PAG_DOCS_UNREAD_COUNT",
    MAX_RETRY: 2,
    NETWORK_TIMEOUT: 12000
  };

  /* ========================================================
   * ELEMENT CACHING
   * ======================================================== */
  const lock = document.getElementById("notificationLock");
  const lockTitle = document.getElementById("lockTitle");
  const lockText = document.getElementById("lockText");
  const allowButton = document.getElementById("allowButton");
  const errorBox = document.getElementById("errorBox");
  const appFrame = document.getElementById("appFrame");
  const splash = document.getElementById("pagSplashScreen");
  const btnEmergency = document.getElementById("btnEmergencyReload");

  /* ========================================================
   * STATE & CACHE (UTUH 100%)
   * ======================================================== */
  let swRegistration = null;
  let initialized = false;
  let booting = false;
  let cachedVapidUint8 = null;

  let session = {
    user_id: null,
    role: null
  };

  const health = {
    secure: false,
    supported: false,
    permission: "unknown",
    serviceWorker: false,
    subscription: false,
    subscriptionSaved: false,
    standalone: false,
    lastError: null
  };

  /* ========================================================
   * LOG & ERROR UI (UTUH)
   * ======================================================== */
  const log = (...args) => console.log("[PAG]", ...args);
  const warn = (...args) => console.warn("[PAG]", ...args);
  const error = (...args) => console.error("[PAG]", ...args);

  function showError(message) {
    errorBox.textContent = String(message || "");
    errorBox.style.display = "block";
  }

  function clearError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
  }

  /* ========================================================
   * LOCK CONTROLS (UTUH)
   * ======================================================== */
  function showLock(title, message, buttonText) {
    lockTitle.textContent = title || "Notifikasi Diperlukan";
    lockText.textContent = message || "";
    allowButton.textContent = buttonText || "Aktifkan Notifikasi";
    lock.classList.remove("hidden");
    // Sembunyikan splash screen agar lock terlihat jelas
    if (splash) splash.classList.add("loaded");
  }

  function hideLock() {
    lock.classList.add("hidden");
  }

  /* ========================================================
   * OPEN / LOCK APPLICATION (DIPERCEPAT TANPA KEDIP PUTIH)
   * ======================================================== */
  function openApplication() {
    hideLock();
    if (appFrame.style.display !== "block") {
      appFrame.style.display = "block";
    }
    if (!appFrame.src) {
      appFrame.src = CONFIG.APP_SCRIPT_URL;
    }
  }

  function lockApplicationInstantly() {
    appFrame.style.display = "none";
    showBlockedState();
  }

  /* ⚡ LIFECYCLE: Hilangkan splash saat iframe selesai render */
  appFrame.onload = () => {
    setTimeout(() => {
      if (splash) splash.classList.add("loaded");
    }, 200);
  };

  // Watchdog: Jika Google Apps Script loading > 7 detik, munculkan tombol darurat
  setTimeout(() => {
    if (splash && !splash.classList.contains("loaded") && btnEmergency) {
      btnEmergency.style.display = "inline-block";
    }
  }, 7000);

  window.forceReloadApp = function() {
    if (splash) splash.classList.remove("loaded");
    appFrame.src = CONFIG.APP_SCRIPT_URL + (CONFIG.APP_SCRIPT_URL.indexOf("?") === -1 ? "?" : "&") + "t=" + Date.now();
  };

  /* ========================================================
   * DEVICE IDENTIFIER & METADATA (UTUH)
   * ======================================================== */
  function getDeviceId() {
    let id = localStorage.getItem(CONFIG.DEVICE_STORAGE);
    if (!id) {
      if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
        id = crypto.randomUUID();
      } else {
        id = "pag-" + Date.now() + "-" + Math.random().toString(36).slice(2);
      }
      localStorage.setItem(CONFIG.DEVICE_STORAGE, id);
    }
    return id;
  }

  function getDeviceLabel() {
    const ua = navigator.userAgent || "";
    if (/Android/i.test(ua)) return "Android";
    if (/iPhone|iPad|iPod/i.test(ua)) return "iOS";
    if (/Windows/i.test(ua)) return "Windows";
    if (/Macintosh|Mac OS/i.test(ua)) return "macOS";
    if (/Linux/i.test(ua)) return "Linux";
    return "Browser";
  }

  function isStandalonePWA() {
    return Boolean(
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
      window.navigator.standalone === true
    );
  }

  /* ========================================================
   * VAPID CRYPTO UTILS (UTUH)
   * ======================================================== */
  function vapidToUint8Array(base64) {
    if (cachedVapidUint8) return cachedVapidUint8;
    const padding = "=".repeat((4 - base64.length % 4) % 4);
    const base64Url = (base64 + padding).replace(/-/g, "+").replace(/_/g, "/");
    const raw = atob(base64Url);
    cachedVapidUint8 = Uint8Array.from([...raw].map(char => char.charCodeAt(0)));
    return cachedVapidUint8;
  }

  function subscriptionUsesCurrentVapid(subscription) {
    try {
      if (!subscription) return false;
      const configuredKey = vapidToUint8Array(CONFIG.VAPID_PUBLIC_KEY);
      const actualKey = subscription?.options?.applicationServerKey;
      if (!actualKey) return true;

      const actual = new Uint8Array(actualKey);
      if (actual.length !== configuredKey.length) return false;
      for (let i = 0; i < configuredKey.length; i++) {
        if (actual[i] !== configuredKey[i]) return false;
      }
      return true;
    } catch (errorValue) {
      warn("Tidak dapat memeriksa applicationServerKey:", errorValue);
      return true;
    }
  }

  /* ========================================================
   * NETWORK & SUPABASE FETCH (UTUH)
   * ======================================================== */
  async function fetchWithTimeout(url, options = {}, timeout = CONFIG.NETWORK_TIMEOUT) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  async function supabaseFetch(path, options = {}) {
    const response = await fetchWithTimeout(CONFIG.SB_URL + path, {
      ...options,
      headers: {
        apikey: CONFIG.SB_KEY,
        Accept: "application/json",
        ...(options.headers || {})
      }
    });

    const text = await response.text();
    if (!response.ok) throw new Error("Supabase " + response.status + ": " + text);
    if (!text) return null;
    try { return JSON.parse(text); } catch (_) { return text; }
  }

  async function retry(fn, maxRetry = CONFIG.MAX_RETRY) {
    let lastError = null;
    for (let attempt = 0; attempt <= maxRetry; attempt++) {
      try {
        return await fn(attempt);
      } catch (errorValue) {
        lastError = errorValue;
        if (attempt >= maxRetry) break;
        await new Promise(resolve => setTimeout(resolve, 400 * (attempt + 1)));
      }
    }
    throw lastError;
  }

  /* ========================================================
   * BADGE SYNC (UTUH)
   * ======================================================== */
  async function setBadge(count) {
    const n = Math.max(0, Math.min(999, Number(count) || 0));
    localStorage.setItem(CONFIG.BADGE_STORAGE, String(n));

    try {
      if (typeof navigator.setAppBadge === "function") {
        if (n > 0) {
          await navigator.setAppBadge(n);
        } else if (typeof navigator.clearAppBadge === "function") {
          await navigator.clearAppBadge();
        }
      }
    } catch (badgeError) {
      warn("Badge page:", badgeError);
    }

    try {
      const worker = swRegistration?.active;
      if (worker) {
        worker.postMessage({
          type: n > 0 ? "SET_APP_BADGE" : "CLEAR_APP_BADGE",
          count: n
        });
      }
    } catch (_) {}
  }

  /* ========================================================
   * SERVICE WORKER & SUBSCRIPTION ENGINE (UTUH 100%)
   * ======================================================== */
  async function getSwVersion() {
    return new Promise(resolve => {
      if (!swRegistration?.active) {
        resolve("unknown");
        return;
      }
      const channel = new MessageChannel();
      const timer = setTimeout(() => resolve("unknown"), 1200);
      channel.port1.onmessage = event => {
        clearTimeout(timer);
        resolve(event.data?.version || "unknown");
      };
      try {
        swRegistration.active.postMessage({ type: "PAG_SW_PING" }, [channel.port2]);
      } catch (errorValue) {
        clearTimeout(timer);
        resolve("unknown");
      }
    });
  }

  async function cleanupOldDeviceSubscriptions(endpoint) {
    const deviceId = getDeviceId();
    if (!deviceId || !endpoint) return;

    try {
      const query = "/rest/v1/web_push_subscriptions?device_id=eq." +
        encodeURIComponent(deviceId) + "&endpoint=neq." + encodeURIComponent(endpoint);
      await supabaseFetch(query, { method: "DELETE" });
      log("Subscription lama pada device dibersihkan.");
    } catch (errorValue) {
      warn("Cleanup subscription lama dilewati:", errorValue?.message || errorValue);
    }
  }

  async function saveSubscription(subscription) {
    const json = subscription.toJSON();
    const keys = json.keys || {};
    if (!json.endpoint || !keys.p256dh || !keys.auth) {
      throw new Error("Push subscription tidak lengkap.");
    }

    const row = {
      device_id: getDeviceId(),
      user_id: session.user_id || null,
      role: session.role || null,
      endpoint: json.endpoint,
      keys_p256dh: keys.p256dh,
      keys_auth: keys.auth,
      device_label: getDeviceLabel(),
      updated_at: new Date().toISOString()
    };

    await cleanupOldDeviceSubscriptions(json.endpoint);

    await supabaseFetch("/rest/v1/web_push_subscriptions?on_conflict=endpoint", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates,return=minimal"
      },
      body: JSON.stringify(row)
    });

    health.subscriptionSaved = true;
    log("Push subscription tersimpan di Supabase:", session.user_id, session.role);
  }

  async function registerServiceWorker() {
    swRegistration = await navigator.serviceWorker.register(CONFIG.SW_PATH, {
      scope: CONFIG.SW_SCOPE,
      updateViaCache: "none"
    });
    swRegistration = await navigator.serviceWorker.ready;
    health.serviceWorker = true;
    return swRegistration;
  }

  async function ensurePushSubscription() {
    if (!swRegistration) throw new Error("Service Worker belum siap.");
    if (Notification.permission !== "granted") throw new Error("Izin notifikasi belum granted.");

    let subscription = await swRegistration.pushManager.getSubscription();
    if (subscription) {
      const validKey = subscriptionUsesCurrentVapid(subscription);
      if (!validKey) {
        log("Subscription memakai VAPID key lama. Membuat baru...");
        try { await subscription.unsubscribe(); } catch (e) {}
        subscription = null;
      }
    }

    if (!subscription) {
      log("Mendaftarkan PushSubscription baru ke browser...");
      subscription = await swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: vapidToUint8Array(CONFIG.VAPID_PUBLIC_KEY)
      });
    }

    if (!subscription) throw new Error("PushSubscription gagal dibuat.");
    health.subscription = true;
    return subscription;
  }

  /* ========================================================
   * INITIALIZE PUSH (NON-BLOCKING IDLE EXECUTION)
   * ======================================================== */
  async function initializePush() {
    if (initialized) return true;
    if (booting) return false;
    booting = true;

    try {
      if (!window.isSecureContext) throw new Error("Aplikasi membutuhkan HTTPS.");
      if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
        throw new Error("Browser tidak mendukung Service Worker / Web Push.");
      }

      await registerServiceWorker();

      const subscription = await retry(async () => ensurePushSubscription());
      await retry(async () => saveSubscription(subscription));

      const oldBadge = Number(localStorage.getItem(CONFIG.BADGE_STORAGE) || 0);
      if (oldBadge > 0) await setBadge(oldBadge);

      initialized = true;
      log("Push system READY.");
      return true;

    } catch (errorValue) {
      error("Push background error:", errorValue);
      throw errorValue;
    } finally {
      booting = false;
    }
  }

  function runPushInBackground() {
    if ("requestIdleCallback" in window) {
      requestIdleCallback(() => initializePush().catch(e => warn("Background Push:", e)), { timeout: 3500 });
    } else {
      setTimeout(() => initializePush().catch(e => warn("Background Push:", e)), 1200);
    }
  }

  /* ========================================================
   * REAL-TIME PERMISSION MONITOR (UTUH)
   * ======================================================== */
  function setupRealtimePermissionMonitor() {
    try {
      if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: "notifications" }).then(permissionStatus => {
          permissionStatus.onchange = () => {
            log("Status izin berubah real-time:", permissionStatus.state);
            if (permissionStatus.state === "granted") {
              openApplication();
              runPushInBackground();
            } else {
              lockApplicationInstantly();
            }
          };
        }).catch(e => {
          warn("Permission query tidak didukung:", e);
        });
      }
    } catch(errQuery) {}
  }

  /* ========================================================
   * REQUEST PERMISSION (UTUH)
   * ======================================================== */
  async function requestNotificationPermission() {
    clearError();
    allowButton.disabled = true;

    try {
      if (Notification.permission === "denied") {
        showBlockedState();
        return;
      }

      if (Notification.permission === "granted") {
        openApplication();
        runPushInBackground();
        return;
      }

      const permission = await Notification.requestPermission();
      health.permission = permission;

      if (permission === "granted") {
        openApplication();
        runPushInBackground();
      } else if (permission === "denied") {
        showBlockedState();
      } else {
        showLock(
          "Notifikasi Belum Diizinkan",
          "Izinkan notifikasi agar Aplikasi dapat mengirim pemberitahuan penting.",
          "Aktifkan Notifikasi"
        );
      }

    } catch (errorValue) {
      error("Push init error:", errorValue);
      showError(errorValue?.message || String(errorValue));
      showLock(
        "Notifikasi Belum Siap",
        "Periksa koneksi internet Anda lalu coba lagi.",
        "Coba Lagi"
      );
    } finally {
      allowButton.disabled = false;
    }
  }

  /* ========================================================
   * BLOCKED STATE (UTUH)
   * ======================================================== */
  function showBlockedState() {
    showLock(
      "Aplikasi Diblokir",
      "Karena izin notifikasi telah diblokir di browser. Buka pengaturan browser - Izin - Izinkan Notifikasi - Reload.",
      "Saya Sudah Mengizinkan"
    );
    allowButton.disabled = false;
  }

  async function handleAllowButton() {
    clearError();

    if (Notification.permission === "denied") {
      if (Notification.permission === "granted") {
        openApplication();
        runPushInBackground();
      } else {
        showBlockedState();
      }
      return;
    }

    await requestNotificationPermission();
  }

  /* ========================================================
   * SESSION DARI IFRAME APPS SCRIPT (UTUH 100%)
   * ======================================================== */
  async function handleIframeMessage(event) {
    if (event.source !== appFrame.contentWindow) return;
    const data = event.data || {};
    if (typeof data !== "object") return;

    if (data.type === "SYNC_USER_SESSION") {
      session.user_id = data.user_id ?? data.userId ?? data.user?.id ?? null;
      session.role = data.role ?? data.user?.role ?? null;
      log("Session synced:", session.user_id, session.role);

      try {
        const subscription = await swRegistration?.pushManager?.getSubscription();
        if (subscription) await saveSubscription(subscription);
      } catch (errorValue) {
        warn("Update session error:", errorValue);
      }
    }

    if (data.type === "SET_APP_BADGE") await setBadge(data.count);
    if (data.type === "CLEAR_APP_BADGE") await setBadge(0);
  }

  function getPlatformMessage() {
    const ua = navigator.userAgent || "";
    const mobile = /Android|iPhone|iPad|iPod/i.test(ua);
    if (!mobile || isStandalonePWA()) return null;

    if (/iPhone|iPad|iPod/i.test(ua)) {
      return "Untuk menerima notifikasi Aplikasi secara optimal di iPhone/iPad, pasang Aplikasi ke Layar Utama sebagai PWA terlebih dahulu, kemudian buka Aplikasi dari ikon tersebut.";
    }
    return null;
  }

  /* ========================================================
   * FAST BOOT ENGINE (UTUH 100%)
   * ======================================================== */
  function boot() {
    if (("Notification" in window) && Notification.permission === "granted") {
      openApplication();
      runPushInBackground();
    }

    allowButton.addEventListener("click", handleAllowButton);
    window.addEventListener("message", handleIframeMessage);
    setupRealtimePermissionMonitor();

    if (!window.isSecureContext) {
      showLock("Koneksi Tidak Aman", "Web Push Aplikasi membutuhkan HTTPS.", "Tutup");
      allowButton.disabled = true;
      return;
    }

    if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
      showLock("Browser Tidak Mendukung", "Browser ini tidak mendukung Web Push. Gunakan browser modern seperti Chrome atau Edge.", "Tutup");
      allowButton.disabled = true;
      return;
    }

    if (Notification.permission === "granted") {
      return;
    }

    if (Notification.permission === "denied") {
      showBlockedState();
      return;
    }

    const mobileMessage = getPlatformMessage();
    if (mobileMessage) {
      showLock("Pasang Aplikasi Terlebih Dahulu", mobileMessage, "Saya Sudah Memasang");
      allowButton.addEventListener("click", async () => {
        if (isStandalonePWA()) {
          await requestNotificationPermission();
        } else {
          showLock("Aplikasi Belum Terpasang", mobileMessage, "Saya Sudah Memasang");
        }
      }, { once: true });
      return;
    }

    showLock(
      "Izin Notifikasi Diperlukan",
      "Aplikasi menggunakan notifikasi browser sebagai satu-satunya sistem pemberitahuan. Izinkan notifikasi untuk membuka aplikasi.",
      "Aktifkan Notifikasi"
    );
  }

  boot();

})();
</script>

</html>
