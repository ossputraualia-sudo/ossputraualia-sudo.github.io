<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PT. PUTRA AULIA KONSULTAN</title>
  
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PAG Docs">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

  <!-- OneSignal SDK Script -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "e9c3d005-53b3-4bef-8721-dd6062e20559",
        serviceWorkerPath: "/pag-docs/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/pag-docs/" }
      });
    });

    async function mintaIzinNotif() {
      try {
        if (!window.OneSignal) {
          alert("OneSignal belum siap atau diblokir ekstensi browser.");
          return;
        }
        await OneSignal.Notifications.requestPermission();
        await OneSignal.User.PushSubscription.optIn();
        alert("✅ Berhasil! Perangkat terdaftar.");
        var btn = document.getElementById('btnNotif');
        if (btn) btn.style.display = 'none';
      } catch (err) {
        alert("Gagal: " + err.message);
      }
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: Arial, sans-serif;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #btnNotif {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: #0f766e;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 50px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      z-index: 9999999;
    }
    #btnNotif:active { transform: scale(0.96); }
    #offlineBanner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #ef4444;
      color: #ffffff;
      text-align: center;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      z-index: 9999999;
    }
  </style>
</head>
<body>

  <div id="offlineBanner">⚠️ Anda sedang offline. Sambungkan internet untuk mengelola data.</div>

  <button id="btnNotif" onclick="mintaIzinNotif()">
    🔔 Aktifkan Notifikasi
  </button>

  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec" 
    allow="geolocation; microphone; camera">
  </iframe>

  <script>
    function checkConnection() {
      const banner = document.getElementById('offlineBanner');
      banner.style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online', checkConnection);
    window.addEventListener('offline', checkConnection);
  </script>
</body>
</html>
