<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PT. Putra Aulia Group</title>
  
  <meta name="theme-color" content="#f1f5f9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PT.PA">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #appFrame {
      width: 100%; height: 100%; border: none; display: block; background: #f8fafc;
      position: absolute; inset: 0; z-index: 1;
    }
    #setupModal {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, rgba(248,250,252,0.95) 0%, rgba(226,232,240,0.95) 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 999999;
      padding: 20px; overflow-y: auto;
    }
    .setup-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px; padding: 32px 24px; max-width: 420px; width: 100%;
      text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .brand-badge {
      display: inline-block; background: linear-gradient(135deg, #0d9488, #0f766e);
      color: #ffffff; font-weight: 800; font-size: 20px; padding: 8px 16px;
      border-radius: 12px; margin-bottom: 16px;
    }
    .action-box {
      background: #ffffff; border: 1px solid rgba(203, 213, 225, 0.8);
      border-radius: 16px; padding: 16px; margin-bottom: 14px; text-align: left;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .btn-action { padding: 9px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; }
    .btn-primary { background: linear-gradient(180deg, #0d9488 0%, #0f766e 100%); color: #ffffff; }
    .btn-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; cursor: pointer; }
    .status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; margin-right: 6px; }
    .status-indicator.active { background: #22c55e; }
  </style>
</head>
<body>

  <div id="setupModal">
    <div class="setup-card">
      <div class="brand-badge">P.A.G</div>
      <h2>PT. PUTRA AULIA GROUP</h2>
      <p style="font-size:13px; color:#475569; margin-bottom:24px;">Aktifkan notifikasi untuk menerima update tender walaupun aplikasi sedang di-minimize ke Excel.</p>

      <div class="action-box">
        <div>
          <h4 style="font-size:13.5px; font-weight:700;"><span class="status-indicator" id="notifIndicator"></span>🔔 Notifikasi Latar Belakang</h4>
          <p style="font-size:11.5px; color:#64748b;" id="notifDesc">Tetap menerima info saat laptop sedang membuka Excel/Word.</p>
        </div>
        <button id="btnNotif" type="button" class="btn-action btn-primary" onclick="daftarkanWebPushDevice()">Aktifkan</button>
      </div>

      <button type="button" style="width:100%; padding:14px; border-radius:14px; background:#0d9488; color:#fff; font-weight:700; border:none; cursor:pointer;" onclick="bukaAplikasiUtama()">
        Lanjutkan ke Aplikasi ➔
      </button>
    </div>
  </div>

  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec" 
    allow="clipboard-read; clipboard-write; geolocation; camera; microphone;"
  ></iframe>

  <script>
    var APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbxv0JKvRNzqaEmchKbCD-d9mX663iK4796xdSVu16MMctVJANt-o2tohk1hYHeqbj6wlA/exec";
    
    // ⚡ KUNCI RESMI SEPASANG DENGAN SUPABASE
    var VAPID_PUBLIC_KEY = "BFmbNUOxV304wqekMka5EzEwv7sAapDLaPzlDBN2M-fcbSX9osQvksqcMyBzYYXkls3Cz3o06ZIDz7xsvnzpl-Q";
    var SB_URL = "https://qywqxcvnlehmiqrkpwdd.supabase.co";
    var SB_KEY = "sb_publishable_Trk4jYTk3nI93sFtmWO6Tg_-ps4vYLq";

    var frame = document.getElementById('appFrame');
    var setupModal = document.getElementById('setupModal');
    var _isRegistering = false;

    function urlBase64ToUint8Array(base64String) {
      var padding = '='.repeat((4 - base64String.length % 4) % 4);
      var base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      var rawData = window.atob(base64);
      var outputArray = new Uint8Array(rawData.length);
      for (var i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    // Registrasi Service Worker Native
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').then(function() {
          cekStatusSub();
        });
      });
    }

    // ⚡ PENDAFTARAN PINTAR (ANTI-DOBEL & ANTI-MATI)
    async function daftarkanWebPushDevice(targetRole, targetUserId) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      if (_isRegistering) return; // Mencegah 2 panggilan bertabrakan
      _isRegistering = true;

      try {
        var permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          _isRegistering = false;
          return;
        }

        var reg = await navigator.serviceWorker.ready;
        var sub = await reg.pushManager.getSubscription();

        // Hanya unsubscribe jika kunci browser berbeda dengan kunci resmi kita
        var currentSavedKey = localStorage.getItem('PAG_VAPID_ACTIVE_KEY');
        if (sub && currentSavedKey !== VAPID_PUBLIC_KEY) {
          try {
            await sub.unsubscribe();
            sub = null;
          } catch(e) {}
        }

        // Buat subscription murni jika belum ada
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });
          localStorage.setItem('PAG_VAPID_ACTIVE_KEY', VAPID_PUBLIC_KEY);
        }

        var subJson = sub.toJSON();
        var currentRole = (targetRole || localStorage.getItem('PAG_USER_ROLE') || 'superuser').toLowerCase().trim();
        var currentUserId = targetUserId || localStorage.getItem('PAG_USER_ID') || '';

        var payload = {
          role: currentRole,
          user_id: currentUserId,
          endpoint: subJson.endpoint,
          keys_p256dh: subJson.keys.p256dh,
          keys_auth: subJson.keys.auth,
          updated_at: new Date().toISOString()
        };

        // ⚡ BERSIHKAN TOKEN LAMA DI SUPABASE AGAR TIDAK MENUMPUK (ANTI-DOBEL)
        await fetch(SB_URL + '/rest/v1/web_push_subscriptions?role=eq.' + currentRole, {
          method: 'DELETE',
          headers: {
            'apikey': SB_KEY,
            'Authorization': 'Bearer ' + SB_KEY
          }
        });

        // MASUKKAN TOKEN TUNGGAL YANG HIDUP DAN SAH
        await fetch(SB_URL + '/rest/v1/web_push_subscriptions', {
          method: 'POST',
          headers: {
            'apikey': SB_KEY,
            'Authorization': 'Bearer ' + SB_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        cekStatusSub();
        console.log("✅ Pendaftaran tunggal sukses ke Supabase!");

      } catch (err) {
        console.error('Web Push Error:', err);
      } finally {
        _isRegistering = false;
      }
    }

    function cekStatusSub() {
      var btn = document.getElementById('btnNotif');
      var desc = document.getElementById('notifDesc');
      var indicator = document.getElementById('notifIndicator');

      if (Notification.permission === 'granted') {
        if (btn) { 
          btn.textContent = 'Aktif ✔'; 
          btn.className = 'btn-action btn-success'; 
          btn.disabled = false; // Tetap aktif agar bisa diklik ulang jika butuh sinkron
        }
        if (desc) { desc.textContent = 'Notifikasi Windows aktif (tembus ke Excel saat di-minimize/close).'; }
        if (indicator) { indicator.classList.add('active'); }
      }
    }

    // Jembatan Penampil Banner Windows
    function picuBannerResmiWindows(judul, pesan, targetUrl) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;

      var iconUrl = new URL('icon-192.png', window.location.origin).href;
      var options = {
        body: pesan || '',
        icon: iconUrl,
        badge: iconUrl,
        data: { url: targetUrl || '#' },
        tag: 'pag-os-' + Date.now(),
        renotify: true,
        requireInteraction: true
      };

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(function(reg) {
          reg.showNotification(judul || 'P.A.G Docs', options);
        });
      }
    }

    // Tangkap sinyal sesi login dari dalam iframe Apps Script
    window.addEventListener('message', function(event) {
      if (!event.data) return;
      var data = event.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch(e) { return; }
      }

      if (data.type === 'SHOW_OS_NOTIFICATION') {
        picuBannerResmiWindows(data.judul, data.pesan, data.url);
      }

      if (data.type === 'SYNC_USER_SESSION' && data.role) {
        localStorage.setItem('PAG_USER_ROLE', data.role);
        if (data.userId) localStorage.setItem('PAG_USER_ID', data.userId);
        daftarkanWebPushDevice(data.role, data.userId);
      }
    });

    function bukaAplikasiUtama() {
      localStorage.setItem('PAG_SETUP_DONE', 'true');
      if (setupModal) setupModal.style.display = 'none';
    }

    if (localStorage.getItem('PAG_SETUP_DONE') === 'true') {
      if (setupModal) setupModal.style.display = 'none';
    }

    window.addEventListener('hashchange', function() {
      var hash = window.location.hash || '';
      if (frame && hash) {
        try { frame.contentWindow.location.hash = hash; } catch (e) { frame.src = APPS_SCRIPT_EXEC_URL + hash; }
      }
    });
  </script>
</body>
</html>
